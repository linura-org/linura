<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Qualification-only sender grant. This file is never installed as a
       product asset; it lets the v0.5 disposable guest exercise the executor
       after the product D-Bus boundary became authority-only in v0.6. -->
  <policy user="linura-v05-qualifier">
    <allow send_destination="org.linura.Executor.Systemd1"/>
  </policy>
</busconfig>
