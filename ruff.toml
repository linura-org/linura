line-length = 88
target-version = "py312"
preview = false

[per-file-target-version]
"bindings/python/**/*.py" = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
