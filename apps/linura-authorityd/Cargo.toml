[package]
name = "linura-authorityd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
v09-migration-qualification = [
    "dep:linura-intent",
    "dep:linura-library",
    "dep:linura-migrations",
    "dep:linura-planner",
]

[dependencies]
async-io = "2.6"
futures-lite = "2.6"
serde = "1.0"
linura-control = { path = "../../crates/linura-control" }
linura-core = { path = "../../crates/linura-core" }
linura-intent = { path = "../../crates/linura-intent", optional = true }
linura-library = { path = "../../crates/linura-library", optional = true }
linura-migrations = { path = "../../crates/linura-migrations", optional = true, features = ["qualification-harness"] }
linura-dbus = { path = "../../crates/linura-dbus" }
linura-executor-systemd = { path = "../../executors/linura-executor-systemd" }
linura-executor-session = { path = "../../executors/linura-executor-session" }
linura-observation = { path = "../../crates/linura-observation" }
linura-linux-observation = { path = "../../crates/linura-linux-observation" }
linura-linux-session = { path = "../../crates/linura-linux-session" }
linura-observation-control = { path = "../../crates/linura-observation-control" }
linura-persistence-sqlite = { path = "../../crates/linura-persistence-sqlite" }
linura-planner = { path = "../../crates/linura-planner", optional = true }
linura-protocol = { path = "../../crates/linura-protocol" }
linura-provider-sdk = { path = "../../crates/linura-provider-sdk" }
linura-transaction = { path = "../../crates/linura-transaction" }
rustix = { version = "1.1", features = ["process", "time"] }
linura-verifier-systemd = { path = "../../verifiers/linura-verifier-systemd" }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[[bin]]
name = "linura-migrations-qualification"
path = "src/bin/linura-migrations-qualification.rs"
required-features = ["v09-migration-qualification"]

[lints]
workspace = true
