name: RFC / architecture proposal
description: Start tracked work for a cross-cutting design proposal
title: "rfc: "
labels:
  - rfc
body:
  - type: markdown
    attributes:
      value: |
        Use GitHub Discussions for early exploration. Use this form when the proposal is concrete enough to track.
        Security vulnerabilities must be reported privately under SECURITY.md rather than disclosed here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What durable problem or contract gap requires a decision?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and trust-boundary impact
      description: What becomes authoritative, privileged, persistent, remotely reachable, or release-relevant?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, migration, and recovery
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      description: Link an Architecture & RFCs Discussion when one exists.
