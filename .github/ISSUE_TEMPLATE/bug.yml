name: Bug report
description: Report a reproducible defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or private identifiers. If this may be a security vulnerability, stop and follow SECURITY.md instead of filing publicly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distro, kernel, systemd, compositor, provider versions, Linura version/commit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
