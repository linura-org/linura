name: Feature request
description: Propose a capability, provider, or product behavior
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or private identifiers. If this may be a security vulnerability, stop and follow SECURITY.md instead of filing publicly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security / platform / compatibility implications
