version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-nonbreaking:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # CodeQL init and analyze share one process-wide action configuration.
    # Updating them in separate PRs causes a runtime version mismatch.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
