name: Release Preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-preparation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify reviewed release readiness
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: ready v') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      tag: ${{ steps.qualify.outputs.tag }}
      theme: ${{ steps.qualify.outputs.theme }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact protected-main release-readiness source
        id: qualify
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"

          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import os
          import re
          import sys

          subject, output_path = sys.argv[1:]
          match = re.fullmatch(
              r"release: ready (?P<tag>v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-readiness subject: {subject!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"source_sha={os.environ['SOURCE_SHA']}\n")
              handle.write(f"tag={match.group('tag')}\n")
              handle.write(f"theme={match.group('theme')}\n")
          PY

          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          theme="$(sed -n 's/^theme=//p' "$GITHUB_OUTPUT" | tail -1)"
          python3 - "$tag" "$theme" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag, theme = sys.argv[1:]
          roadmap = tomllib.loads(pathlib.Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          if roadmap.get("next_release") != tag:
              raise SystemExit(f"readiness tag is not roadmap next_release: {tag} != {roadmap.get('next_release')}")
          milestones = {item["version"]: item for item in roadmap["milestone"]}
          milestone = milestones.get(tag)
          if milestone is None or milestone.get("status") != "planned":
              raise SystemExit(f"readiness milestone is not planned: {tag}")
          if milestone.get("title") != theme:
              raise SystemExit(
                  f"readiness theme does not match roadmap title: {theme!r} != {milestone.get('title')!r}"
              )
          required = [
              milestone.get("milestone_contract"),
              milestone.get("release_contract"),
              milestone.get("qualification"),
              f"docs/qualification/{tag}-security.md",
              f"docs/qualification/{tag}-release-review.md",
          ]
          for value in required:
              if not isinstance(value, str) or not pathlib.Path(value).is_file():
                  raise SystemExit(f"release-readiness material is missing: {value!r}")
          PY

          python3 tools/check_roadmap.py .
          python3 tools/check_release_publication_stability.py
          python3 tools/release_contract.py validate \
            --tag "$tag" \
            --notes "docs/releases/${tag}.md"

          prs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls")"
          # shellcheck disable=SC2016
          pr_number="$(jq -r --arg sha "$SOURCE_SHA" --arg subject "$subject" '
            [.[] | select(
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha and
              .title == $subject
            )]
            | if length == 1 then .[0].number else empty end
          ' <<<"$prs")"
          [[ "$pr_number" =~ ^[0-9]+$ ]]

          # GraphQL variables are intentionally literal inside the single-quoted query.
          # shellcheck disable=SC2016
          unresolved="$(gh api graphql --paginate \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="$pr_number" \
            -F endCursor=null \
            -f query='
              query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100, after:$endCursor) {
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' |
            awk '{ total += $1 } END { print total + 0 }')"
          test "$unresolved" = "0"

  prepare:
    name: create and merge deterministic mechanical preparation
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
      RELEASE_THEME: ${{ needs.qualify.outputs.theme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Require dedicated Release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APP_CLIENT_ID" || { echo "missing repository variable LINURA_RELEASE_APP_CLIENT_ID" >&2; exit 2; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo "missing repository secret LINURA_RELEASE_APP_PRIVATE_KEY" >&2; exit 2; }

      - name: Mint repository-scoped Release App token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Prove Release App automation authority
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --base main \
            --head main \
            --credential-source github-app
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$SOURCE_SHA" \
            --head-branch main \
            --timeout-seconds 1800 \
            commit --event push

      - name: Build or re-prove SHA-addressed mechanical preparation
        id: candidate
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"

          python3 tools/prepare_release.py --tag "$RELEASE_TAG"
          python3 tools/check_roadmap.py .
          python3 tools/check_release_publication_stability.py
          python3 tools/release_contract.py validate \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/${RELEASE_TAG}.md" \
            --require-workspace-version
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "Cargo.lock"
          test "${changed[1]}" = "Cargo.toml"

          title="release: prepare $RELEASE_TAG $RELEASE_THEME"
          existing_json="$(gh pr list --state open --base main --json number,title,headRefName,headRefOid)"
          # shellcheck disable=SC2016
          existing="$(jq -c --arg title "$title" '[.[] | select(.title == $title)] | first // empty' <<<"$existing_json")"

          verify_candidate() {
            local pr_number="$1"
            local candidate_sha="$2"
            local candidate_branch="$3"
            [[ "$pr_number" =~ ^[0-9]+$ ]]
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$candidate_branch" = "automation/release-prep-${RELEASE_TAG}-${candidate_sha}"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$candidate_branch" --jq .object.sha)" = "$candidate_sha"
            pr_payload="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            test "$(jq -r .base.sha <<<"$pr_payload")" = "$SOURCE_SHA"
            test "$(jq -r .head.sha <<<"$pr_payload")" = "$candidate_sha"
            test "$(jq -r .head.ref <<<"$pr_payload")" = "$candidate_branch"
            test "$(jq -r .title <<<"$pr_payload")" = "$title"
            test "$(jq -r .changed_files <<<"$pr_payload")" = "2"
            candidate_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$candidate_sha")"
            test "$(jq '.parents | length' <<<"$candidate_payload")" = "1"
            test "$(jq -r '.parents[0].sha' <<<"$candidate_payload")" = "$SOURCE_SHA"
            test "$(jq -r '.message | split("\n")[0]' <<<"$candidate_payload")" = "$title"
            git fetch origin "refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch" --force
            mapfile -t candidate_changed < <(git diff --name-only "$SOURCE_SHA" "$candidate_sha")
            test "${#candidate_changed[@]}" -eq 2
            test "${candidate_changed[0]}" = "Cargo.lock"
            test "${candidate_changed[1]}" = "Cargo.toml"
            git show "$candidate_sha:Cargo.toml" | cmp - Cargo.toml
            git show "$candidate_sha:Cargo.lock" | cmp - Cargo.lock
          }

          if [[ -n "$existing" ]]; then
            pr_number="$(jq -r .number <<<"$existing")"
            head_sha="$(jq -r .headRefOid <<<"$existing")"
            branch="$(jq -r .headRefName <<<"$existing")"
            verify_candidate "$pr_number" "$head_sha" "$branch"
          else
            git switch --detach "$SOURCE_SHA"
            app_user_id="$(gh api "users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
            [[ "$app_user_id" =~ ^[0-9]+$ ]]
            git config user.name "${RELEASE_APP_SLUG}[bot]"
            git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "$title"
            head_sha="$(git rev-parse HEAD)"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            branch="automation/release-prep-${RELEASE_TAG}-${head_sha}"
            gh auth setup-git
            git push origin "HEAD:refs/heads/$branch"

            cat > "$RUNNER_TEMP/body.md" <<EOF
          Deterministic mechanical preparation for reviewed release-readiness source \`$SOURCE_SHA\`.

          This PR changes exactly \`Cargo.toml\` and \`Cargo.lock\` to advance the workspace to $RELEASE_TAG. Product claims, qualification narratives, authority boundaries and roadmap release state were already reviewed on the preceding \`release: ready\` source.

          Native PR CI/Security/CodeQL are the ruleset-authoritative gates. No conversational review is required for this structurally constrained mechanical handoff.
          EOF
            url="$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            pr_number="${url##*/}"
            verify_candidate "$pr_number" "$head_sha" "$branch"
          fi

          {
            printf 'branch=%s\n' "$branch"
            printf 'pr_number=%s\n' "$pr_number"
            printf 'head_sha=%s\n' "$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Require GitHub-native PR gates and clean ruleset state
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 1800 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$SOURCE_SHA" \
            --expected-changed-files 2

      - name: Re-prove and squash merge exact mechanical preparation
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "automation/release-prep-${RELEASE_TAG}-${HEAD_SHA}"
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 0 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$SOURCE_SHA" \
            --expected-changed-files 2
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD_SHA"

          candidate_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA")"
          test "$(jq '.parents | length' <<<"$candidate_payload")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$candidate_payload")" = "$SOURCE_SHA"
          title="release: prepare $RELEASE_TAG $RELEASE_THEME"
          test "$(jq -r '.message | split("\n")[0]' <<<"$candidate_payload")" = "$title"
          mapfile -t candidate_changed < <(git diff --name-only "$SOURCE_SHA" "$HEAD_SHA")
          test "${#candidate_changed[@]}" -eq 2
          test "${candidate_changed[0]}" = "Cargo.lock"
          test "${candidate_changed[1]}" = "Cargo.toml"
          candidate_tree="$(jq -r .tree.sha <<<"$candidate_payload")"

          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="$title" \
            -f commit_message="Mechanical release preparation for reviewed source $SOURCE_SHA. Product claims are unchanged.")"
          test "$(jq -r .merged <<<"$result")" = "true"
          main_sha="$(jq -r .sha <<<"$result")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$main_sha"

          merged="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$main_sha")"
          test "$(jq '.parents | length' <<<"$merged")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$merged")" = "$SOURCE_SHA"
          test "$(jq -r .tree.sha <<<"$merged")" = "$candidate_tree"
          test "$(jq -r '.message | split("\n")[0]' <<<"$merged")" = "$title"
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Confirm event-driven authorization handoff
        run: |
          set -euo pipefail
          test -f .github/workflows/release-authorization.yml
          echo "mechanical preparation merged at ${{ steps.merge.outputs.main_sha }}; its Release App push event owns the authorization transition"
