name: CI

run-name: "${{ github.workflow }} :: ${{ github.event_name == 'pull_request' && format('PR{0} :: {1}', github.event.pull_request.number, github.sha) || (inputs.dispatch_nonce || github.sha) }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: Optional release-control correlation nonce
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  canonical-check:
    runs-on: ubuntu-24.04
    steps:
      # The publisher owns a required merge authority. Its tests are part of
      # canonical CI, not solely a path-filtered optional qualification lane.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Node runtime for trusted publisher tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Validate trusted qualification publisher in canonical CI
        env:
          NODE_OPTIONS: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          
          def deny(message):
              raise SystemExit("publisher source provenance denied: " + message)
          
          sha = os.environ.get("GITHUB_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              deny("invalid triggering SHA")
          git_env = {"PATH": "/usr/bin:/bin", "HOME": "/nonexistent",
                     "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null",
                     "GIT_NO_REPLACE_OBJECTS": "1"}
          
          def git(*args):
              result = subprocess.run(["/usr/bin/git", *args], env=git_env,
                                      check=False, stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL, timeout=20)
              if result.returncode:
                  deny("cannot read source commit")
              return result.stdout
          
          if git("rev-parse", "--verify", "HEAD^{commit}").strip().decode("ascii") != sha:
              deny("checkout is not the triggering revision")
          scopes = (".github/workflows/ci.yml", "tools/check_validation_gates.py",
                    "tests/tooling/test_validation_gates.py", "services/qualification-publisher")
          raw_tree = git("ls-tree", "-r", "-z", "--full-tree", sha, "--", *scopes)
          expected = {}
          for item in raw_tree.split(b"\x00"):
              if not item:
                  continue
              try:
                  info, path = item.split(b"\t", 1)
                  mode, kind, digest = info.split(b" ")
                  name = path.decode("utf-8")
              except (ValueError, UnicodeDecodeError):
                  deny("malformed source tree")
              if (mode not in (b"100644", b"100755") or kind != b"blob"
                      or not re.fullmatch(rb"[0-9a-f]{40}", digest)
                      or name in expected):
                  deny("unsafe source tree entry")
              expected[name] = digest.decode("ascii")
          root = Path.cwd()
          seen = set()
          def visit(path):
              if path.is_symlink():
                  deny("source symlink")
              if path.is_dir():
                  for entry in path.iterdir():
                      visit(entry)
              elif path.is_file():
                  relative = path.relative_to(root).as_posix()
                  if relative not in expected:
                      deny("unexpected source file")
                  data = path.read_bytes()
                  actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii")
                                        + b"\x00" + data).hexdigest()
                  if actual != expected[relative]:
                      deny("source differs from triggering commit")
                  seen.add(relative)
              else:
                  deny("missing or special source entry")
          for scope in scopes:
              path = root / scope
              if not path.exists() and not path.is_symlink():
                  deny("missing protected source")
              visit(path)
          if seen != set(expected) or len(seen) < 6:
              deny("incomplete protected source inventory")
          print("publisher tests bound to triggering source SHA")
          PY
          /usr/bin/python3 -I -S tools/check_validation_gates.py
          test "$(/usr/bin/env -i PATH="$PATH" LANG=C.UTF-8 node --version)" = 'v22.23.3'
          /usr/bin/env -i PATH="$PATH" LANG=C.UTF-8 node --check services/qualification-publisher/publisher.mjs
          /usr/bin/env -i PATH="$PATH" LANG=C.UTF-8 node --check services/qualification-publisher/server.mjs
          /usr/bin/env -i PATH="$PATH" LANG=C.UTF-8 node --test services/qualification-publisher/test/*.test.mjs
      - name: Validate Python tooling syntax before builds
        run: python3 -m compileall -q scripts tools tests/tooling
      - name: Validate CI dependency cache policy before builds
        run: python3 tools/check_ci_cache_policy.py
      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'CARGO_AUDIT_VERSION=%s\n' "$CARGO_AUDIT_VERSION"
            printf 'ACTIONLINT_VERSION=%s\n' "$ACTIONLINT_VERSION"
            printf 'ACTIONLINT_SHA256=%s\n' "$ACTIONLINT_SHA256"
            printf 'PYTHON_MAJOR_MINOR=%s\n' "$PYTHON_MAJOR_MINOR"
            printf 'HOST_OS=%s\n' "$HOST_OS"
            printf 'HOST_ARCH=%s\n' "$HOST_ARCH"
          } >> "$GITHUB_ENV"
      - name: Verify canonical host contract
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$HOST_OS"
          test "$(uname -m)" = "$HOST_ARCH"
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "$PYTHON_MAJOR_MINOR"
          repo_rust_version="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('rust-toolchain.toml').read_text(encoding='utf-8')
          match = re.search(r'^channel\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('rust-toolchain.toml does not declare a channel')
          print(match.group(1))
          PY
          )"
          test "$repo_rust_version" = "$RUST_VERSION"
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" actionlint
          bash scripts/lint_github_workflows.sh "$install_dir/actionlint"

          regression="$RUNNER_TEMP/invalid-job-env-runner.yml"
          cat > "$regression" <<'YAML'
          name: invalid-job-env-runner
          on: workflow_dispatch
          jobs:
            proof:
              runs-on: ubuntu-latest
              env:
          YAML
          printf '      PROOF_DIR: $%s runner.temp }}/proof\n' '{{' >> "$regression"
          cat >> "$regression" <<'YAML'
              steps:
                - run: echo unreachable
          YAML
          if "$install_dir/actionlint" "$regression" >"$RUNNER_TEMP/actionlint-regression.log" 2>&1; then
            echo "actionlint failed to reject the job-level runner context regression" >&2
            exit 1
          fi
          grep -F 'context "runner" is not allowed here' "$RUNNER_TEMP/actionlint-regression.log"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Restore Cargo dependency inputs
        uses: ./.github/actions/cargo-input-cache
        with:
          namespace: canonical-ci
          rust-version: ${{ env.RUST_VERSION }}

      - name: Install Linura Shell bridge build dependencies
        uses: ./.github/actions/ubuntu-apt-input-cache
        with:
          namespace: canonical-ci-shell
          packages: |
            cmake
            ninja-build
            pkg-config
            qt6-base-dev
            qt6-declarative-dev
      - name: Build and install Linura Shell QML modules
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/linura-shell-bridge-build"
          install_dir="$RUNNER_TEMP/linura-shell-bridge-install"
          cmake -S apps/linura-shell/bridge -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" --parallel 2
          cmake --install "$build_dir" --prefix "$install_dir"

          module_dir="$install_dir/lib/qt6/qml/org/linura/ShellBridge"
          bridge_plugin="$module_dir/liblinura-shell-bridgeplugin.so"
          bridge_backing="$module_dir/liblinura-shell-bridge.so"
          test -f "$module_dir/qmldir"
          find "$module_dir" -maxdepth 1 -type f -name '*.qmltypes' -print -quit | grep -q .
          test -f "$bridge_plugin"
          test -f "$bridge_backing"
          bridge_linkage="$(ldd "$bridge_plugin")"
          printf '%s\n' "$bridge_linkage"
          if grep -Fq 'not found' <<<"$bridge_linkage"; then
            echo "Linura ShellBridge QML plugin has unresolved installed dependencies" >&2
            exit 1
          fi
          grep -Fq "liblinura-shell-bridge.so => $bridge_backing" <<<"$bridge_linkage"

          ui_build_dir="$RUNNER_TEMP/linura-ui-build"
          cmake -S apps/linura-shell/ui -B "$ui_build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$ui_build_dir" --parallel 2
          cmake --install "$ui_build_dir" --prefix "$install_dir"

          ui_module_dir="$install_dir/lib/qt6/qml/org/linura/UI"
          ui_plugin="$ui_module_dir/liblinura-uiplugin.so"
          ui_backing="$ui_module_dir/liblinura-ui.so"
          test -f "$ui_module_dir/qmldir"
          find "$ui_module_dir" -maxdepth 1 -type f -name '*.qmltypes' -print -quit | grep -q .
          test -f "$ui_plugin"
          test -f "$ui_backing"
          ui_linkage="$(ldd "$ui_plugin")"
          printf '%s\n' "$ui_linkage"
          if grep -Fq 'not found' <<<"$ui_linkage"; then
            echo "Linura UI QML plugin has unresolved installed dependencies" >&2
            exit 1
          fi
          grep -Fq "liblinura-ui.so => $ui_backing" <<<"$ui_linkage"
      - name: Run canonical Linura checks
        run: cargo xtask check
      - name: Verify canonical crates.io package
        run: cargo package --locked -p linura
      - name: Verify canonical PyPI package
        run: |
          set -euo pipefail
          PYTHONPATH=bindings/python/src python3 -m unittest discover \
            -s bindings/python/tests -p 'test_*.py'

          dist_dir="$RUNNER_TEMP/linura-python-dist"
          install_dir="$RUNNER_TEMP/linura-python-install"
          rm -rf "$dist_dir" "$install_dir"
          mkdir -p "$dist_dir" "$install_dir"

          python3 -m pip wheel \
            --disable-pip-version-check \
            --no-deps \
            --wheel-dir "$dist_dir" \
            ./bindings/python
          python3 -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --target "$install_dir" \
            "$dist_dir"/linura-*.whl

          PYTHONPATH="$install_dir" python3 - <<'PY'
          import linura

          assert linura.__version__ == "0.0.1"
          assert linura.CONTROL1_SERVICE == "org.linura.Control1"
          assert linura.find_installation(path="") is None
          PY
      - name: Verify canonical checks are non-mutating
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find packaging scripts -type f -name '*.sh' -print0)

      - name: Bind qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        with:
          lane: canonical-ci
          source-sha: ${{ github.sha }}
