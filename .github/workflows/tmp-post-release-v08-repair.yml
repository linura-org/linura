name: Temporary v0.8 post-release closure repair

on:
  push:
    branches:
      - fix/post-release-v08-milestone-status
    paths:
      - .github/workflows/tmp-post-release-v08-repair.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mint repository-scoped Release App token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Patch closure status projection and regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tools/post_release_close.py")
          text = source.read_text(encoding="utf-8")
          old = '''    milestone_text = read(milestone_path)
              milestone_text = replace_once(
                  milestone_text,
                  "**Status:** release candidate; publication pending",
                  "**Status:** released",
                  f"{args.tag} milestone status",
              )
              milestone_text = close_release_control_criteria(milestone_text, args.tag)
          '''
          new = '''    milestone_text = read(milestone_path)
              # The machine roadmap plus verified immutable release evidence are authoritative.
              # The Markdown status is a human-facing projection whose pre-release wording may
              # legitimately evolve between milestones; require exactly one projection field
              # and normalize it structurally instead of coupling closure to historical prose.
              status_pattern = re.compile(r"(?m)^\\*\\*Status:\\*\\* (?P<value>[^\\n]+)$")
              status_matches = list(status_pattern.finditer(milestone_text))
              if len(status_matches) != 1:
                  raise ClosureError(
                      f"{args.tag} milestone status: expected exactly one Status field, found {len(status_matches)}"
                  )
              status_match = status_matches[0]
              status_value = status_match.group("value").strip()
              if status_value.casefold().startswith("released"):
                  raise ClosureError(
                      f"{args.tag} milestone status is already released while machine roadmap still requires closure"
                  )
              milestone_text = (
                  milestone_text[: status_match.start()]
                  + "**Status:** released"
                  + milestone_text[status_match.end() :]
              )
              milestone_text = close_release_control_criteria(milestone_text, args.tag)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one legacy milestone-status block, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/tooling/test_post_release_close.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = '''            self.assertIn("- [x] Protected proof-first/tag-last publication", milestone)

              def test_terminal_provenance_uses_full_canonical_commit_url(self) -> None:
          '''
          insertion = '''            self.assertIn("- [x] Protected proof-first/tag-last publication", milestone)

              def test_closure_normalizes_evolved_pre_release_milestone_status_projection(self) -> None:
                  with tempfile.TemporaryDirectory() as temp_dir:
                      root = Path(temp_dir)
                      self._fixture(root)
                      milestone = root / "docs/milestones/v0.5.0.md"
                      text = milestone.read_text(encoding="utf-8")
                      milestone.write_text(
                          text.replace(
                              "**Status:** release candidate; publication pending",
                              "**Status:** implementation qualified; release-readiness finalization complete; terminal publication evidence remains controlled by the protected release lifecycle",
                              1,
                          ),
                          encoding="utf-8",
                      )

                      post_release_close.close_release(Args(root))

                      updated = milestone.read_text(encoding="utf-8")
                      self.assertIn("**Status:** released", updated)
                      self.assertNotIn("release-readiness finalization complete", updated)

              def test_closure_rejects_multiple_milestone_status_projection_fields(self) -> None:
                  with tempfile.TemporaryDirectory() as temp_dir:
                      root = Path(temp_dir)
                      self._fixture(root)
                      milestone = root / "docs/milestones/v0.5.0.md"
                      text = milestone.read_text(encoding="utf-8")
                      status = "**Status:** release candidate; publication pending"
                      milestone.write_text(text.replace(status, f"{status}\\n{status}", 1), encoding="utf-8")

                      with self.assertRaisesRegex(
                          post_release_close.ClosureError,
                          "expected exactly one Status field, found 2",
                      ):
                          post_release_close.close_release(Args(root))

              def test_closure_rejects_released_milestone_projection_when_machine_state_is_pending(self) -> None:
                  with tempfile.TemporaryDirectory() as temp_dir:
                      root = Path(temp_dir)
                      self._fixture(root)
                      milestone = root / "docs/milestones/v0.5.0.md"
                      text = milestone.read_text(encoding="utf-8")
                      milestone.write_text(
                          text.replace(
                              "**Status:** release candidate; publication pending",
                              "**Status:** released",
                              1,
                          ),
                          encoding="utf-8",
                      )

                      with self.assertRaisesRegex(
                          post_release_close.ClosureError,
                          "already released while machine roadmap still requires closure",
                      ):
                          post_release_close.close_release(Args(root))

              def test_terminal_provenance_uses_full_canonical_commit_url(self) -> None:
          '''
          if test_text.count(marker) != 1:
              raise SystemExit(f"expected one test insertion marker, found {test_text.count(marker)}")
          tests.write_text(test_text.replace(marker, insertion, 1), encoding="utf-8")
          PY

          python3 -m py_compile tools/post_release_close.py tests/tooling/test_post_release_close.py
          python3 -m unittest discover -s tests/tooling -p 'test_post_release_close.py'
          git diff --check

      - name: Commit tested repair and remove bootstrap workflow
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-post-release-v08-repair.yml
          app_user_id="$(gh api "users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          [[ "$app_user_id" =~ ^[0-9]+$ ]]
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'tests/tooling/test_post_release_close.py\ntools/post_release_close.py'
          git commit -m "fix(release): normalize post-release milestone status structurally"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
