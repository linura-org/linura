name: Temporary v0.8 component maturity repair

on:
  push:
    branches:
      - fix/v08-post-release-component-maturity

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v08-post-release-component-maturity
          fetch-depth: 0
          persist-credentials: false

      - name: Require dedicated Release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APP_CLIENT_ID"
          test -n "$RELEASE_APP_PRIVATE_KEY"

      - name: Mint repository-scoped Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Repair v0.8 component maturity transition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          contract = Path("contracts/components.toml")
          text = contract.read_text(encoding="utf-8")

          def replace_component(component_id: str, transform):
              global text
              pattern = re.compile(
                  rf'(?ms)^\[\[component\]\]\nid = "{re.escape(component_id)}"\n.*?(?=^\[\[component\]\]|\Z)'
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f"missing component block: {component_id}")
              old = match.group(0)
              new = transform(old)
              if new == old:
                  raise SystemExit(f"component transform made no change: {component_id}")
              text = text[:match.start()] + new + text[match.end():]

          def promote_runtime(block: str) -> str:
              if block.count('maturity = "roadmap-scaffold"') != 1:
                  raise SystemExit("unexpected linura-agent-runtime maturity")
              if block.count('activation_milestone = "v0.8.0"') != 1:
                  raise SystemExit("unexpected linura-agent-runtime activation")
              if block.count('scope = "future agent interpretation substrate with no mutation authority"') != 1:
                  raise SystemExit("unexpected linura-agent-runtime scope")
              block = block.replace(
                  'maturity = "roadmap-scaffold"',
                  'maturity = "integrated-experimental"',
                  1,
              )
              return block.replace(
                  'scope = "future agent interpretation substrate with no mutation authority"',
                  'scope = "bounded proposal-only agent interpretation runtime integrated at v0.8.0 with no mutation authority"',
                  1,
              )

          def defer_planned_ui(block: str) -> str:
              if block.count('kind = "planned-app"') != 1:
                  raise SystemExit("linura-agent-ui must remain a planned app")
              if block.count('maturity = "roadmap-scaffold"') != 1:
                  raise SystemExit("linura-agent-ui must remain a roadmap scaffold")
              if block.count('activation_milestone = "v0.8.0"') != 1:
                  raise SystemExit("unexpected linura-agent-ui activation")
              return block.replace(
                  'activation_milestone = "v0.8.0"',
                  'activation_milestone = "v0.10.0"',
                  1,
              )

          replace_component("linura-agent-runtime", promote_runtime)
          replace_component("linura-agent-ui", defer_planned_ui)
          contract.write_text(text, encoding="utf-8")

          tests = Path("tests/tooling/test_component_maturity.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "    def test_stable_component_requires_stable_milestone_evidence(self) -> None:\n"
          insertion = '''    def test_candidate_component_contract_remains_valid_when_candidate_becomes_current(self) -> None:\n        with tempfile.TemporaryDirectory() as temp_dir:\n            root = Path(temp_dir)\n            self._copy_fixture(root)\n            roadmap_path = root / "contracts/roadmap.toml"\n            roadmap = tomllib.loads(roadmap_path.read_text(encoding="utf-8"))\n            current = roadmap["current_release"]\n            candidate = roadmap["next_release"]\n            versions = [item["version"] for item in roadmap["milestone"]]\n            candidate_index = versions.index(candidate)\n            self.assertLess(candidate_index + 1, len(versions))\n            following = versions[candidate_index + 1]\n\n            roadmap_text = roadmap_path.read_text(encoding="utf-8")\n            roadmap_text = roadmap_text.replace(\n                f'current_release = "{current}"',\n                f'current_release = "{candidate}"',\n                1,\n            )\n            roadmap_text = roadmap_text.replace(\n                f'next_release = "{candidate}"',\n                f'next_release = "{following}"',\n                1,\n            )\n            roadmap_path.write_text(roadmap_text, encoding="utf-8")\n\n            result = self._run_checker(root)\n            self.assertEqual(result.returncode, 0, result.stderr)\n\n    def test_v08_agent_component_maturity_matches_shipped_scope(self) -> None:\n        contract = tomllib.loads((ROOT / "contracts/components.toml").read_text(encoding="utf-8"))\n        components = {item["id"]: item for item in contract["component"]}\n\n        runtime = components["linura-agent-runtime"]\n        self.assertEqual(runtime["maturity"], "integrated-experimental")\n        self.assertEqual(runtime["activation_milestone"], "v0.8.0")\n        self.assertFalse(runtime["release_artifact"])\n        self.assertEqual(runtime["authority_role"], "proposal-only")\n\n        ui = components["linura-agent-ui"]\n        self.assertEqual(ui["kind"], "planned-app")\n        self.assertEqual(ui["maturity"], "roadmap-scaffold")\n        self.assertEqual(ui["activation_milestone"], "v0.10.0")\n        self.assertFalse(ui["release_artifact"])\n\n'''
          if test_text.count(marker) != 1:
              raise SystemExit(f"expected one test insertion marker, found {test_text.count(marker)}")
          tests.write_text(test_text.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY

          python3 -m py_compile tools/check_component_maturity.py tests/tooling/test_component_maturity.py
          python3 -m unittest discover -s tests/tooling -p 'test_component_maturity.py'
          python3 tools/check_component_maturity.py
          git diff --check

      - name: Commit tested repair and remove bootstrap workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: astupdt
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v08-component-maturity-repair.yml
          app_user_id="$(gh api "users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          [[ "$app_user_id" =~ ^[0-9]+$ ]]
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/tmp-v08-component-maturity-repair.yml\ncontracts/components.toml\ntests/tooling/test_component_maturity.py'
          git commit -m "fix(release): align v0.8 component maturity closure"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
