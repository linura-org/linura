name: Release

run-name: Release — v${{ inputs.version }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true
        type: string
      source_sha:
        description: Exact proven current-main source SHA
        required: true
        type: string
      proof_run_id:
        description: Exact successful Trusted Release Proof run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate proven release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      PROOF_DIR: /tmp/linura-proof
    steps:
      - name: Validate request shape
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROOF_RUN_ID" =~ ^[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Assert exact current-main release source
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"

      - name: Validate release identity and frozen contract
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$RELEASE_TAG" <<'PY'
          import re
          import sys

          subject, expected_tag = sys.argv[1:]
          match = re.fullmatch(
              r"release: (?P<tag>v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-intent subject: {subject!r}")
          if match.group("tag") != expected_tag:
              raise SystemExit(
                  f"release-intent tag {match.group('tag')!r} does not match requested {expected_tag!r}"
              )
          PY
          python3 tools/release_contract.py validate \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/${RELEASE_TAG}.md" \
            --require-workspace-version

      - name: Verify permanent exact-SHA gates
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
          for workflow in CI Security CodeQL; do
            count="$(jq -r --arg workflow "$workflow" '[.workflow_runs[] | select(.path == (".github/workflows/" + ($workflow | ascii_downcase) + ".yml") and .head_sha == env.SOURCE_SHA and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
            if [[ "$count" -lt 1 ]]; then
              echo "missing successful exact-SHA gate: $workflow" >&2
              exit 1
            fi
          done

      - name: Verify exact Trusted Release Proof
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID")"
          test "$(jq -r .path <<<"$run")" = ".github/workflows/trusted-release-proof.yml"
          test "$(jq -r .event <<<"$run")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_sha <<<"$run")" = "$SOURCE_SHA"

      - name: Download exact proof payload
        run: |
          set -euo pipefail
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR"
          gh run download "$PROOF_RUN_ID" \
            --name "linura-trusted-release-proof-$SOURCE_SHA" \
            --dir "$PROOF_DIR"

      - name: Verify proof receipt, sealed payload and provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["PROOF_DIR"])
          payload = root / "release-payload"
          receipt = json.loads((root / "release-proof.json").read_text(encoding="utf-8"))
          if receipt.get("schema_version") != 2:
              raise SystemExit("unsupported release proof schema")
          if receipt.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("release proof repository mismatch")
          if receipt.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("release proof source mismatch")
          if receipt.get("tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("release proof tag mismatch")
          if receipt.get("version") != os.environ["RELEASE_VERSION"]:
              raise SystemExit("release proof version mismatch")
          if str(receipt.get("run_id")) != os.environ["PROOF_RUN_ID"]:
              raise SystemExit("release proof run mismatch")

          qualifications = receipt.get("qualifications")
          if not isinstance(qualifications, dict):
              raise SystemExit("release proof qualification declaration missing")
          v08 = qualifications.get("v0.8")
          if not isinstance(v08, dict):
              raise SystemExit("v0.8 qualification declaration missing")
          if v08.get("schema_version") != 2:
              raise SystemExit("unexpected v0.8 qualification schema")
          if v08.get("result") != "passed":
              raise SystemExit("v0.8 qualification did not pass")
          if v08.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("v0.8 qualification source mismatch")
          qualification_relpath = v08.get("path")
          if qualification_relpath != "qualification/v0.8/qualification.json":
              raise SystemExit("unexpected v0.8 qualification path")
          declared_qualification = v08.get("files")
          if not isinstance(declared_qualification, list) or not declared_qualification:
              raise SystemExit("v0.8 qualification file declaration missing")

          expected_qualification = {}
          for item in declared_qualification:
              if not isinstance(item, dict):
                  raise SystemExit("invalid v0.8 qualification file declaration")
              name = item.get("name")
              size = item.get("size")
              digest = item.get("sha256")
              if (
                  not isinstance(name, str)
                  or pathlib.PurePosixPath(name).name != name
                  or not isinstance(size, int)
                  or size < 0
                  or not isinstance(digest, str)
                  or len(digest) != 64
                  or any(char not in "0123456789abcdef" for char in digest)
                  or name in expected_qualification
              ):
                  raise SystemExit("invalid v0.8 qualification file declaration")
              expected_qualification[name] = (size, digest)

          qualification_root = root / "qualification" / "v0.8"
          qualification_path = root / qualification_relpath
          if not qualification_path.is_file() or qualification_path.is_symlink():
              raise SystemExit("v0.8 qualification evidence is missing")
          evidence = json.loads(qualification_path.read_text(encoding="utf-8"))
          if evidence.get("schema_version") != 2:
              raise SystemExit("unexpected v0.8 qualification evidence schema")
          if evidence.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("v0.8 qualification evidence repository mismatch")
          if evidence.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("v0.8 qualification evidence source mismatch")
          if evidence.get("result") != "passed":
              raise SystemExit("v0.8 qualification evidence did not pass")

          actual_qualification = {}
          for qualification_file in qualification_root.iterdir():
              if qualification_file.is_symlink() or not qualification_file.is_file():
                  raise SystemExit(
                      f"invalid v0.8 qualification entry: {qualification_file.name}"
                  )
              actual_qualification[qualification_file.name] = (
                  qualification_file.stat().st_size,
                  hashlib.sha256(qualification_file.read_bytes()).hexdigest(),
              )
          if actual_qualification != expected_qualification:
              raise SystemExit("v0.8 qualification evidence does not match proof receipt")

          declared = receipt.get("artifacts")
          if not isinstance(declared, list) or not declared:
              raise SystemExit("release proof artifact declaration missing")
          expected = {
              item["name"]: (item["size"], item["sha256"])
              for item in declared
              if isinstance(item, dict)
              and isinstance(item.get("name"), str)
              and isinstance(item.get("size"), int)
              and isinstance(item.get("sha256"), str)
          }
          actual = {}
          for path in payload.iterdir():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"invalid proof payload entry: {path.name}")
              actual[path.name] = (
                  path.stat().st_size,
                  hashlib.sha256(path.read_bytes()).hexdigest(),
              )
          if actual != expected:
              raise SystemExit("sealed proof payload does not match proof receipt")
          PY
          test "$(cat "$PROOF_DIR/release-payload/SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(cat "$PROOF_DIR/release-payload/RELEASE_TAG")" = "$RELEASE_TAG"
          python3 tools/release_contract.py verify \
            --directory "$PROOF_DIR/release-payload" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"
          python3 tools/release_verify.py "$PROOF_DIR/release-payload"
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done < <(find "$PROOF_DIR/release-payload" -maxdepth 1 -type f -print0)

      - name: Preflight immutable version identity
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          fi

  publish:
    name: publish sealed release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      PROOF_DIR: /tmp/linura-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Assert exact publication source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download exact proven payload
        run: |
          set -euo pipefail
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR"
          gh run download "$PROOF_RUN_ID" \
            --name "linura-trusted-release-proof-$SOURCE_SHA" \
            --dir "$PROOF_DIR"

      - name: Reverify sealed payload and provenance
        run: |
          set -euo pipefail
          test "$(cat "$PROOF_DIR/release-payload/SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(cat "$PROOF_DIR/release-payload/RELEASE_TAG")" = "$RELEASE_TAG"
          python3 tools/release_contract.py verify \
            --directory "$PROOF_DIR/release-payload" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"
          python3 tools/release_verify.py "$PROOF_DIR/release-payload"
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done < <(find "$PROOF_DIR/release-payload" -maxdepth 1 -type f -print0)

      - name: Create or verify immutable version tag
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$SOURCE_SHA"
            echo "$RELEASE_TAG already exists on the exact proven source"
          else
            created="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA")"
            test "$(jq -r .object.sha <<<"$created")" = "$SOURCE_SHA"
          fi

      - name: Create or resume immutable publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import mimetypes
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["SOURCE_SHA"]
          token = os.environ["GH_TOKEN"]
          version = os.environ["RELEASE_VERSION"]
          version_without_build = version.split("+", 1)[0]
          prerelease = "-" in version_without_build
          payload_dir = pathlib.Path(os.environ["PROOF_DIR"]) / "release-payload"
          notes = (payload_dir / "RELEASE_NOTES.md").read_text(encoding="utf-8")
          release_name = f"Linura {tag}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "linura-release",
          }

          def request(method, url, data=None, extra_headers=None):
              merged = dict(headers)
              merged.update(extra_headers or {})
              req = urllib.request.Request(url, data=data, headers=merged, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      return response.read(), response.status
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None, 404
                  print(exc.read().decode(errors="replace"))
                  raise

          def asset_matches(asset, digest):
              api_digest = asset.get("digest")
              if api_digest:
                  return api_digest == f"sha256:{digest}"
              raw, _ = request(
                  "GET",
                  asset["url"],
                  extra_headers={"Accept": "application/octet-stream"},
              )
              return hashlib.sha256(raw).hexdigest() == digest

          matches = []
          page = 1
          while True:
              raw, _ = request(
                  "GET",
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
              )
              batch = json.loads(raw)
              matches.extend(release for release in batch if release.get("tag_name") == tag)
              if len(batch) < 100:
                  break
              page += 1
          if len(matches) > 1:
              raise SystemExit(f"multiple releases exist for {tag}; manual reconciliation required")

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(payload_dir.iterdir())
              if path.is_file() and not path.is_symlink()
          }
          if not matches:
              body = json.dumps({
                  "tag_name": tag,
                  "target_commitish": sha,
                  "name": release_name,
                  "body": notes,
                  "draft": True,
                  "prerelease": prerelease,
              }).encode()
              raw, _ = request(
                  "POST",
                  f"https://api.github.com/repos/{repo}/releases",
                  body,
                  {"Content-Type": "application/json"},
              )
              release = json.loads(raw)
          else:
              release = matches[0]
              if not release.get("draft"):
                  if release.get("name") != release_name:
                      raise SystemExit("published release title differs from canonical title")
                  if release.get("body") != notes:
                      raise SystemExit("published release body differs from frozen notes")
                  if bool(release.get("prerelease")) != prerelease:
                      raise SystemExit("published release classification differs from canonical SemVer classification")
                  assets = {asset["name"]: asset for asset in release.get("assets", [])}
                  if set(assets) != set(expected):
                      raise SystemExit("published release asset set differs from sealed payload")
                  for name, digest in expected.items():
                      if not asset_matches(assets[name], digest):
                          raise SystemExit(f"published release asset mismatch: {name}")
                  print(f"existing published release {tag} matches sealed payload")
                  raise SystemExit(0)
              body = json.dumps({
                  "name": release_name,
                  "body": notes,
                  "draft": True,
                  "prerelease": prerelease,
              }).encode()
              raw, _ = request(
                  "PATCH",
                  f"https://api.github.com/repos/{repo}/releases/{release['id']}",
                  body,
                  {"Content-Type": "application/json"},
              )
              release = json.loads(raw)

          release_id = release["id"]
          remote = {asset["name"]: asset for asset in release.get("assets", [])}
          for name, asset in list(remote.items()):
              digest = expected.get(name)
              if digest is None or not asset_matches(asset, digest):
                  request("DELETE", asset["url"])
                  remote.pop(name, None)

          for name, digest in expected.items():
              if name in remote:
                  continue
              path = payload_dir / name
              query = urllib.parse.urlencode({"name": name})
              content_type = mimetypes.guess_type(name)[0] or "application/octet-stream"
              request(
                  "POST",
                  f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?{query}",
                  path.read_bytes(),
                  {"Content-Type": content_type},
              )

          raw, _ = request("GET", f"https://api.github.com/repos/{repo}/releases/{release_id}")
          release = json.loads(raw)
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(assets) != set(expected):
              raise SystemExit(
                  f"draft asset set mismatch: remote={sorted(assets)} expected={sorted(expected)}"
              )
          for name, digest in expected.items():
              if not asset_matches(assets[name], digest):
                  raise SystemExit(f"draft asset checksum mismatch: {name}")

          body = json.dumps({"draft": False, "prerelease": prerelease}).encode()
          raw, _ = request(
              "PATCH",
              f"https://api.github.com/repos/{repo}/releases/{release_id}",
              body,
              {"Content-Type": "application/json"},
          )
          release = json.loads(raw)
          if release.get("draft"):
              raise SystemExit("release remained draft")
          print(f"Published {release['html_url']}")
          PY

  verification-dispatch:
    name: dispatch independent verification
    needs: [validate, publish]
    if: ${{ needs.validate.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Dispatch verification
        run: gh workflow run release-verification.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"
