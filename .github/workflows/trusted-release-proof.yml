name: Trusted Release Proof

run-name: Trusted Release Proof — ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-proof-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate exact-source proof request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert exact current-main candidate
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          python3 tools/release_contract.py validate-intent --source-sha "$SOURCE_SHA"

      - name: Resolve and validate release contract
        id: release
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          subject, output_path = sys.argv[1], sys.argv[2]
          match = re.fullmatch(
              r"release: (?P<tag>v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-intent subject: {subject!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"tag={match.group('tag')}\n")
              handle.write(f"version={match.group('tag')[1:]}\n")
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          test -n "$tag"
          python3 tools/release_contract.py validate \
            --tag "$tag" \
            --notes "docs/releases/${tag}.md" \
            --require-workspace-version

      - name: Verify permanent exact-SHA gates
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100")"
          for workflow in CI Security CodeQL; do
            count="$(jq -r --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow and .head_sha == env.SOURCE_SHA and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
            if [[ "$count" -lt 1 ]]; then
              echo "missing successful exact-SHA gate: $workflow" >&2
              exit 1
            fi
          done

  observation-acceptance:
    name: exact-source authoritative observation qualification
    needs: validate
    uses: ./.github/workflows/vm-acceptance.yml
    permissions:
      contents: read
    with:
      scenario: authoritative-observation

  plan-preview-acceptance:
    name: exact-source Control1 plan-preview qualification
    needs: validate
    uses: ./.github/workflows/vm-acceptance.yml
    permissions:
      contents: read
    with:
      scenario: control1-plan-preview

  durability-qualification:
    name: exact-source v0.4 durability fault qualification
    needs: validate
    uses: ./.github/workflows/v04-durability-vm.yml
    permissions:
      contents: read

  enospc-qualification:
    name: exact-source v0.4 real ext4 ENOSPC qualification
    needs: validate
    uses: ./.github/workflows/v04-enospc-recovery-vm.yml
    permissions:
      contents: read

  executor-verifier-qualification:
    name: exact-source v0.5 isolated executor/verifier qualification
    needs: validate
    uses: ./.github/workflows/v05-executor-verifier-vm.yml
    permissions:
      contents: read

  managed-lifecycle-qualification:
    name: exact-source v0.6 managed lifecycle qualification
    needs: validate
    uses: ./.github/workflows/v06-managed-lifecycle-vm.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  build:
    name: isolated build and reproducibility proof
    needs: [validate, observation-acceptance, plan-preview-acceptance, durability-qualification, enospc-qualification, executor-verifier-qualification, managed-lifecycle-qualification]
    uses: ./.github/workflows/reusable-release-build.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      source_sha: ${{ github.sha }}
      release_tag: ${{ needs.validate.outputs.tag }}
      release_version: ${{ needs.validate.outputs.version }}

  dispatch-promotion:
    name: dispatch release promotion
    needs: [validate, observation-acceptance, plan-preview-acceptance, durability-qualification, enospc-qualification, executor-verifier-qualification, managed-lifecycle-qualification, build]
    if: ${{ needs.validate.result == 'success' && needs.observation-acceptance.result == 'success' && needs.plan-preview-acceptance.result == 'success' && needs.durability-qualification.result == 'success' && needs.enospc-qualification.result == 'success' && needs.executor-verifier-qualification.result == 'success' && needs.managed-lifecycle-qualification.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Reassert current main and dispatch promotion
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "main moved after successful proof: $current != $SOURCE_SHA; no promotion"
            exit 0
          fi
          gh workflow run release-promotion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha="$SOURCE_SHA" \
            -f proof_run_id="$PROOF_RUN_ID"
          echo "dispatched Release Promotion for proof run $PROOF_RUN_ID at $SOURCE_SHA"
