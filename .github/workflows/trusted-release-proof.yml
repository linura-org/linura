name: Trusted Release Proof

run-name: Trusted Release Proof — ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-proof-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate exact-source proof request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      qualification_source_sha: ${{ steps.intent.outputs.qualification_source_sha }}
      qualification_tree_sha: ${{ steps.intent.outputs.qualification_tree_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert exact current-main candidate
        id: intent
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          intent="$(python3 tools/release_contract.py validate-intent --source-sha "$SOURCE_SHA" --json)"
          qualification_source_sha="$(jq -r .qualification_source_sha <<<"$intent")"
          qualification_tree_sha="$(jq -r .qualification_tree_sha <<<"$intent")"
          [[ "$qualification_source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$qualification_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          actual_qualification_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$qualification_source_sha" --jq .tree.sha)"
          test "$actual_qualification_tree" = "$qualification_tree_sha"
          printf 'qualification_source_sha=%s\n' "$qualification_source_sha" >> "$GITHUB_OUTPUT"
          printf 'qualification_tree_sha=%s\n' "$qualification_tree_sha" >> "$GITHUB_OUTPUT"
          printf 'LINURA_EXPECTED_SOURCE_SHA=%s\n' "$qualification_source_sha" >> "$GITHUB_ENV"

      - name: Resolve and validate release contract
        id: release
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          subject, output_path = sys.argv[1], sys.argv[2]
          match = re.fullmatch(
              r"release: (?P<tag>v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-intent subject: {subject!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"tag={match.group('tag')}\n")
              handle.write(f"version={match.group('tag')[1:]}\n")
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          test -n "$tag"
          python3 tools/release_contract.py validate \
            --tag "$tag" \
            --notes "docs/releases/${tag}.md" \
            --require-workspace-version
          if [[ "$tag" = "v0.10.0" ]]; then
            python3 tools/check_roadmap.py . --release-candidate "$tag"
            python3 tools/check_v010_workstation_qualification.py .
          fi

      - name: Verify permanent exact-SHA gates
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
          for workflow in CI Security CodeQL; do
            count="$(jq -r --arg workflow "$workflow" '[.workflow_runs[] | select(.path == (".github/workflows/" + ($workflow | ascii_downcase) + ".yml") and .head_sha == env.SOURCE_SHA and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
            if [[ "$count" -lt 1 ]]; then
              echo "missing successful exact-SHA gate: $workflow" >&2
              exit 1
            fi
          done

  observation-acceptance:
    name: exact-source authoritative observation qualification
    needs: validate
    uses: ./.github/workflows/vm-acceptance.yml
    permissions:
      contents: read
    with:
      scenario: authoritative-observation
      source_sha: ${{ github.sha }}

  plan-preview-acceptance:
    name: exact-source Control1 plan-preview qualification
    needs: validate
    uses: ./.github/workflows/vm-acceptance.yml
    permissions:
      contents: read
    with:
      scenario: control1-plan-preview
      source_sha: ${{ github.sha }}
      envelope_lane: control1-plan-preview-vm

  durability-qualification:
    name: exact-source v0.4 durability fault qualification
    needs: validate
    uses: ./.github/workflows/v04-durability-vm.yml
    permissions:
      contents: read

  enospc-qualification:
    name: exact-source v0.4 real ext4 ENOSPC qualification
    needs: validate
    uses: ./.github/workflows/v04-enospc-recovery-vm.yml
    permissions:
      contents: read

  executor-verifier-qualification:
    name: exact-source v0.5 isolated executor/verifier qualification
    needs: validate
    uses: ./.github/workflows/v05-executor-verifier-vm.yml
    permissions:
      contents: read

  managed-lifecycle-qualification:
    name: exact-source v0.6 managed lifecycle qualification
    needs: validate
    uses: ./.github/workflows/v06-managed-lifecycle-vm.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  library-qualification:
    name: exact-source v0.7 persistent Library qualification
    needs: validate
    uses: ./.github/workflows/v07-library-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  agent-qualification:
    name: exact-source v0.8 proposal-only agent qualification
    needs: validate
    uses: ./.github/workflows/v08-agent-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  firstboot-qualification:
    name: exact-source v0.9 First Boot QualificationEnvironment
    needs: validate
    uses: ./.github/workflows/v09-qualification.yml
    permissions:
      actions: read
      contents: read
    with:
      source_sha: ${{ github.sha }}

  v010-qualification-shell-runtime:
    name: pre-seal v0.10 shell runtime binary proof
    needs: validate
    if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
    uses: ./.github/workflows/v010-shell-runtime-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ needs.validate.outputs.qualification_source_sha }}

  v010-prepared-shell-runtime:
    name: prepared-release v0.10 shell runtime binary proof
    needs: validate
    if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
    uses: ./.github/workflows/v010-shell-runtime-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  build:
    name: isolated build and reproducibility proof
    needs: [validate, observation-acceptance, plan-preview-acceptance, durability-qualification, enospc-qualification, executor-verifier-qualification, managed-lifecycle-qualification, library-qualification, agent-qualification, firstboot-qualification]
    uses: ./.github/workflows/reusable-release-build.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      source_sha: ${{ github.sha }}
      release_tag: ${{ needs.validate.outputs.tag }}
      release_version: ${{ needs.validate.outputs.version }}

  aggregate-proof:
    name: bind exact-source qualification into canonical proof
    needs: [validate, agent-qualification, firstboot-qualification, v010-qualification-shell-runtime, v010-prepared-shell-runtime, build]
    if: ${{ always() && needs.validate.result == 'success' && needs.agent-qualification.result == 'success' && needs.firstboot-qualification.result == 'success' && needs.build.result == 'success' && (needs.validate.outputs.tag != 'v0.10.0' || (needs.v010-qualification-shell-runtime.result == 'success' && needs.v010-prepared-shell-runtime.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PROOF_ROOT: /tmp/linura-final-proof
      QUALIFICATION_ROOT: /tmp/linura-v08-qualification
      V09_QUALIFICATION_ROOT: /tmp/linura-v09-qualification
      V010_QUALIFICATION_SOURCE_ROOT: /tmp/linura-v010-qualification-source
      V010_PREPARED_SOURCE_ROOT: /tmp/linura-v010-prepared-source
      V010_QUALIFICATION_RUNTIME_ROOT: /tmp/linura-v010-qualification-shell-runtime
      V010_PREPARED_RUNTIME_ROOT: /tmp/linura-v010-prepared-shell-runtime
      QUALIFICATION_SOURCE_SHA: ${{ needs.validate.outputs.qualification_source_sha }}
      QUALIFICATION_TREE_SHA: ${{ needs.validate.outputs.qualification_tree_sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Materialize reviewed v0.10 qualification and prepared-release source trees
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALIFICATION_SOURCE_SHA" != "$SOURCE_SHA"
          test ! -e "$V010_QUALIFICATION_SOURCE_ROOT"
          test ! -e "$V010_PREPARED_SOURCE_ROOT"
          /usr/bin/git -c core.hooksPath=/dev/null worktree add --detach \
            "$V010_QUALIFICATION_SOURCE_ROOT" "$QUALIFICATION_SOURCE_SHA"
          /usr/bin/git -c core.hooksPath=/dev/null worktree add --detach \
            "$V010_PREPARED_SOURCE_ROOT" "$SOURCE_SHA"
          test "$(/usr/bin/git -C "$V010_QUALIFICATION_SOURCE_ROOT" rev-parse HEAD)" = \
            "$QUALIFICATION_SOURCE_SHA"
          test "$(/usr/bin/git -C "$V010_QUALIFICATION_SOURCE_ROOT" rev-parse 'HEAD^{tree}')" = \
            "$QUALIFICATION_TREE_SHA"
          test "$(/usr/bin/git -C "$V010_PREPARED_SOURCE_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download reproducible build proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-trusted-release-proof-${{ github.sha }}
          path: /tmp/linura-final-proof

      - name: Download sealed exact-source v0.8 qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v08-agent-${{ github.sha }}
          path: /tmp/linura-v08-qualification-sealed

      - name: Unseal exact-source v0.8 qualification evidence
        run: |
          set -euo pipefail
          /usr/bin/python3 -I tools/qualification_evidence.py unseal             --archive /tmp/linura-v08-qualification-sealed/qualification-evidence.tar             --destination "$QUALIFICATION_ROOT"

      - name: Download sealed exact-source v0.9 qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v09-qualification-${{ github.sha }}
          path: /tmp/linura-v09-qualification-sealed

      - name: Unseal exact-source v0.9 qualification evidence
        run: |
          set -euo pipefail
          /usr/bin/python3 -I tools/qualification_evidence.py unseal             --archive /tmp/linura-v09-qualification-sealed/qualification-evidence.tar             --destination "$V09_QUALIFICATION_ROOT"

      - name: Download sealed pre-seal v0.10 shell runtime evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v010-shell-runtime-${{ needs.validate.outputs.qualification_source_sha }}-attempt-${{ github.run_attempt }}
          path: /tmp/linura-v010-qualification-shell-runtime-sealed

      - name: Unseal pre-seal v0.10 shell runtime evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "$V010_QUALIFICATION_SOURCE_ROOT/tools/qualification_evidence.py" \
            --root "$V010_QUALIFICATION_SOURCE_ROOT" unseal \
            --archive /tmp/linura-v010-qualification-shell-runtime-sealed/qualification-evidence.tar \
            --destination "$V010_QUALIFICATION_RUNTIME_ROOT"

      - name: Download sealed prepared-release v0.10 shell runtime evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v010-shell-runtime-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: /tmp/linura-v010-prepared-shell-runtime-sealed

      - name: Unseal prepared-release v0.10 shell runtime evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "$V010_PREPARED_SOURCE_ROOT/tools/qualification_evidence.py" \
            --root "$V010_PREPARED_SOURCE_ROOT" unseal \
            --archive /tmp/linura-v010-prepared-shell-runtime-sealed/qualification-evidence.tar \
            --destination "$V010_PREPARED_RUNTIME_ROOT"

      - name: Verify v0.8 evidence admission binding
        run: /usr/bin/python3 -I tools/qualification_evidence.py verify --structural-only --binding "$QUALIFICATION_ROOT/evidence-binding.json"

      - name: Verify and bind v0.8 qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROOF_ROOT/release-proof.json"
          test -d "$PROOF_ROOT/release-payload"
          test -f "$QUALIFICATION_ROOT/qualification.json"
          destination="$PROOF_ROOT/qualification/v0.8"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$QUALIFICATION_ROOT"/. "$destination"/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ['PROOF_ROOT'])
          qualification_root = root / 'qualification' / 'v0.8'
          qualification_path = qualification_root / 'qualification.json'
          evidence = json.loads(qualification_path.read_text(encoding='utf-8'))
          if evidence.get('schema_version') != 2:
              raise SystemExit('unexpected v0.8 qualification evidence schema')
          if evidence.get('repository') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('v0.8 qualification repository mismatch')
          if evidence.get('source_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('v0.8 qualification source mismatch')
          if evidence.get('result') != 'passed':
              raise SystemExit('v0.8 qualification did not pass')

          files = []
          for path in sorted(qualification_root.iterdir()):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f'invalid v0.8 qualification entry: {path.name}')
              files.append({
                  'name': path.name,
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          if not files:
              raise SystemExit('v0.8 qualification evidence set is empty')

          receipt_path = root / 'release-proof.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          if receipt.get('source_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('build proof source mismatch')
          if receipt.get('tag') != os.environ['RELEASE_TAG']:
              raise SystemExit('build proof tag mismatch')
          if receipt.get('version') != os.environ['RELEASE_VERSION']:
              raise SystemExit('build proof version mismatch')
          receipt['schema_version'] = 2
          receipt['run_id'] = int(os.environ['GITHUB_RUN_ID'])
          receipt['run_attempt'] = int(os.environ['GITHUB_RUN_ATTEMPT'])
          receipt['qualifications'] = {
              'v0.8': {
                  'schema_version': evidence['schema_version'],
                  'result': evidence['result'],
                  'source_sha': evidence['source_sha'],
                  'path': 'qualification/v0.8/qualification.json',
                  'files': files,
              }
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify v0.9 evidence admission binding
        run: /usr/bin/python3 -I tools/qualification_evidence.py verify --structural-only --binding "$V09_QUALIFICATION_ROOT/evidence-binding.json"

      - name: Verify and bind v0.9 qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$V09_QUALIFICATION_ROOT/qualification.json"
          destination="$PROOF_ROOT/qualification/v0.9"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$V09_QUALIFICATION_ROOT"/. "$destination"/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ['PROOF_ROOT'])
          qualification_root = root / 'qualification' / 'v0.9'
          qualification_path = qualification_root / 'qualification.json'
          evidence = json.loads(qualification_path.read_text(encoding='utf-8'))
          if evidence.get('schema_version') != 2:
              raise SystemExit('unexpected v0.9 qualification evidence schema')
          if evidence.get('repository') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('v0.9 qualification repository mismatch')
          if evidence.get('source_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('v0.9 qualification source mismatch')
          if evidence.get('result') != 'passed':
              raise SystemExit('v0.9 qualification did not pass')
          environment = evidence.get('qualification_environment', {})
          if environment.get('id') != 'qualification/ubuntu-24.04-lts/amd64/qemu-tcg-headless':
              raise SystemExit('v0.9 QualificationEnvironment identity mismatch')

          files = []
          for path in sorted(qualification_root.iterdir()):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f'invalid v0.9 qualification entry: {path.name}')
              files.append({
                  'name': path.name,
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          if not files:
              raise SystemExit('v0.9 qualification evidence set is empty')

          receipt_path = root / 'release-proof.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          if receipt.get('source_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('build proof source mismatch before v0.9 binding')
          qualifications = receipt.setdefault('qualifications', {})
          if 'v0.8' not in qualifications:
              raise SystemExit('v0.8 qualification binding disappeared before v0.9 binding')
          qualifications['v0.9'] = {
              'schema_version': evidence['schema_version'],
              'result': evidence['result'],
              'source_sha': evidence['source_sha'],
              'qualification_environment': environment['id'],
              'path': 'qualification/v0.9/qualification.json',
              'files': files,
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify v0.10 evidence admission bindings
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "$V010_QUALIFICATION_SOURCE_ROOT/tools/qualification_evidence.py" \
            --root "$V010_QUALIFICATION_SOURCE_ROOT" verify --structural-only \
            --binding "$V010_QUALIFICATION_RUNTIME_ROOT/evidence-binding.json"
          /usr/bin/python3 -I "$V010_PREPARED_SOURCE_ROOT/tools/qualification_evidence.py" \
            --root "$V010_PREPARED_SOURCE_ROOT" verify --structural-only \
            --binding "$V010_PREPARED_RUNTIME_ROOT/evidence-binding.json"

      - name: Bind exact-source v0.10 qualification evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        shell: bash
        env:
          LINURA_EXPECTED_SOURCE_SHA: ${{ needs.validate.outputs.qualification_source_sha }}
        run: |
          set -euo pipefail
          cd "$V010_PREPARED_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          qualification_runtime="$V010_QUALIFICATION_RUNTIME_ROOT/V010-SHELL-RUNTIME-EVIDENCE.json"
          prepared_runtime="$V010_PREPARED_RUNTIME_ROOT/V010-SHELL-RUNTIME-EVIDENCE.json"
          test -f "$qualification_runtime"
          test -f "$prepared_runtime"
          test "$(jq -r .source_sha "$qualification_runtime")" = "$QUALIFICATION_SOURCE_SHA"
          test "$(jq -r .source_sha "$prepared_runtime")" = "$SOURCE_SHA"
          test "$(jq -r .result "$qualification_runtime")" = "passed"
          test "$(jq -r .result "$prepared_runtime")" = "passed"

          expected_linurad_sha256="$(jq -r .authority_runtime.linurad_sha256 "$qualification_runtime")"
          expected_shell_bridge_sha256="$(jq -r .authority_runtime.shell_bridge_sha256 "$qualification_runtime")"
          prepared_linurad_sha256="$(jq -r .authority_runtime.linurad_sha256 "$prepared_runtime")"
          prepared_shell_bridge_sha256="$(jq -r .authority_runtime.shell_bridge_sha256 "$prepared_runtime")"
          for digest in             "$expected_linurad_sha256"             "$expected_shell_bridge_sha256"             "$prepared_linurad_sha256"             "$prepared_shell_bridge_sha256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done

          # Q11 remains bound to the independently established pre-seal runtime.
          # The version-prepared source is qualified separately and must exactly
          # produce the shipped linurad payload. ShellBridge is not Cargo-versioned,
          # so its digest must remain invariant across the mechanical version bump.
          test "$prepared_shell_bridge_sha256" = "$expected_shell_bridge_sha256"
          test "$(sha256sum "$PROOF_ROOT/release-payload/linurad" | awk '{print $1}')" = "$prepared_linurad_sha256"

          export LINURA_EXPECTED_LINURAD_SHA256="$expected_linurad_sha256"
          export LINURA_EXPECTED_SHELL_BRIDGE_SHA256="$expected_shell_bridge_sha256"
          export LINURA_PREPARED_LINURAD_SHA256="$prepared_linurad_sha256"
          export LINURA_PREPARED_SHELL_BRIDGE_SHA256="$prepared_shell_bridge_sha256"
          export LINURA_REQUIRE_BINARY_BINDING=1
          python3 tools/check_roadmap.py . --release-candidate v0.10.0
          python3 tools/check_v010_workstation_qualification.py .
          destination="$PROOF_ROOT/qualification/v0.10"
          rm -rf "$destination"
          mkdir -p             "$destination/evidence"             "$destination/visual/baselines"             "$destination/runtime/pre-seal"             "$destination/runtime/prepared-release"
          cp contracts/v010-workstation-qualification.toml "$destination/qualification-contract.toml"
          cp -a qualification/v010/. "$destination/evidence/"
          cp visual/baselines/manifest.json "$destination/visual/baselines/manifest.json"
          cp -a "$V010_QUALIFICATION_RUNTIME_ROOT"/. "$destination/runtime/pre-seal"/
          cp -a "$V010_PREPARED_RUNTIME_ROOT"/. "$destination/runtime/prepared-release"/
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil

          repository = pathlib.Path.cwd().resolve()
          proof_baselines = pathlib.Path(os.environ["PROOF_ROOT"]) / "qualification" / "v0.10" / "visual" / "baselines"
          manifest = json.loads(pathlib.Path("visual/baselines/manifest.json").read_text(encoding="utf-8"))
          seen = set()
          for index, item in enumerate(manifest.get("baselines", [])):
              if not isinstance(item, dict):
                  raise SystemExit(f"invalid visual baseline entry {index}")
              value = item.get("baseline")
              if value is None:
                  continue
              if not isinstance(value, str) or not value.startswith("visual/baselines/"):
                  raise SystemExit(f"unsafe visual baseline path: {value!r}")
              relative = pathlib.Path(value)
              if relative.is_absolute() or ".." in relative.parts or value in seen:
                  raise SystemExit(f"unsafe or duplicate visual baseline path: {value!r}")
              seen.add(value)
              source = repository / relative
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"missing or unsafe visual baseline: {value}")
              target = proof_baselines / relative.relative_to("visual/baselines")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["PROOF_ROOT"])
          qualification_root = root / "qualification" / "v0.10"
          files = []
          for path in sorted(qualification_root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"invalid v0.10 qualification symlink: {path}")
              if path.is_file():
                  files.append({
                      "name": path.relative_to(qualification_root).as_posix(),
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          if not files:
              raise SystemExit("v0.10 qualification evidence set is empty")
          receipt_path = root / "release-proof.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("build proof source mismatch before v0.10 binding")
          qualifications = receipt.setdefault("qualifications", {})
          qualifications["v0.10"] = {
              "schema_version": 1,
              "result": "passed",
              "source_sha": os.environ["SOURCE_SHA"],
              "qualification_source_sha": os.environ["QUALIFICATION_SOURCE_SHA"],
              "qualification_tree_sha": os.environ["QUALIFICATION_TREE_SHA"],
              "path": "qualification/v0.10/qualification-contract.toml",
              "runtime_binding": {
                  "qualification_source_evidence": "runtime/pre-seal/V010-SHELL-RUNTIME-EVIDENCE.json",
                  "prepared_release_evidence": "runtime/prepared-release/V010-SHELL-RUNTIME-EVIDENCE.json",
                  "qualification_linurad_sha256": os.environ["LINURA_EXPECTED_LINURAD_SHA256"],
                  "prepared_linurad_sha256": os.environ["LINURA_PREPARED_LINURAD_SHA256"],
                  "shell_bridge_sha256": os.environ["LINURA_EXPECTED_SHELL_BRIDGE_SHA256"],
              },
              "files": files,
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Attest exact-source v0.10 qualification evidence
        if: ${{ needs.validate.outputs.tag == 'v0.10.0' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "/tmp/linura-final-proof/qualification/v0.10/**"

      - name: Attest exact-source v0.8 qualification evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "/tmp/linura-final-proof/qualification/v0.8/*"

      - name: Attest exact-source v0.9 qualification evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "/tmp/linura-final-proof/qualification/v0.9/*"

      - name: Bind trusted-release execution envelope
        id: release-envelope
        uses: ./.github/actions/qualification-envelope
        env:
          ARTIFACT_DIR: ${{ env.PROOF_ROOT }}
        with:
          lane: trusted-release-proof
          source-sha: ${{ env.SOURCE_SHA }}

      - name: Replace canonical proof with qualification-bound proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-trusted-release-proof-${{ github.sha }}
          path: /tmp/linura-final-proof/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  dispatch-promotion:
    name: dispatch release promotion
    needs: [validate, observation-acceptance, plan-preview-acceptance, durability-qualification, enospc-qualification, executor-verifier-qualification, managed-lifecycle-qualification, library-qualification, agent-qualification, firstboot-qualification, build, aggregate-proof]
    if: ${{ needs.validate.result == 'success' && needs.observation-acceptance.result == 'success' && needs.plan-preview-acceptance.result == 'success' && needs.durability-qualification.result == 'success' && needs.enospc-qualification.result == 'success' && needs.executor-verifier-qualification.result == 'success' && needs.managed-lifecycle-qualification.result == 'success' && needs.library-qualification.result == 'success' && needs.agent-qualification.result == 'success' && needs.firstboot-qualification.result == 'success' && needs.build.result == 'success' && needs.aggregate-proof.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Reassert current main and dispatch promotion
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "main moved after successful proof: $current != $SOURCE_SHA; no promotion"
            exit 0
          fi
          gh workflow run release-promotion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha="$SOURCE_SHA" \
            -f proof_run_id="$PROOF_RUN_ID"
          echo "dispatched Release Promotion for proof run $PROOF_RUN_ID at $SOURCE_SHA"
