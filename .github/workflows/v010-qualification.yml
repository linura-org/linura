name: v0.10 workstation qualification contract

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to validate; defaults to selected ref
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/v010-qualification.yml"
      - ".github/workflows/v010-shell-runtime-qualification.yml"
      - "contracts/v010-shell-runtime-qualification.toml"
      - "apps/linura-shell/**"
      - "packaging/systemd/user/linura-shell.service"
      - "qualification/v010/shell-runtime/**"
      - "tools/check_linura_shell.py"
      - "tools/check_v010_shell_runtime_qualification.py"
      - "tests/tooling/test_linura_shell.py"
      - "tests/tooling/test_v010_shell_runtime_qualification.py"
      - "contracts/roadmap.toml"
      - "contracts/v010-workstation-qualification.toml"
      - "contracts/operation-semantics.toml"
      - "contracts/components.toml"
      - "profiles/arch-hyprland-v1.toml"
      - "crates/linura-hardware/**"
      - "crates/linura-linux-observation/**"
      - "crates/linura-control/**"
      - "contracts/layering.toml"
      - "Cargo.lock"
      - "tools/codex/versions.env"
      - "hardware/support-matrix.json"
      - "packaging/arch/archiso/packages.linura"
      - "qualification/v010/**"
      - "docs/milestones/v0.10.0.md"
      - "docs/operation-semantics.md"
      - "docs/adr/0032-classify-operations-before-authority.md"
      - "docs/platform-profiles.md"
      - "docs/qualification/v0.10.0.md"
      - "tools/check_machine_classes.py"
      - "tools/check_operation_semantics.py"
      - "tools/check_roadmap.py"
      - "tools/check_v010_workstation_qualification.py"
      - "tests/tooling/test_roadmap.py"
      - "tests/tooling/test_operation_semantics.py"
      - "tests/tooling/test_v010_workstation_qualification.py"

permissions:
  contents: read

concurrency:
  group: v010-workstation-contract-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: v0.10 exact-source workstation contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          printf 'RUST_VERSION=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Verify roadmap, support and v0.10 qualification contracts
        run: |
          set -euo pipefail
          python3 tools/check_roadmap.py
          python3 tools/check_machine_classes.py
          python3 tools/check_operation_semantics.py
          python3 tools/check_v010_workstation_qualification.py
          python3 tools/check_v010_shell_runtime_qualification.py
          python3 -m unittest \
            tests.tooling.test_roadmap \
            tests.tooling.test_operation_semantics \
            tests.tooling.test_v010_workstation_qualification \
            tests.tooling.test_v010_shell_runtime_qualification

      - name: Test typed PlatformProfile candidate compatibility
        run: cargo test -p linura-hardware --locked

      - name: Test native PlatformProfile probes and Control compatibility aggregation
        run: |
          cargo test -p linura-linux-observation --locked
          cargo test -p linura-control platform_compatibility --locked

  shell-runtime:
    name: v0.10 shell runtime qualification
    needs: contract
    uses: ./.github/workflows/v010-shell-runtime-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
