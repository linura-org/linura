name: v0.10 workstation qualification contract

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to validate; defaults to selected ref
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/v010-qualification.yml"
      - ".github/workflows/v010-shell-runtime-qualification.yml"
      - "contracts/v010-shell-runtime-qualification.toml"
      - "contracts/v010-shell-runtime-substrate.toml"
      - "contracts/v010-workstation-acceptance.toml"
      - "schemas/v010-maintained-workstation-fixture.v1.schema.json"
      - "apps/linura-shell/**"
      # Presentation-only contributor guidance is not shell implementation.
      # GitHub evaluates exclusions in order; later functional paths still match.
      - "!apps/linura-shell/AGENTS.md"
      - "!apps/linura-shell/README.md"
      - "apps/linurad/**"
      - "packaging/systemd/user/linura-shell.service"
      - "packaging/systemd/user/linurad.service"
      - "packaging/wireplumber/linura-session-audio.lua"
      - "qualification/v010/shell-runtime/**"
      - "qualification/v010/workstation-acceptance/**"
      - "tools/check_linura_shell.py"
      - "tools/check_v010_shell_runtime_qualification.py"
      - "tools/verify_tray_keyboard.py"
      - "tests/tooling/test_native_keyboard.py"
      - "tools/workstation_acceptance.py"
      - "tools/workstation_q11_runner.py"
      - "tests/tooling/test_linura_shell.py"
      - "tests/tooling/test_v010_shell_runtime_qualification.py"
      - "tests/tooling/test_workstation_acceptance.py"
      - "tests/tooling/test_workstation_q11_runner.py"
      - "contracts/roadmap.toml"
      - "contracts/v010-workstation-qualification.toml"
      - "contracts/v010-workstation-slices.toml"
      - "docs/adr/0033-v010-complete-workstation-product-boundary.md"
      - "contracts/operation-semantics.toml"
      - "contracts/components.toml"
      - "profiles/arch-hyprland-v1.toml"
      - "crates/linura-agent-runtime/**"
      - "crates/linura-capability-sdk/**"
      - "crates/linura-control/**"
      - "crates/linura-core/**"
      - "crates/linura-dbus/**"
      - "crates/linura-graph/**"
      - "crates/linura-hardware/**"
      - "crates/linura-intent/**"
      - "crates/linura-library/**"
      - "crates/linura-lifecycle/**"
      - "crates/linura-linux-observation/**"
      - "crates/linura-observation/**"
      - "crates/linura-observation-control/**"
      - "crates/linura-planner/**"
      - "crates/linura-policy/**"
      - "crates/linura-protocol/**"
      - "crates/linura-provenance/**"
      - "crates/linura-provider-sdk/**"
      - "crates/linura-transaction/**"
      - "contracts/layering.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/codex/versions.env"
      - "hardware/support-matrix.json"
      - "packaging/arch/archiso/packages.linura"
      - "qualification/v010/**"
      - "docs/milestones/v0.10.0.md"
      - "docs/operation-semantics.md"
      - "docs/adr/0032-classify-operations-before-authority.md"
      - "docs/platform-profiles.md"
      - "docs/qualification/v0.10.0.md"
      - "tools/check_machine_classes.py"
      - "tools/check_operation_semantics.py"
      - "tools/check_roadmap.py"
      - "tools/v010_slice_graph.py"
      - "tools/check_v010_workstation_qualification.py"
      - "tests/tooling/test_roadmap.py"
      - "tests/tooling/test_operation_semantics.py"
      - "tests/tooling/test_v010_workstation_qualification.py"

permissions:
  contents: read

concurrency:
  group: v010-workstation-contract-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: v0.10 exact-source workstation contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Resolve qualification evidence source
        run: |
          set -euo pipefail
          expected_source="$SOURCE_SHA"

          # Immutable release-intent commits carry the authoritative qualification
          # source explicitly. Prefer that binding when validating the release intent itself.
          if intent="$(python3 tools/release_contract.py validate-intent --source-sha "$SOURCE_SHA" --json 2>/dev/null)"; then
            candidate="$(jq -r .qualification_source_sha <<<"$intent")"
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
            expected_source="$candidate"
          else
            subject="$(git show -s --format=%s "$SOURCE_SHA")"
            if [[ "$subject" == "release: prepare v0.10.0 "* ]]; then
              # Mechanical release-preparation PRs intentionally change only
              # Cargo.toml/Cargo.lock (or are zero-diff recovery handoffs). Their
              # reviewed Q10-Q13 evidence remains bound to the pre-seal
              # Qualification-Source trailer, so validate the complete constrained
              # preparation shape before using that source identity.
              preparation="$(python3 tools/release_contract.py validate-preparation \
                --source-sha "$SOURCE_SHA" \
                --tag v0.10.0 \
                --json)"
              candidate="$(jq -r .qualification_source_sha <<<"$preparation")"
              candidate_tree="$(jq -r .qualification_tree_sha <<<"$preparation")"
              [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
              [[ "$candidate_tree" =~ ^[0-9a-f]{40}$ ]]
              test "$(git rev-parse "$candidate^{tree}")" = "$candidate_tree"
              expected_source="$candidate"
            else
              # After post-release closure, the roadmap persists the immutable
              # release-intent and qualification identities. Re-prove those trailers
              # instead of binding ready Q10-Q13 evidence to the closure commit.
              persisted="$(python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          milestone = next(
              (item for item in data.get("milestone", []) if item.get("version") == "v0.10.0"),
              None,
          )
          if not isinstance(milestone, dict):
              raise SystemExit("missing v0.10 roadmap milestone")
          if milestone.get("status") != "released":
              print("null")
          else:
              fields = {
                  "release_intent_source_sha": milestone.get("release_intent_source_sha"),
                  "qualification_source_sha": milestone.get("qualification_source_sha"),
                  "qualification_tree_sha": milestone.get("qualification_tree_sha"),
              }
              if not all(isinstance(value, str) and value for value in fields.values()):
                  raise SystemExit("released v0.10 roadmap lacks persisted qualification identity")
              print(json.dumps(fields, sort_keys=True))
          PY
            )"
            if [[ "$persisted" != "null" ]]; then
              release_intent_source="$(jq -r .release_intent_source_sha <<<"$persisted")"
              persisted_source="$(jq -r .qualification_source_sha <<<"$persisted")"
              persisted_tree="$(jq -r .qualification_tree_sha <<<"$persisted")"
              [[ "$release_intent_source" =~ ^[0-9a-f]{40}$ ]]
              [[ "$persisted_source" =~ ^[0-9a-f]{40}$ ]]
              [[ "$persisted_tree" =~ ^[0-9a-f]{40}$ ]]
              persisted_intent="$(python3 tools/release_contract.py validate-intent --source-sha "$release_intent_source" --json)"
              test "$(jq -r .qualification_source_sha <<<"$persisted_intent")" = "$persisted_source"
              test "$(jq -r .qualification_tree_sha <<<"$persisted_intent")" = "$persisted_tree"
              test "$(git rev-parse "$persisted_source^{tree}")" = "$persisted_tree"
              expected_source="$persisted_source"
            else
              # A readiness evidence seal is exactly one commit above the qualified
              # source and may change evidence-owned files only. Reproduce that
              # shape locally so PR qualification validates committed Q10-Q13
              # evidence against the pre-seal source it attests.
              mapfile -t lineage < <(git rev-list --parents -n 1 "$SOURCE_SHA")
              read -r -a parts <<<"${lineage[0]}"
              if [[ "${#parts[@]}" -eq 2 ]]; then
                parent="${parts[1]}"
                # Disable rename detection so every changed tree path is classified independently.
                # A product->evidence rename therefore appears as a disallowed product deletion plus
                # an evidence addition rather than only the allowed destination path.
                mapfile -d '' -t changed < <(git diff --no-renames --name-only -z "$parent" "$SOURCE_SHA")
                evidence_seal=true
                [[ "${#changed[@]}" -gt 0 ]] || evidence_seal=false
                for path in "${changed[@]}"; do
                  case "$path" in
                    contracts/v010-workstation-qualification.toml|contracts/v010-workstation-slices.toml|docs/qualification/v0.10.0.md|docs/releases/v0.10.0.md|qualification/v010/experience-evidence.json|qualification/v010/interactive-workstation-evidence.json|qualification/v010/security-evidence.json|qualification/v010/update-recovery-evidence.json|qualification/v010/experience/*|qualification/v010/interactive-workstation/*|qualification/v010/security/*|qualification/v010/update-recovery/*|qualification/v010/release-matrix/*.json|qualification/v010/release-matrix/*.log|qualification/v010/release-matrix/*.tsv|qualification/v010/release-matrix/*.txt|visual/baselines/*)
                      ;;
                    *)
                      evidence_seal=false
                      break
                      ;;
                  esac
                done
                if [[ "$evidence_seal" = true ]]; then
                  expected_source="$parent"
                fi
              fi
            fi
            fi
          fi

          [[ "$expected_source" =~ ^[0-9a-f]{40}$ ]]
          printf 'LINURA_EXPECTED_SOURCE_SHA=%s\n' "$expected_source" >> "$GITHUB_ENV"

      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          printf 'RUST_VERSION=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Restore Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: linura-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/codex/versions.env') }}

      - name: Verify roadmap, support and v0.10 qualification contracts
        run: |
          set -euo pipefail
          python3 tools/check_roadmap.py
          python3 tools/check_machine_classes.py
          python3 tools/check_operation_semantics.py
          python3 tools/check_v010_workstation_qualification.py
          python3 tools/check_v010_shell_runtime_qualification.py
          python3 -m unittest \
            tests.tooling.test_roadmap \
            tests.tooling.test_operation_semantics \
            tests.tooling.test_v010_workstation_qualification \
            tests.tooling.test_native_keyboard \
            tests.tooling.test_v010_shell_runtime_qualification \
            tests.tooling.test_workstation_acceptance \
            tests.tooling.test_workstation_q11_runner

      - name: Test typed PlatformProfile candidate compatibility
        run: cargo test -p linura-hardware --locked

      - name: Test native PlatformProfile probes and Control compatibility aggregation
        run: |
          cargo test -p linura-linux-observation --locked
          cargo test -p linura-control platform_compatibility --locked

  shell-runtime:
    name: v0.10 shell runtime qualification
    uses: ./.github/workflows/v010-shell-runtime-qualification.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
