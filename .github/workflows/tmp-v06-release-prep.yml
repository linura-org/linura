name: Temporary v0.6 release preparation

on:
  push:
    branches:
      - "release/v0.6.0-prep"
    paths:
      - ".github/workflows/tmp-v06-release-prep.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/v0.6.0-prep

      - name: Produce deterministic v0.6 release-preparation tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "release/v0.6.0-prep"
          python3 tools/tmp_v06_release_prep.py
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 tools/release_contract.py validate \
            --tag v0.6.0 \
            --notes docs/releases/v0.6.0.md \
            --require-workspace-version
          git diff --check
          rm tools/tmp_v06_release_prep.py .github/workflows/tmp-v06-release-prep.yml
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare v0.6.0 complete bounded managed mutation lifecycle"
          git push origin HEAD:release/v0.6.0-prep
