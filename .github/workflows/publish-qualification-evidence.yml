name: Publish approved qualification evidence to private R2

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact qualified commit on main (40 lowercase hex characters)
        required: true
        type: string
      run_id:
        description: Successful source qualification workflow run ID
        required: true
        type: string
      attempt:
        description: Exact successful run attempt
        required: true
        default: "1"
        type: string
      category:
        description: Private archive category
        required: true
        type: choice
        options: [baselines, regressions]
      reason:
        description: Why this evidence was selected for retention (12–256 characters)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-r2-evidence-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - id: source
        name: Validate immutable source and run identifiers
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/main ]]
          # GitHub environment approvals have run-wide history. A rerun cannot
          # inherit review; operators retry through a fresh workflow_dispatch.
          [[ "$GITHUB_RUN_ATTEMPT" = 1 ]] || {
            echo "publication rerun refused: dispatch a new run for fresh approval" >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require completed successful main-branch qualification attempt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" "$SOURCE_SHA" "$RUN_ID" "$ATTEMPT" <<'PY'
          import json, sys
          run=json.load(open(sys.argv[1],encoding='utf-8'))
          assert run['id']==int(sys.argv[3]) and run['run_attempt']==int(sys.argv[4])
          assert run['head_sha']==sys.argv[2] and run['head_branch']=='main'
          assert run['event']=='workflow_dispatch' and run['status']=='completed' and run['conclusion']=='success'
          assert run['repository']['full_name']=='linura-org/linura'
          assert run['path'] in (
              '.github/workflows/v010-shell-runtime-qualification.yml',
              '.github/workflows/v010-shell-runtime-qualification.yml@main',
              '.github/workflows/v010-shell-runtime-qualification.yml@refs/heads/main',
          )
          PY

  admission:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.admit.outputs.sha256 }}
    steps:
      - name: Checkout trusted admission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download exact origin attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v010-shell-runtime-${{ needs.preflight.outputs.source_sha }}-attempt-${{ inputs.attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/selected-evidence
      - name: Verify independent run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT" > "$RUNNER_TEMP/source-run.json"
      - id: admit
        name: Admit media and snapshot evidence without R2 credentials
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
          CATEGORY: ${{ inputs.category }}
          APPROVAL_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tools/evidence_publication.py admit \
            --directory "$RUNNER_TEMP/selected-evidence" \
            --staging-directory "$RUNNER_TEMP/admitted-evidence" \
            --run-json "$RUNNER_TEMP/source-run.json" \
            --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT" \
            --category "$CATEGORY" --actor "$GITHUB_ACTOR" --reason "$APPROVAL_REASON"
          sha256="$(sha256sum "$RUNNER_TEMP/admitted-evidence/publication-admission.json" | cut -d' ' -f1)"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Transfer digest-bound admission to protected publication job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linura-r2-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/admitted-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  archive:
    needs: [preflight, admission]
    runs-on: ubuntu-24.04
    environment: qualification-archive
    timeout-minutes: 40
    steps:
      - name: Checkout trusted publisher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Assert trusted publisher code
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download prior job's digest-bound admitted evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-r2-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/admitted-evidence
      - name: Fetch independent GitHub provenance and human approval
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/publication-approvals.json"
      - name: Pin credential-free admission and record approval time
        env:
          ADMISSION_SHA: ${{ needs.admission.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ADMISSION_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "$ADMISSION_SHA  $RUNNER_TEMP/admitted-evidence/publication-admission.json" | sha256sum -c -
          printf 'LINURA_ADMITTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Publish immutable evidence and verify R2 readback
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
          CATEGORY: ${{ inputs.category }}
          APPROVAL_REASON: ${{ inputs.reason }}
          ADMISSION_SHA: ${{ needs.admission.outputs.sha256 }}
        run: |
          set -euo pipefail
          aws --version
          python3 tools/evidence_publication.py publish \
            --directory "$RUNNER_TEMP/admitted-evidence" \
            --run-json "$RUNNER_TEMP/source-run.json" \
            --approval-json "$RUNNER_TEMP/publication-approvals.json" \
            --admission-sha256 "$ADMISSION_SHA" \
            --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$ATTEMPT" \
            --category "$CATEGORY" --actor "$GITHUB_ACTOR" --reason "$APPROVAL_REASON" \
            --approved-at "$LINURA_ADMITTED_AT"
