name: Release Closure Handoff

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Independently verified release tag
        required: true
        type: string
      verification_run_id:
        description: Verify published release run ID to await and bind
        required: true
        type: string
      verification_event:
        description: Trigger event of the verification run
        required: true
        type: string
      verification_ref:
        description: Head branch/ref of the verification run
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: release-closure-handoff-${{ inputs.tag }}-${{ inputs.verification_run_id }}
  cancel-in-progress: false

jobs:
  handoff:
    name: await terminal verification and dispatch closure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      VERIFICATION_EVENT: ${{ inputs.verification_event }}
      VERIFICATION_REF: ${{ inputs.verification_ref }}
    steps:
      - name: Await exact verification terminal success
        id: verification
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          case "$VERIFICATION_EVENT" in
            workflow_dispatch|release|push) ;;
            *) echo "unsupported verification event: $VERIFICATION_EVENT" >&2; exit 1 ;;
          esac

          verification=""
          for _ in $(seq 1 120); do
            verification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN_ID")"
            status="$(jq -r .status <<<"$verification")"
            case "$status" in
              completed) break ;;
              queued|in_progress|pending|waiting|requested) sleep 2 ;;
              *) echo "unexpected verification status: $status" >&2; exit 1 ;;
            esac
          done

          test -n "$verification"
          test "$(jq -r .path <<<"$verification")" = ".github/workflows/release-verification.yml"
          test "$(jq -r .status <<<"$verification")" = "completed"
          test "$(jq -r .conclusion <<<"$verification")" = "success"
          test "$(jq -r .event <<<"$verification")" = "$VERIFICATION_EVENT"
          test "$(jq -r .head_branch <<<"$verification")" = "$VERIFICATION_REF"

          source_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          verification_sha="$(jq -r .head_sha <<<"$verification")"

          if [[ "$VERIFICATION_EVENT" == "push" ]]; then
            test "$VERIFICATION_REF" = "verify-release/$RELEASE_TAG"
            # Recovery verification is already one push -> workflow_run hop, so the
            # legacy Post Release Closure workflow_run trigger remains canonical here.
            # Avoid a second explicit closure whose concurrency key would differ.
            printf 'mode=recovery-workflow-run\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$VERIFICATION_REF" = "$RELEASE_TAG"
          test "$verification_sha" = "$source_sha"
          printf 'mode=exact-tag\n' >> "$GITHUB_OUTPUT"

      - name: Prefer already-materialized workflow_run closure
        if: steps.verification.outputs.mode == 'exact-tag'
        id: existing
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/post-release-closure.yml/runs?event=workflow_run&branch=$RELEASE_TAG&per_page=20")"
            existing="$(jq -r '
              [.workflow_runs[] | select(
                .event == "workflow_run" and
                .head_branch == env.RELEASE_TAG and
                (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested" or (.status == "completed" and .conclusion == "success"))
              )] | sort_by(.created_at) | last | .id // empty
            ' <<<"$runs")"
            if [[ -n "$existing" ]]; then
              echo "Post Release Closure already materialized from workflow_run: $existing"
              printf 'skip=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch protected post-release closure fallback
        if: steps.verification.outputs.mode == 'exact-tag' && steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          gh workflow run post-release-closure.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f verification_run_id="$VERIFICATION_RUN_ID"
          echo "dispatched protected Post Release Closure for $RELEASE_TAG after verification run $VERIFICATION_RUN_ID completed successfully"
