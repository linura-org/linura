name: Temporary PR128 final repair

on:
  push:
    branches:
      - feat/v0.9-complete-reference-environment

permissions:
  contents: write

jobs:
  format-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Load repository toolchain contract
        shell: bash
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          printf 'RUST_VERSION=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Format and validate repaired sources
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_VERSION" fmt --all
          cargo +"$RUST_VERSION" xtask check
          cargo +"$RUST_VERSION" test --locked -p linura-update -p linura-migrations

      - name: Commit only validated source normalization
        shell: bash
        run: |
          set -euo pipefail
          git add crates/linura-update/src/lib.rs crates/linura-migrations/src/lib.rs
          if git diff --cached --quiet; then
            echo "No source normalization remains"
            exit 0
          fi
          git config user.name "linura-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(v0.9): normalize reviewed recovery fixes"
          git push origin HEAD:feat/v0.9-complete-reference-environment
