name: Temporary v0.8 validated repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v08-lockfile-recovery.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/v0.8-agent-interpretation-stage2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Apply deadline hardening and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/linura-control/src/agent_interpretation.rs')
          text = path.read_text(encoding='utf-8')
          old = "\n".join([
              "        let maximum_remaining = permit",
              "            .deadline_unix_ms",
              "            .checked_sub(now_unix_ms)",
              "            .ok_or(InterpretationControlError::InvocationPermitExpired)?;",
              "        if maximum_remaining == 0 || deadline.remaining_ms() > maximum_remaining {",
              "            return Err(InterpretationControlError::InvocationPermitExpired);",
              "        }",
          ]) + "\n"
          new = "\n".join([
              "        if now_unix_ms >= permit.deadline_unix_ms {",
              "            return Err(InterpretationControlError::InvocationPermitExpired);",
              "        }",
              "        let maximum_remaining = permit.deadline_unix_ms - now_unix_ms;",
              "        if deadline.remaining_ms() > maximum_remaining {",
              "            return Err(InterpretationControlError::InvocationPermitExpired);",
              "        }",
          ]) + "\n"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one invocation deadline block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all

      - name: Verify full v0.8 and canonical repository checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_v08_boundaries.py
          cargo xtask check
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Publish validated disposable candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/linura-control/src/agent_interpretation.rs \
                  crates/linura-control/src/proposal_acceptance_secure.rs \
                  crates/linura-library/src/proposal_acceptance_secure.rs \
                  crates/linura-library/src/proposal_acceptance_tests.rs \
                  crates/linura-provider-sdk/src/interpretation.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "tmp(v0.8): validated repair candidate"
          git push --force origin HEAD:refs/heads/tmp/v0.8-final-hardening-validation
