name: Temporary v0.8 lockfile recovery

on:
  push:
    branches:
      - feat/v0.8-agent-interpretation-stage2
    paths:
      - .github/workflows/tmp-v08-lockfile-recovery.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build minimal v0.8 lockfile from accepted base
        shell: bash
        env:
          V08_BASE: 205898714e27ddd9a0bd308769ae4586506bba74
        run: |
          set -euo pipefail
          git show "${V08_BASE}:Cargo.lock" > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")

          required = {
              "linura-control": ["linura-agent-runtime", "linura-library"],
              "linura-intent": ["sha2"],
              "linura-library": ["linura-transaction"],
              "linura-provider-sdk": ["linura-intent"],
          }

          for package, additions in required.items():
              pattern = re.compile(
                  rf'(\[\[package\]\]\nname = "{re.escape(package)}"\nversion = "[^"]+"\ndependencies = \[\n)(.*?)(\n\])',
                  re.DOTALL,
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f"missing workspace package block: {package}")
              deps = [
                  line.strip().strip(',').strip('"')
                  for line in match.group(2).splitlines()
                  if line.strip()
              ]
              deps = sorted(set(deps).union(additions))
              body = "\n".join(f' "{dep}",' for dep in deps)
              text = text[: match.start()] + match.group(1) + body + match.group(3) + text[match.end() :]

          path.write_text(text, encoding="utf-8")
          PY

          cargo metadata --locked --format-version 1 >/dev/null

          git show "${V08_BASE}:Cargo.lock" > /tmp/Cargo.lock.base
          diff -u /tmp/Cargo.lock.base Cargo.lock > /tmp/Cargo.lock.diff || true
          cat /tmp/Cargo.lock.diff

          python3 - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/Cargo.lock.diff').read_text(encoding='utf-8')
          allowed = {
              '+ "linura-agent-runtime",',
              '+ "linura-library",',
              '+ "sha2",',
              '+ "linura-transaction",',
              '+ "linura-intent",',
          }
          changes = [line for line in diff.splitlines() if line.startswith(('+ ', '- '))]
          unexpected = [line for line in changes if line not in allowed]
          if unexpected:
              raise SystemExit(f"unexpected lockfile delta: {unexpected}")
          if len(changes) != 5:
              raise SystemExit(f"expected exactly five dependency additions, got {len(changes)}")
          PY

      - name: Upload minimal lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v08-minimal-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
