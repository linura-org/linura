name: Temporary v0.8 lockfile recovery

on:
  push:
    branches:
      - feat/v0.8-agent-interpretation-stage2
    paths:
      - .github/workflows/tmp-v08-lockfile-recovery.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5

      - name: Install repository Rust toolchain
        run: rustup show

      - name: Regenerate Cargo.lock from manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v08-regenerated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
