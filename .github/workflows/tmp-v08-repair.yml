name: Temporary v0.8 validated repair

on:
  push:
    branches:
      - feat/v0.8-agent-interpretation-stage2
    paths:
      - .github/workflows/tmp-v08-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Apply semantic v0.8 deadline hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/linura-control/src/agent_interpretation.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let maximum_remaining = permit
            .deadline_unix_ms
            .checked_sub(now_unix_ms)
            .ok_or(InterpretationControlError::InvocationPermitExpired)?;
        if maximum_remaining == 0 || deadline.remaining_ms() > maximum_remaining {
            return Err(InterpretationControlError::InvocationPermitExpired);
        }
'''
          new = '''        if now_unix_ms >= permit.deadline_unix_ms {
            return Err(InterpretationControlError::InvocationPermitExpired);
        }
        let maximum_remaining = permit
            .deadline_unix_ms
            .checked_sub(now_unix_ms)
            .ok_or(InterpretationControlError::InvocationPermitExpired)?;
        if deadline.remaining_ms() > maximum_remaining {
            return Err(InterpretationControlError::InvocationPermitExpired);
        }
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one invocation deadline block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all

      - name: Verify v0.8 boundary contract
        run: python3 tools/check_v08_boundaries.py

      - name: Run complete canonical repository checks
        run: cargo xtask check

      - name: Commit only fully validated repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/linura-control/src/agent_interpretation.rs \
                  crates/linura-control/src/proposal_acceptance_secure.rs \
                  crates/linura-library/src/proposal_acceptance_secure.rs \
                  crates/linura-library/src/proposal_acceptance_tests.rs \
                  crates/linura-provider-sdk/src/interpretation.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git commit -m "fix(v0.8): harden deadline gate and canonical formatting"
          git push origin HEAD:feat/v0.8-agent-interpretation-stage2
