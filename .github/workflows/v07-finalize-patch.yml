name: v0.7 Integration Patch

on:
  push:
    branches:
      - feat/v0.7-local-library
    paths:
      - "tools/v07_finalize_patch.py"
      - ".github/workflows/v07-finalize-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v0.7-local-library
      - name: Apply exact integration patch
        run: python3 tools/v07_finalize_patch.py
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/linura-library crates/linura-sdk contracts scripts/check_repository.py
          git commit -m 'feat(v0.7): integrate atomic Library adoption contracts'
          git push origin HEAD:feat/v0.7-local-library
      - name: Compile and test Library
        run: cargo test --locked -p linura-library -- --test-threads=1
