name: Verify published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify; workflow ref must be this exact tag
        required: true
        type: string
  push:
    branches:
      - "verify-release/v*"
    paths:
      - ".github/release-verification-recovery/**"

permissions:
  contents: read
  attestations: read
  id-token: write

concurrency:
  group: release-verification-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      source_sha: ${{ steps.evidence.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve and bind exact tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RECOVERY_REF: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            case "$RECOVERY_REF" in
              verify-release/v*) tag="${RECOVERY_REF#verify-release/}" ;;
              *) echo "invalid release-verification recovery ref: $RECOVERY_REF" >&2; exit 2 ;;
            esac
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            if [[ "$WORKFLOW_REF" != "$tag" ]]; then
              echo "manual release verification must run from the exact requested tag: ref=$WORKFLOW_REF tag=$tag" >&2
              exit 2
            fi
          else
            echo "unsupported release-verification event: $EVENT_NAME" >&2
            exit 2
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Download published assets
        run: gh release download "${{ steps.tag.outputs.tag }}" --dir published

      - name: Verify tag, evidence and published digests
        id: evidence
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          source_sha="$(cat published/SOURCE_SHA)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(cat published/RELEASE_TAG)" = "$RELEASE_TAG"
          test -f published/linura-authorityd
          python3 tools/release_contract.py verify --directory published --tag "$RELEASE_TAG" --source-sha "$source_sha"
          python3 tools/release_verify.py published \
            --component-contract contracts/components.toml \
            --python-package bindings/python/pyproject.toml
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release metadata equals canonical contract
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json name,body,isDraft,isPrerelease > release.json
          test "$(jq -r .isDraft release.json)" = "false"
          test "$(jq -r .name release.json)" = "Linura $RELEASE_TAG"
          jq -r .body release.json > release-body.md
          python3 tools/release_contract.py compare-body --notes published/RELEASE_NOTES.md --body release-body.md
          version="${RELEASE_TAG#v}"
          version_without_build="${version%%+*}"
          expected_prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            expected_prerelease=true
          fi
          test "$(jq -r .isPrerelease release.json)" = "$expected_prerelease"

      - name: Verify PyPI publication matches complete sealed artifact set
        run: |
          set -euo pipefail
          wheel="$(find published -maxdepth 1 -type f -name 'linura-*.whl' -print -quit)"
          test -n "$wheel"
          test "$(find published -maxdepth 1 -type f -name 'linura-*.whl' | wc -l)" -eq 1
          python3 tools/pypi_verify.py \
            --pyproject bindings/python/pyproject.toml \
            --artifact "$wheel" \
            --download \
            --retries 6 \
            --retry-delay 5

      - name: Verify immutable GitHub Release and release attestation
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release verify "$RELEASE_TAG"
          while IFS= read -r -d '' file; do
            gh release verify-asset "$RELEASE_TAG" "$file"
          done < <(find published -maxdepth 1 -type f -print0)

      - name: Verify GitHub build provenance for every published candidate asset
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done < <(find published -maxdepth 1 -type f -print0)

      - name: Bind verified release evidence for terminal handoff
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          VERIFIED_SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          VERIFICATION_EVENT: ${{ github.event_name }}
          VERIFICATION_REF: ${{ github.ref_name }}
          VERIFICATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERIFIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p release-verification-evidence
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$VERIFIED_SOURCE_SHA" \
            --arg verification_run_id "$VERIFICATION_RUN_ID" \
            --arg verification_event "$VERIFICATION_EVENT" \
            --arg verification_ref "$VERIFICATION_REF" \
            '{
              schema: 1,
              tag: $tag,
              source_sha: $source_sha,
              verification_run_id: $verification_run_id,
              verification_event: $verification_event,
              verification_ref: $verification_ref
            }' > release-verification-evidence/evidence.json

      - name: Persist terminal verification handoff evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-release-verification-${{ github.run_id }}
          path: release-verification-evidence/evidence.json
          if-no-files-found: error
          retention-days: 7
