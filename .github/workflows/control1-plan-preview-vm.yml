name: Control1 plan-preview VM acceptance

run-name: '${{ github.workflow }} :: PR${{ github.event.pull_request.number || 0 }} :: ${{ github.sha }}'

on:
  pull_request:
    paths:
      - ".github/workflows/control1-plan-preview-vm.yml"
      - ".github/actions/qualification-envelope/**"
      - "contracts/qualification-execution-envelopes.toml"
      - "tools/qualification_envelope.py"
      - "tests/tooling/test_qualification_envelope.py"
      - ".github/actions/qualification-evidence/**"
      - "contracts/qualification-evidence-binding.toml"
      - "tools/qualification_evidence.py"
      - "tools/qualification_evidence_verifiers.py"
      - "tests/tooling/test_qualification_evidence.py"
      - ".github/workflows/vm-acceptance.yml"
      - "apps/linurad/**"
      - "apps/linuractl/**"
      - "crates/linura-control/**"
      - "crates/linura-core/**"
      - "crates/linura-dbus/**"
      - "crates/linura-graph/**"
      - "crates/linura-linux-observation/**"
      - "crates/linura-observation/**"
      - "crates/linura-observation-control/**"
      - "crates/linura-planner/**"
      - "crates/linura-protocol/**"
      - "crates/linura-sdk/**"
      - "interfaces/dbus/**"
      - "tests/acceptance/008-control1-plan-preview.json"
      - "tools/acceptance.py"
      - "tools/vm.py"
      - "tools/codex/versions.env"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"

      - "schemas/acceptance-scenario.v1.schema.json"
      - "schemas/desired-state.v1.schema.json"
      - "schemas/plan-preview.v1.schema.json"
      - "schemas/system-graph.v1.schema.json"
permissions:
  contents: read

jobs:
  plan-preview-vm:
    uses: ./.github/workflows/vm-acceptance.yml
    with:
      scenario: control1-plan-preview
      envelope_lane: control1-plan-preview-vm
