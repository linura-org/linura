name: PR102 Control orchestration repair final

on:
  push:
    branches:
      - docs/v0.8-agent-interpretation-contract
    paths:
      - .github/workflows/pr102-control-orchestration-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/v0.8-agent-interpretation-contract
          fetch-depth: 2

      - name: Verify repair carriers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cf6210b7e5d3b633bc92d919fca19fb27090f12e"
          test -f .github/workflows/pr102-control-orchestration-fix.yml
          test -f .github/workflows/pr102-control-orchestration-finalize.yml
          test -f .github/workflows/pr102-control-orchestration-final.yml

      - name: Apply repair and validate canonical repository
        shell: bash
        run: |
          set -euo pipefail

          awk '
            /python3 - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/pr102-control-orchestration-fix.yml \
            | grep -v 'Path(".github/workflows/pr102-control-orchestration-fix.yml").unlink()' \
            > /tmp/pr102-repair.py
          test -s /tmp/pr102-repair.py
          python3 /tmp/pr102-repair.py

          # The two superseded carriers predate the repository's immutable-action check.
          # Pin them in the validation worktree so the canonical checker validates the
          # complete tracked tree before all temporary carriers are removed.
          sed -i 's#actions/checkout@v6#actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803#g' \
            .github/workflows/pr102-control-orchestration-fix.yml \
            .github/workflows/pr102-control-orchestration-finalize.yml

          python3 scripts/check_repository.py
          git diff --check

      - name: Remove carriers and push clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr102-control-orchestration-fix.yml
          rm .github/workflows/pr102-control-orchestration-finalize.yml
          rm .github/workflows/pr102-control-orchestration-final.yml
          git diff --check

          expected=$(cat <<'EOF'
          .github/workflows/pr102-control-orchestration-final.yml
          .github/workflows/pr102-control-orchestration-finalize.yml
          .github/workflows/pr102-control-orchestration-fix.yml
          docs/adr/0028-proposal-only-agent-interpretation.md
          docs/milestones/v0.8.0.md
          docs/qualification/v0.8.0-release-review.md
          docs/qualification/v0.8.0-security.md
          docs/qualification/v0.8.0.md
          docs/releases/v0.8.0.md
          docs/threat-model.md
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(v0.8): keep provider orchestration in Control"
          git push origin HEAD:docs/v0.8-agent-interpretation-contract
