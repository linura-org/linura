name: PR 134 surgical source patch

on:
  push:
    branches:
      - fix/v0.9-black-box-qualification

permissions:
  contents: write

concurrency:
  group: pr134-surgical-source-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'linura-org/linura'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v0.9-black-box-qualification
          fetch-depth: 0

      - name: Apply exact surgical patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/pr134_black_box_patch.py')
          source = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if source.count(old) != 1:
              raise SystemExit('temporary patcher substitution contract changed')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/pr134_black_box_patch.py
          python3 -m unittest tests.tooling.test_v09_adversarial_transport_contract
          git diff --check

      - name: Commit patched source and remove one-shot patcher
        run: |
          set -euo pipefail
          git rm -f tools/pr134_black_box_patch.py .github/workflows/pr134-surgical-patch.yml
          git add \
            apps/linura-firstboot/src/main.rs \
            scripts/qualification/v09-adversarial-guest.sh \
            tests/tooling/test_v09_adversarial_transport_contract.py \
            .github/workflows/v09-qualification.yml
          if git diff --cached --quiet; then
            echo 'surgical patch produced no commit' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v0.9): make production bootstrap own authority transition'
          git push origin HEAD:fix/v0.9-black-box-qualification
