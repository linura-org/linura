name: v0.7 Lockfile Derivation

on:
  push:
    branches:
      - feat/v0.7-local-library

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Derive lockfile from checked-in resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version=1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the workspace graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for linura-library"
          git push origin HEAD:feat/v0.7-local-library
