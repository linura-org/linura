name: v0.10 shell runtime qualification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to qualify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to qualify; defaults to selected ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: v010-shell-runtime-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  RUNTIME_CONTRACT: contracts/v010-shell-runtime-qualification.toml
  SUBSTRATE_CONTRACT: contracts/v010-shell-runtime-substrate.toml
  ACCEPTANCE_CONTRACT: contracts/v010-workstation-acceptance.toml
  BASE_IMAGE_URL: https://geo.mirror.pkgbuild.com/images/v20260915.594445/Arch-Linux-x86_64-cloudimg-20260915.594445.qcow2
  BASE_IMAGE_CHECKSUM_URL: https://geo.mirror.pkgbuild.com/images/v20260915.594445/Arch-Linux-x86_64-cloudimg-20260915.594445.qcow2.SHA256
  ARCH_ARCHIVE_URL: https://archive.archlinux.org/repos/2026/09/16/$repo/os/$arch
  VM_ACCELERATION: kvm
  RELEASE_TARGET: x86_64-unknown-linux-gnu
  QUALIFICATION_NIC_MAC: 52:54:00:12:34:56
  QUALIFICATION_GPU_PCI_BDF: "0000:01:00.0"
  QUALIFICATION_GPU_VENDOR_ID: "0x1af4"
  QUALIFICATION_GPU_DEVICE_ID: "0x1050"
  QUALIFICATION_DISK_GIB: 16

jobs:
  substrate:
    name: prepared immutable Arch runtime substrate
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Load repository toolchain contract
        id: toolchain_data
        run: |
          set -euo pipefail
          toolchain_values="$(python3 -I -S tools/check_toolchain_env.py --values tools/codex/versions.env)"
          read -r ACTIONLINT_SHA256 ACTIONLINT_VERSION CARGO_AUDIT_VERSION HOST_ARCH HOST_OS PYTHON_MAJOR_MINOR PYTHON_PIP_VERSION PYTHON_RELEASE RUFF_VERSION RUSTUP_INIT_SHA256 RUSTUP_VERSION RUST_VERSION <<<"$toolchain_values"
          : "${ACTIONLINT_SHA256:?}" "${ACTIONLINT_VERSION:?}" "${CARGO_AUDIT_VERSION:?}" "${HOST_ARCH:?}" "${HOST_OS:?}" "${PYTHON_MAJOR_MINOR:?}" "${PYTHON_PIP_VERSION:?}" "${PYTHON_RELEASE:?}" "${RUFF_VERSION:?}" "${RUSTUP_INIT_SHA256:?}" "${RUSTUP_VERSION:?}" "${RUST_VERSION:?}"

      - name: Prepare guarded qualification storage
        env:
          LINURA_STORAGE_ROOT: ${{ vars.LINURA_STORAGE_ROOT }}
          LINURA_STORAGE_ID: ${{ vars.LINURA_STORAGE_ID }}
        run: bash scripts/prepare_qualification_storage.sh arch-hyprland-runtime

      - name: Assert exact source and substrate contract
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/check_v010_shell_runtime_qualification.py

      - name: Restore prepared runtime substrate
        id: prepared-substrate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2.sha256
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.json
          key: linura-v010-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('contracts/v010-shell-runtime-substrate.toml', 'qualification/v010/shell-runtime/prepare-substrate.sh') }}

      - name: Stage restored prepared substrate into private run
        if: steps.prepared-substrate.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          for name in arch-v010-shell-prepared.qcow2 arch-v010-shell-prepared.qcow2.sha256 arch-v010-shell-prepared.json; do
            cached="$LINURA_VM_BASE_DIR/$name"
            destination="$LINURA_VM_DIR/$name"
            [[ -f "$cached" && ! -L "$cached" ]]
            test "$(stat -c %h "$cached")" = 1
            test "$(stat -c %d "$cached")" = "$(stat -c %d "$LINURA_VM_BASE_DIR")"
            [[ ! -e "$destination" && ! -L "$destination" ]]
            cp -- "$cached" "$destination"
          done
      - name: Install disposable substrate builder dependencies
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils \
            openssh-client \
            qemu-system-x86 \
            qemu-utils

      - name: Restore official Arch base-image cache
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell.qcow2
          key: linura-v010-arch-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('contracts/v010-shell-runtime-substrate.toml') }}

      - name: Download and verify official Arch base image
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          image="$LINURA_VM_BASE_DIR/arch-v010-shell.qcow2"
          destination="$LINURA_VM_DIR/arch-v010-shell.qcow2"
          checksum="$LINURA_WORK_DIR/arch-v010-shell.qcow2.SHA256"
          if [[ -e "$image" || -L "$image" ]]; then
            [[ -f "$image" && ! -L "$image" ]]
            test "$(stat -c %h "$image")" = 1
            test "$(stat -c %d "$image")" = "$(stat -c %d "$LINURA_VM_BASE_DIR")"
          fi
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$checksum" "$BASE_IMAGE_CHECKSUM_URL"
          expected_name="$(basename "$BASE_IMAGE_URL")"
          digest="$(awk -v name="$expected_name" '$2 == name || $2 == "*" name {print $1}' "$checksum")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          if [[ -f "$image" ]] && ! printf '%s  %s\n' "$digest" "$image" | sha256sum --check --strict; then
            rm -f "$image"
          fi
          if [[ ! -f "$image" ]]; then
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --output "$image" "$BASE_IMAGE_URL"
          fi
          printf '%s  %s\n' "$digest" "$image" | sha256sum --check --strict
          [[ ! -e "$destination" && ! -L "$destination" ]]
          cp -- "$image" "$destination"
          printf '%s  %s\n' "$digest" "$destination" | sha256sum --check --strict
          printf 'BASE_IMAGE_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Build sanitized prepared runtime substrate
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash qualification/v010/shell-runtime/prepare-substrate.sh \
            "$SUBSTRATE_CONTRACT" \
            "$LINURA_VM_DIR/arch-v010-shell.qcow2" \
            "$LINURA_VM_DIR/arch-v010-shell-prepared.qcow2" \
            "$LINURA_VM_DIR/arch-v010-shell-prepared.json" \
            "$LINURA_WORK_DIR/linura-v010-substrate-build"

      - name: Verify prepared runtime substrate
        run: |
          set -euo pipefail
          image="$LINURA_VM_DIR/arch-v010-shell-prepared.qcow2"
          manifest="$LINURA_VM_DIR/arch-v010-shell-prepared.json"
          python3 qualification/v010/shell-runtime/verify-substrate.py \
            "$SUBSTRATE_CONTRACT" \
            qualification/v010/shell-runtime/prepare-substrate.sh \
            "$image" \
            "$manifest"
          expected="$(cut -d' ' -f1 "$LINURA_VM_DIR/arch-v010-shell-prepared.qcow2.sha256")"
          printf '%s  %s\n' "$expected" "$image" | sha256sum --check --strict

      - name: Stage verified prepared substrate in stable prerequisite cache
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for name in arch-v010-shell-prepared.qcow2 arch-v010-shell-prepared.qcow2.sha256 arch-v010-shell-prepared.json; do
            source="$LINURA_VM_DIR/$name"
            destination="$LINURA_VM_BASE_DIR/$name"
            [[ -f "$source" && ! -L "$source" ]]
            test "$(stat -c %h "$source")" = 1
            test "$(stat -c %d "$source")" = "$(stat -c %d "$LINURA_VM_BASE_DIR")"
            [[ ! -e "$destination" && ! -L "$destination" ]]
            cp -- "$source" "$destination"
          done
      - name: Save prepared runtime substrate
        if: steps.prepared-substrate.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2.sha256
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.json
          key: ${{ steps.prepared-substrate.outputs.cache-primary-key }}


  runtime:
    name: exact-source Arch/Hyprland/Quickshell runtime
    needs: substrate
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Load repository toolchain contract
        id: toolchain_data
        run: |
          set -euo pipefail
          toolchain_values="$(python3 -I -S tools/check_toolchain_env.py --values tools/codex/versions.env)"
          read -r ACTIONLINT_SHA256 ACTIONLINT_VERSION CARGO_AUDIT_VERSION HOST_ARCH HOST_OS PYTHON_MAJOR_MINOR PYTHON_PIP_VERSION PYTHON_RELEASE RUFF_VERSION RUSTUP_INIT_SHA256 RUSTUP_VERSION RUST_VERSION <<<"$toolchain_values"
          : "${ACTIONLINT_SHA256:?}" "${ACTIONLINT_VERSION:?}" "${CARGO_AUDIT_VERSION:?}" "${HOST_ARCH:?}" "${HOST_OS:?}" "${PYTHON_MAJOR_MINOR:?}" "${PYTHON_PIP_VERSION:?}" "${PYTHON_RELEASE:?}" "${RUFF_VERSION:?}" "${RUSTUP_INIT_SHA256:?}" "${RUSTUP_VERSION:?}" "${RUST_VERSION:?}"
          printf 'RUST_VERSION=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Prepare guarded qualification storage
        env:
          LINURA_STORAGE_ROOT: ${{ vars.LINURA_STORAGE_ROOT }}
          LINURA_STORAGE_ID: ${{ vars.LINURA_STORAGE_ID }}
        run: bash scripts/prepare_qualification_storage.sh arch-hyprland-runtime

      - name: Assert exact source and runtime contract
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/check_v010_shell_runtime_qualification.py

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RELEASE_TARGET"

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Establish release-compatible Rust build envelope
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          {
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
            printf 'CARGO_INCREMENTAL=0\n'
            printf 'TZ=UTC\n'
            printf 'LANG=C.UTF-8\n'
            printf 'LC_ALL=C.UTF-8\n'
            printf 'RUSTFLAGS=--remap-path-prefix=%s=/workspace\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Restore Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: linura-cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/codex/versions.env') }}

      - name: Build exact-source Linura session authority with release envelope
        run: |
          set -euo pipefail
          cargo build --workspace --release --locked --target "$RELEASE_TARGET" --target-dir "$LINURA_CARGO_TARGET"
          linurad_binary="$LINURA_CARGO_TARGET/$RELEASE_TARGET/release/linurad"
          test -x "$linurad_binary"
          linurad_sha256="$(sha256sum "$linurad_binary" | awk '{print $1}')"
          helper_sha256="$(sha256sum packaging/wireplumber/linura-session-audio.lua | awk '{print $1}')"
          [[ "$linurad_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'LINURAD_BINARY=%s\n' "$linurad_binary"
            printf 'LINURAD_SHA256=%s\n' "$linurad_sha256"
            printf 'SESSION_AUDIO_HELPER_SHA256=%s\n' "$helper_sha256"
          } >> "$GITHUB_ENV"

      - name: Install disposable graphical VM dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cloud-image-utils             ffmpeg             openssh-client             qemu-system-x86             qemu-utils

      - name: Verify KVM device and grant the isolated runner access
        run: |
          set -euo pipefail
          # Standard GitHub-hosted Ubuntu VM; never silently fall back to TCG.
          [[ "$VM_ACCELERATION" == kvm ]]
          [[ -c /dev/kvm ]]
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
          test "$(stat -c '%u:%g:%a:%F' /dev/kvm)" = "$(id -u):$(id -g):600:character special file"

      - name: Restore prepared runtime substrate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.qcow2.sha256
            ${{ env.LINURA_VM_BASE_DIR }}/arch-v010-shell-prepared.json
          key: linura-v010-prepared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('contracts/v010-shell-runtime-substrate.toml', 'qualification/v010/shell-runtime/prepare-substrate.sh') }}
          fail-on-cache-miss: true

      - name: Stage prepared substrate into private runtime namespace
        run: |
          set -euo pipefail
          for name in arch-v010-shell-prepared.qcow2 arch-v010-shell-prepared.qcow2.sha256 arch-v010-shell-prepared.json; do
            cached="$LINURA_VM_BASE_DIR/$name"
            destination="$LINURA_VM_DIR/$name"
            [[ -f "$cached" && ! -L "$cached" ]]
            test "$(stat -c %h "$cached")" = 1
            test "$(stat -c %d "$cached")" = "$(stat -c %d "$LINURA_VM_BASE_DIR")"
            [[ ! -e "$destination" && ! -L "$destination" ]]
            cp -- "$cached" "$destination"
          done
      - name: Verify prepared runtime substrate before boot
        run: |
          set -euo pipefail
          image="$LINURA_VM_DIR/arch-v010-shell-prepared.qcow2"
          manifest="$LINURA_VM_DIR/arch-v010-shell-prepared.json"
          prepared_sha="$(python3 qualification/v010/shell-runtime/verify-substrate.py \
            "$SUBSTRATE_CONTRACT" \
            qualification/v010/shell-runtime/prepare-substrate.sh \
            "$image" \
            "$manifest")"
          expected="$(cut -d' ' -f1 "$LINURA_VM_DIR/arch-v010-shell-prepared.qcow2.sha256")"
          [[ "$prepared_sha" == "$expected" ]]
          printf '%s  %s\n' "$prepared_sha" "$image" | sha256sum --check --strict
          base_sha="$(python3 - "$manifest" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(data["base_image"]["sha256"])
          PY
          )"
          [[ "$base_sha" =~ ^[0-9a-f]{64}$ ]]
          arch_snapshot="$(python3 - "$RUNTIME_CONTRACT" <<'PY'
          import pathlib
          import sys
          import tomllib
          data = tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          value = data.get("arch_archive_snapshot")
          if not isinstance(value, str) or not value:
              raise SystemExit("runtime contract lacks arch_archive_snapshot")
          print(value)
          PY
          )"
          {
            printf 'PREPARED_IMAGE=%s\n' "$image"
            printf 'PREPARED_IMAGE_SHA256=%s\n' "$prepared_sha"
            printf 'PREPARED_MANIFEST=%s\n' "$manifest"
            printf 'BASE_IMAGE_SHA256=%s\n' "$base_sha"
            printf 'PREPARED_SUBSTRATE_PATH=%s\n' "$image"
            printf 'PREPARED_SUBSTRATE_SHA256=%s\n' "$prepared_sha"
            printf 'ARCH_SNAPSHOT=%s\n' "$arch_snapshot"
          } >> "$GITHUB_ENV"

      - name: Create disposable Arch cloud-init guest
        run: |
          set -euo pipefail
          umask 077
          vm_directory="$(mktemp -d "$LINURA_VM_DIR/linura-s17-disk.XXXXXX")"
          vm_image="$vm_directory/guest.qcow2"
          seed_image="$LINURA_VM_DIR/linura-v010-shell-seed.img"
          ssh_key="$LINURA_WORK_DIR/linura-v010-shell-key"
          vm_log="$LINURA_WORK_DIR/linura-v010-shell-qemu.log"
          artifact_dir="$ARTIFACT_DIR"
          user_data="$LINURA_WORK_DIR/v010-shell-user-data"
          meta_data="$LINURA_WORK_DIR/v010-shell-meta-data"
          network_config="$LINURA_WORK_DIR/v010-shell-network-config"

          cp --reflink=auto "$PREPARED_IMAGE" "$vm_image"
          chmod 0600 "$vm_image"
          /usr/bin/python3 -I -S qualification/v010/session-security/guard-disposable-disk.py \
            --source "$PREPARED_IMAGE" --copy "$vm_image" \
            --expected-source-sha "$PREPARED_IMAGE_SHA256" --phase before \
            > "$LINURA_WORK_DIR/s17-disposable-disk-before.json"
          qemu-img resize "$vm_image" "${QUALIFICATION_DISK_GIB}G"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          public_key="$(cat "$ssh_key.pub")"

          cat > "$user_data" <<EOF
          #cloud-config
          users:
            - default
            - name: linura
              groups: [wheel]
              shell: /bin/bash
              sudo:
                - ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - $public_key
          ssh_pwauth: false
          disable_root: true
          package_update: false
          growpart:
            mode: auto
            devices: ["/"]
            ignore_growroot_disabled: false
          resize_rootfs: true
          EOF

          cat > "$meta_data" <<EOF
          instance-id: linura-v010-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          local-hostname: linura-v010-shell
          EOF

          cat > "$network_config" <<EOF
          version: 2
          renderer: networkd
          ethernets:
            qualification:
              match:
                macaddress: "$QUALIFICATION_NIC_MAC"
              set-name: eth0
              dhcp4: true
              dhcp6: false
          EOF

          cloud-localds --network-config="$network_config"             "$seed_image" "$user_data" "$meta_data"
          mkdir -p "$artifact_dir"
          cp "$LINURA_WORK_DIR/s17-disposable-disk-before.json" "$artifact_dir/"
          {
            printf 'VM_IMAGE=%s\n' "$vm_image"
            printf 'SEED_IMAGE=%s\n' "$seed_image"
            printf 'SSH_KEY=%s\n' "$ssh_key"
            printf 'VM_LOG=%s\n' "$vm_log"
            printf 'ARTIFACT_DIR=%s\n' "$artifact_dir"
          } >> "$GITHUB_ENV"

      - name: Start disposable Arch graphical guest
        run: |
          set -euo pipefail
          umask 077
          native_input_dir="$(mktemp -d /tmp/linura-s17-input.XXXXXX)"
          native_input_socket="$native_input_dir/qmp.sock"
          printf 'NATIVE_INPUT_SOCKET=%s\n' "$native_input_socket" >> "$GITHUB_ENV"
          # Persistence applies ONLY to the fresh private copy made above, never
          # the cacheable prepared substrate. Power-off recovery reboots this copy.
          bash qualification/v010/shell-runtime/start-vm.sh --persistent             --mode automated             --display none             --acceleration "$VM_ACCELERATION"             --image "$VM_IMAGE"             --seed "$SEED_IMAGE"             --memory 6144             --cpus 4             --nic-mac "$QUALIFICATION_NIC_MAC"             --ssh-port 2223 --qmp-socket "$native_input_socket"             >"$VM_LOG" 2>&1 &
          printf 'VM_PID=%s\n' "$!" >> "$GITHUB_ENV"

      - name: Wait for Arch guest and verify prepared runtime substrate
        run: |
          set -euo pipefail
          ssh_common=(
            -i "$SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=3
          )
          ready=0
          deadline=$((SECONDS + 420))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$VM_PID" 2>/dev/null; then
              echo "Arch VM exited before SSH readiness" >&2
              cat "$VM_LOG" >&2
              exit 1
            fi
            if ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 true >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "Arch VM SSH readiness deadline exceeded" >&2
            cat "$VM_LOG" >&2
            exit 1
          fi

          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             'timeout 240 cloud-init status --wait --long'
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             'lsblk -b -o NAME,SIZE,FSTYPE,MOUNTPOINTS; df -B1 /'             | tee "$ARTIFACT_DIR/guest-storage.txt"
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             'set -eu; root_size="$(df -B1 --output=size / | tail -n 1 | tr -d " ")"; root_free="$(df -B1 --output=avail / | tail -n 1 | tr -d " ")"; if [ "$root_size" -lt 8589934592 ] || [ "$root_free" -lt 4294967296 ]; then echo "guest root filesystem capacity contract not met: size=$root_size free=$root_free" >&2; df -h / >&2; exit 1; fi'

          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'pacman -Q' | LC_ALL=C sort > "$ARTIFACT_DIR/prepared-substrate-packages.txt"
          python3 - "$PREPARED_MANIFEST" "$ARTIFACT_DIR/prepared-substrate-packages.txt" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          observed = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          expected = manifest.get("package_versions")
          if observed != expected:
              raise SystemExit("prepared substrate package universe drifted before qualification")
          PY
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            "grep -Fx 'Server = $ARCH_ARCHIVE_URL' /etc/pacman.d/mirrorlist"
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'test ! -e /opt/linura-source && test ! -e /usr/bin/linurad'
          cp "$PREPARED_MANIFEST" "$ARTIFACT_DIR/prepared-substrate-manifest.json"

          set +e
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            "QUALIFICATION_GPU_PCI_BDF='$QUALIFICATION_GPU_PCI_BDF' QUALIFICATION_GPU_VENDOR_ID='$QUALIFICATION_GPU_VENDOR_ID' QUALIFICATION_GPU_DEVICE_ID='$QUALIFICATION_GPU_DEVICE_ID' bash -se" \
            2>&1 <<'GUEST' | tee "$ARTIFACT_DIR/seat-drm-setup.log"
          set -euo pipefail

          dump_graphics_state() {
              printf '%s\n' '--- seatd status ---'
              sudo -n systemctl status seatd.service --no-pager || true
              printf '%s\n' '--- seatd journal ---'
              sudo -n journalctl -u seatd.service -b --no-pager || true
              printf '%s\n' '--- seatd unit ---'
              sudo -n systemctl cat seatd.service || true
              printf '%s\n' '--- seatd socket ---'
              stat /run/seatd.sock || true
              printf '%s\n' '--- identity/groups ---'
              id
              getent group seat || true
              getent group video || true
              getent group render || true
              printf '%s\n' '--- drm nodes ---'
              ls -la /dev/dri 2>/dev/null || true
              find /sys/class/drm -maxdepth 2 -type l -print -exec readlink -f {} \; 2>/dev/null || true
              printf '%s\n' '--- DRM PCI identity ---'
              for card in /sys/class/drm/card[0-9]*; do
                  [[ -e "$card" ]] || continue
                  device="$(readlink -f "$card/device" 2>/dev/null || true)"
                  printf 'card=%s device=%s bdf=%s vendor=%s pci_device=%s transport_driver=%s\n' \
                      "$(basename "$card")" "$device" "$(basename "$device")" \
                      "$(cat "$device/vendor" 2>/dev/null || true)" \
                      "$(cat "$device/device" 2>/dev/null || true)" \
                      "$(basename "$(readlink -f "$device/driver" 2>/dev/null || true)")"
              done
              printf '%s\n' '--- virtio_gpu module ---'
              lsmod | grep -E '^(virtio_gpu|drm|drm_kms_helper)\b' || true
          }

          on_exit() {
              status=$?
              if [[ "$status" -ne 0 ]]; then
                  printf 'graphical seat provisioning failed with status %s\n' "$status" >&2
                  dump_graphics_state >&2
              fi
              exit "$status"
          }
          trap on_exit EXIT

          sudo -n modprobe virtio_gpu
          sudo -n udevadm settle --timeout=30
          sudo -n install -d -m 0755 /run/systemd/system/seatd.service.d
          printf '%s\n' '[Service]' 'Environment=SEATD_VTBOUND=0' |
              sudo -n tee /run/systemd/system/seatd.service.d/10-linura-qualification.conf >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable seatd.service
          sudo -n systemctl start seatd.service

          seat_socket=/run/seatd.sock
          for _ in $(seq 1 50); do
              [[ -S "$seat_socket" ]] && break
              sleep 0.1
          done
          [[ -S "$seat_socket" ]] || {
              echo "seatd socket readiness deadline exceeded" >&2
              exit 1
          }

          seat_group="$(stat -c '%G' "$seat_socket")"
          [[ -n "$seat_group" ]] || {
              echo "seatd socket has no owning group" >&2
              exit 1
          }
          getent group "$seat_group" >/dev/null || {
              echo "seatd socket group is unknown: $seat_group" >&2
              exit 1
          }

          groups="video,$seat_group"
          if getent group render >/dev/null; then
              groups="$groups,render"
          fi
          sudo -n usermod -aG "$groups" linura

          drm_cards=()
          for node in /sys/class/drm/card*; do
              [[ -e "$node" ]] || continue
              card_name="$(basename "$node")"
              [[ "$card_name" =~ ^card[0-9]+$ ]] || continue
              drm_cards+=("$card_name")
          done
          [[ "${#drm_cards[@]}" -eq 1 ]] || {
              echo "expected exactly one DRM card in the bounded qualification VM, found ${#drm_cards[@]}" >&2
              exit 1
          }

          qualification_card="${drm_cards[0]}"
          qualification_device="$(readlink -f "/sys/class/drm/$qualification_card/device")"
          [[ -d "$qualification_device" ]] || {
              echo "qualification DRM device sysfs path is unavailable: $qualification_card" >&2
              exit 1
          }
          qualification_bdf="$(basename "$qualification_device")"
          qualification_vendor="$(tr '[:upper:]' '[:lower:]' < "$qualification_device/vendor")"
          qualification_device_id="$(tr '[:upper:]' '[:lower:]' < "$qualification_device/device")"
          [[ "$qualification_bdf" == "$QUALIFICATION_GPU_PCI_BDF" ]] || {
              echo "qualification DRM PCI BDF mismatch: expected $QUALIFICATION_GPU_PCI_BDF, got $qualification_bdf" >&2
              exit 1
          }
          [[ "$qualification_vendor" == "$QUALIFICATION_GPU_VENDOR_ID" ]] || {
              echo "qualification DRM PCI vendor mismatch: expected $QUALIFICATION_GPU_VENDOR_ID, got $qualification_vendor" >&2
              exit 1
          }
          [[ "$qualification_device_id" == "$QUALIFICATION_GPU_DEVICE_ID" ]] || {
              echo "qualification DRM PCI device mismatch: expected $QUALIFICATION_GPU_DEVICE_ID, got $qualification_device_id" >&2
              exit 1
          }
          [[ -c "/dev/dri/$qualification_card" ]] || {
              echo "qualification DRM character device is missing: /dev/dri/$qualification_card" >&2
              exit 1
          }

          sudo -n loginctl enable-linger linura
          uid="$(id -u linura)"
          sudo -n systemctl restart "user@$uid.service"
          dump_graphics_state
          GUEST
          seat_setup_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${#seat_setup_pipeline_status[@]}" -ne 2 ]]; then
            echo "unexpected graphical seat setup pipeline width: ${#seat_setup_pipeline_status[@]}" >&2
            exit 1
          fi
          seat_setup_status="${seat_setup_pipeline_status[0]}"
          seat_setup_tee_status="${seat_setup_pipeline_status[1]}"
          if [[ "$seat_setup_status" -ne 0 ]]; then
            exit "$seat_setup_status"
          fi
          if [[ "$seat_setup_tee_status" -ne 0 ]]; then
            exit "$seat_setup_tee_status"
          fi

          source_archive="$LINURA_WORK_DIR/linura-source.tar.gz"
          git archive --format=tar.gz --output="$source_archive" "$SOURCE_SHA"
          source_archive_sha256="$(sha256sum "$source_archive" | awk '{print $1}')"
          [[ "$source_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n install -d -o root -g root -m 0700 /run/linura-source-stage; sudo -n install -o root -g root -m 0600 /dev/null /run/linura-source-stage/source.tar.gz; sudo -n tee /run/linura-source-stage/source.tar.gz >/dev/null' \
            < "$source_archive"
          scp "${ssh_common[@]}" -P 2223             "$LINURAD_BINARY"             linura@127.0.0.1:/tmp/linurad-qualification
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            "sudo -n /usr/bin/env 'EXPECTED_SHA256=$source_archive_sha256' /usr/bin/bash -s" <<'GUEST'
          set -euo pipefail
          expected_sha256="${EXPECTED_SHA256:?}"
          archive=/run/linura-source-stage/source.tar.gz
          source_root=/opt/linura-source
          [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(stat -c '%u:%g:%a:%h:%F' "$archive")" = '0:0:600:1:regular file'
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --strict
          rm -rf "$source_root"
          install -d -o root -g root -m 0755 "$source_root"
          umask 022
          tar --extract --gzip --file "$archive" --directory "$source_root" \
            --no-same-owner --no-same-permissions
          rm -f "$archive"
          rmdir /run/linura-source-stage
          for path in \
            /opt \
            "$source_root" \
            "$source_root/qualification" \
            "$source_root/qualification/v010" \
            "$source_root/qualification/v010/session-security"; do
            [[ -d "$path" && ! -L "$path" ]]
            test "$(stat -c '%u:%g:%F' "$path")" = '0:0:directory'
            test -z "$(find "$path" -maxdepth 0 -perm /022 -print -quit)"
          done
          test -z "$(find "$source_root" -xdev \( -type d -o -type f \) -perm /022 -print -quit)"
          test -z "$(find "$source_root" -xdev \( -type d -o -type f \) ! -user root -print -quit)"
          test -z "$(find "$source_root" -xdev \( -type d -o -type f \) ! -group root -print -quit)"
          test -z "$(find "$source_root" -xdev -type l -print -quit)"
          bash /opt/linura-source/qualification/v010/shell-runtime/provision-shell-runtime.sh \
            linura /opt/linura-source /tmp/linurad-qualification
          rm -f /tmp/linurad-qualification
          GUEST

          installed_linurad_sha="$(ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 'sha256sum /usr/bin/linurad | awk "{print \$1}"')"
          installed_helper_sha="$(ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 'sha256sum /usr/lib/linura/linura-session-audio.lua | awk "{print \$1}"')"
          installed_shell_bridge_sha="$(ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 'sha256sum /usr/local/lib/qt6/qml/org/linura/ShellBridge/liblinura-shell-bridge.so | awk "{print \$1}"')"
          [[ "$installed_shell_bridge_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'SHELL_BRIDGE_SHA256=%s\n' "$installed_shell_bridge_sha" >> "$GITHUB_ENV"
          [[ "$installed_linurad_sha" == "$LINURAD_SHA256" ]] || {
            echo "installed linurad digest does not match exact-source build" >&2
            exit 1
          }
          [[ "$installed_helper_sha" == "$SESSION_AUDIO_HELPER_SHA256" ]] || {
            echo "installed session-audio helper digest does not match exact source" >&2
            exit 1
          }
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'linurad_sha256=%s\n' "$installed_linurad_sha"
            printf 'session_audio_helper_sha256=%s\n' "$installed_helper_sha"
            printf 'shell_bridge_sha256=%s\n' "$installed_shell_bridge_sha"
            ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1               "stat -c '%U:%G %a %h %n' /usr/bin/linurad /usr/lib/linura/linura-session-audio.lua /usr/local/lib/qt6/qml/org/linura/ShellBridge/liblinura-shell-bridge.so"
          } > "$ARTIFACT_DIR/runtime-install-integrity.txt"

      - name: Run real shell runtime qualification
        run: |
          set -euo pipefail
          ssh_common=(
            -i "$SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5
          )
          set +e
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             "bash /opt/linura-source/qualification/v010/shell-runtime/run-shell-runtime.sh /opt/linura-source /tmp/linura-shell-runtime/evidence '$SOURCE_SHA'"             | tee "$ARTIFACT_DIR/shell-runtime-transcript.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          runtime_status="${pipeline_status[0]}"
          transcript_status="${pipeline_status[1]}"

          copy_status=0
          scp "${ssh_common[@]}" -P 2223 -r             linura@127.0.0.1:/tmp/linura-shell-runtime/evidence/.             "$ARTIFACT_DIR/" || copy_status=$?
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             'journalctl --user -u linura-shell-qualification.service -u linura-palette-qualification.service -u linura-quick-settings-qualification.service -u linura-panel-qualification.service -u linurad.service -u pipewire.service -u wireplumber.service -u linura-hyprland-qualification.service --no-pager'             > "$ARTIFACT_DIR/user-journal.log" || true
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1             'sudo -n journalctl -u seatd.service --no-pager'             > "$ARTIFACT_DIR/seatd-journal.log" || true

          if [[ "$runtime_status" -ne 0 ]]; then
            exit "$runtime_status"
          fi
          if [[ "$transcript_status" -ne 0 ]]; then
            exit "$transcript_status"
          fi
          if [[ "$copy_status" -ne 0 ]]; then
            exit "$copy_status"
          fi

      - name: Install and check genuine S17 native session bootstrap
        run: |
          set -euo pipefail
          ssh_common=(
            -i "$SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=3
          )
          # Use the same exact-source release outputs and asset installer as
          # the image. The substrate contains no Linura binaries/native evidence.
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n install -d -o linura -g linura -m 0700 /tmp/linura-s17-binaries'
          for name in linurad linuractl linura-firstboot linura-update-guard linura-executor-systemd linura-executor-session linura-authorityd; do
            binary="$LINURA_CARGO_TARGET/$RELEASE_TARGET/release/$name"
            test -x "$binary"
            expected_binary_sha="$(sha256sum "$binary" | awk '{print $1}')"
            sha256sum "$binary" >> "$ARTIFACT_DIR/s17-source-binaries.sha256"
            scp "${ssh_common[@]}" -P 2223 "$binary" \
              "linura@127.0.0.1:/tmp/linura-s17-binaries/$name"
            installed_binary_sha="$(ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
              "sha256sum /tmp/linura-s17-binaries/$name" | awk '{print $1}')"
            [[ "$installed_binary_sha" == "$expected_binary_sha" ]] || exit 1
          done
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n chown -R root:root /tmp/linura-s17-binaries; sudo -n chmod 0700 /tmp/linura-s17-binaries'
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n timeout 1100 python3 /opt/linura-source/qualification/v010/session-security/provision-native-session.py' \
            2>&1 | tee "$ARTIFACT_DIR/s17-native-provision.log"
          set +e
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n timeout 100 python3 /opt/linura-source/qualification/v010/session-security/check-native-session.py' \
            > "$ARTIFACT_DIR/s17-native-bootstrap.json" 2> "$ARTIFACT_DIR/s17-native-bootstrap.stderr"
          native_status=$?
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n journalctl -b --no-pager -n 1000 -u linura-s17-session.service -u "linura-security-owner@*" -u linura-authorityd.service -u linura-executor-session.service' \
            > "$ARTIFACT_DIR/s17-native-bootstrap-journal.log" 2>&1
          diagnostics_status=$?
          set -e
          [[ "$native_status" -eq 0 ]] || exit "$native_status"
          [[ "$diagnostics_status" -eq 0 ]] || exit "$diagnostics_status"

      - name: Exercise native same-UID process-access denial
        run: |
          set -euo pipefail
          ssh_common=(
            -i "$SSH_KEY"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=3
          )
          # Stronger adversarial fixture: temporarily remove Yama in the VM,
          # prove native owner protection, and restore the original setting.
          # This does not qualify authentication or the complete S17 slice.
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
            'sudo -n timeout 40 /usr/bin/python3 -I -S /opt/linura-source/qualification/v010/session-security/run-same-uid-probes.py' \
            > "$ARTIFACT_DIR/s17-native-same-uid.json" 2> "$ARTIFACT_DIR/s17-native-same-uid.stderr"

      - name: Qualify real S17 owner authentication and retained recovery
        run: |
          set -euo pipefail
          # Fresh random responses cross private stdin/QMP only. No response
          # arguments, static passwords, PAM overrides or production rule changes.
          # This case subset is NOT complete S17 or physical-workstation evidence.
          timeout --signal=TERM --kill-after=5s 900 /usr/bin/python3 -I -S qualification/v010/session-security/qualify-native-auth.py \
            --qmp-socket "$NATIVE_INPUT_SOCKET" \
            --ssh-identity "$SSH_KEY" \
            --bootstrap "$ARTIFACT_DIR/s17-native-bootstrap.json" \
            --source-sha "$SOURCE_SHA" \
            > "$ARTIFACT_DIR/s17-native-authentication.json" \
            2> "$ARTIFACT_DIR/s17-native-authentication.stderr"
          ssh -F /dev/null -i "$SSH_KEY" -p 2223 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=3 linura@127.0.0.1 \
            'sha256sum /usr/lib/linura/qualification/linura-s17-assistive-probe' \
            > "$ARTIFACT_DIR/s17-native-assistive-binary.sha256"
          sha256sum \
            "$ARTIFACT_DIR/s17-native-authentication.json" \
            "$ARTIFACT_DIR/s17-native-bootstrap.json" \
            "$ARTIFACT_DIR/s17-source-binaries.sha256" \
            "$ARTIFACT_DIR/s17-native-assistive-binary.sha256" \
            qualification/v010/session-security/qualify-native-auth.py \
            qualification/v010/session-security/native-auth-fixture.py \
            qualification/v010/session-security/native-assistive-fixture.py \
            qualification/v010/session-security/native-assistive-probe.cpp \
            qualification/v010/session-security/native-assistive-prompt.h \
            qualification/v010/session-security/native-assistive-denial.h \
            qualification/v010/session-security/native-assistive-denial-test.cpp \
            qualification/v010/session-security/native-assistive-discovery.h \
            qualification/v010/session-security/native-assistive-discovery-test.cpp \
            qualification/v010/session-security/CMakeLists.txt \
            qualification/v010/session-security/provision-native-session.py \
            qualification/v010/session-security/native_input.py \
            > "$ARTIFACT_DIR/s17-native-case-digests.sha256"

      - name: Qualify real managed S17 suspend and observe-only recovery
        run: |
          set -euo pipefail
          # The fixed guest service waits for SSH logins to end. Production
          # other-session/inhibitor checks, administrator PAM and native gates
          # remain unchanged. QMP wakes only an independently observed suspend.
          timeout --signal=TERM --kill-after=5s 360 /usr/bin/python3 -I -S qualification/v010/session-security/qualify-native-suspend.py \
            --qmp-socket "$NATIVE_INPUT_SOCKET" \
            --ssh-identity "$SSH_KEY" \
            --vm-log "$VM_LOG" \
            --source-sha "$SOURCE_SHA" \
            > "$ARTIFACT_DIR/s17-native-suspend.json" \
            2> "$ARTIFACT_DIR/s17-native-suspend.stderr"
          sha256sum \
            "$ARTIFACT_DIR/s17-native-suspend.json" \
            "$ARTIFACT_DIR/s17-source-binaries.sha256" \
            qualification/v010/session-security/qualify-native-suspend.py \
            qualification/v010/session-security/native-suspend-fixture.py \
            qualification/v010/session-security/qualify-native-auth.py \
            qualification/v010/session-security/native-assistive-fixture.py \
            qualification/v010/session-security/native-assistive-probe.cpp \
            qualification/v010/session-security/native-assistive-prompt.h \
            "$ARTIFACT_DIR/s17-native-assistive-binary.sha256" \
            qualification/v010/session-security/native_input.py \
            > "$ARTIFACT_DIR/s17-native-suspend-digests.sha256"

      - name: Capture runtime package identity
        run: |
          set -euo pipefail
          ssh_common=(-i "$SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
          ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 'pacman -Q' | LC_ALL=C sort > "$ARTIFACT_DIR/runtime-package-manifest.txt"
          runtime_package_manifest_sha256="$(sha256sum "$ARTIFACT_DIR/runtime-package-manifest.txt" | awk '{print $1}')"
          [[ "$runtime_package_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'GUEST_PACKAGE_MANIFEST_SHA256=%s\n' "$runtime_package_manifest_sha256"
            printf 'RUNTIME_PACKAGE_MANIFEST_SHA256=%s\n' "$runtime_package_manifest_sha256"
          } >> "$GITHUB_ENV"
          /usr/bin/python3 -I tools/qualification_guest_identity.py capture-ssh \
            --host 127.0.0.1 --port 2223 --user linura --identity "$SSH_KEY" \
            --package-manager pacman \
            --output "$ARTIFACT_DIR/guest-execution-identity.json" \
            --github-env "$GITHUB_ENV"

      - name: Verify automated workstation recording
        run: |
          set -euo pipefail
          python3 tools/workstation_acceptance.py             verify-recording "$ARTIFACT_DIR/workstation-runtime.mkv"             --metadata "$ARTIFACT_DIR/workstation-runtime.metadata.json"             --source-sha "$SOURCE_SHA"
          read -r expected_recording_sha expected_recording_name < "$ARTIFACT_DIR/workstation-runtime.sha256"
          actual_recording_sha="$(sha256sum "$ARTIFACT_DIR/workstation-runtime.mkv" | awk '{print $1}')"
          [[ "$expected_recording_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_recording_name" == "workstation-runtime.mkv" ]]
          [[ "$actual_recording_sha" == "$expected_recording_sha" ]]

      - name: Bind exact-source runtime evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib
          from tools.verify_tray_keyboard import verify_retained

          root = pathlib.Path.cwd()
          artifacts = pathlib.Path(os.environ["ARTIFACT_DIR"])
          contract_path = root / os.environ["RUNTIME_CONTRACT"]
          substrate_contract_path = root / os.environ["SUBSTRATE_CONTRACT"]
          acceptance_contract_path = root / os.environ["ACCEPTANCE_CONTRACT"]
          contract = tomllib.loads(contract_path.read_text(encoding="utf-8"))

          def digest(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cases_path = artifacts / "cases.tsv"
          transcript_path = artifacts / "shell-runtime-transcript.log"
          versions_path = artifacts / "runtime-versions.txt"
          package_versions_path = artifacts / "package-versions.txt"
          visible_systemd = artifacts / "visible-application-systemd.txt"
          forking_systemd = artifacts / "forking-application-systemd.txt"
          palette_session = artifacts / "palette-session.txt"
          hyprland_session = artifacts / "hyprland-session.env"
          guest_storage = artifacts / "guest-storage.txt"
          seat_drm_preflight = artifacts / "seat-drm-preflight.txt"
          seat_drm_setup = artifacts / "seat-drm-setup.log"
          ui_module_linkage = artifacts / "ui-module-linkage.txt"
          bridge_module_linkage = artifacts / "bridge-module-linkage.txt"
          qt_quick_rendering = artifacts / "qt-quick-rendering.env"
          runtime_install_integrity = artifacts / "runtime-install-integrity.txt"
          authority_runtime_integrity = artifacts / "authority-runtime-integrity.txt"
          prepared_substrate_manifest = artifacts / "prepared-substrate-manifest.json"
          prepared_substrate_packages = artifacts / "prepared-substrate-packages.txt"
          pipewire_fixture_create = artifacts / "pipewire-fixture-create.txt"
          pipewire_fixture_props = artifacts / "pipewire-fixture-props.txt"
          pipewire_snapshot_initial = artifacts / "pipewire-snapshot-initial.txt"
          quick_settings_audio_fixture = artifacts / "quick-settings-audio-fixture.txt"
          quick_settings_observation = artifacts / "quick-settings-observation.txt"
          quick_settings_effect = artifacts / "quick-settings-session1-effect.txt"
          quick_settings_audit = artifacts / "quick-settings-audit.txt"
          quick_settings_drift = artifacts / "quick-settings-precondition-drift.txt"
          quick_settings_service_loss = artifacts / "quick-settings-service-loss.txt"
          quick_settings_recovery = artifacts / "quick-settings-restart-recovery.txt"
          lifecycle_feedback_success = artifacts / "lifecycle-feedback-success.txt"
          lifecycle_feedback_drift = artifacts / "lifecycle-feedback-precondition-drift.txt"
          workstation_panel = artifacts / "workstation-panel.txt"
          workstation_panel_monitors = artifacts / "workstation-panel-monitors.json"
          workstation_panel_shortcuts = artifacts / "workstation-panel-shortcuts.json"
          tray_keyboard_behavior = artifacts / "tray-keyboard-behavior.jsonl"
          native_keyboard_events = artifacts / "native-keyboard-events.txt"
          native_keyboard_digest = artifacts / "native-keyboard.sha256"
          workstation_recording = artifacts / "workstation-runtime.mkv"
          workstation_recording_metadata = artifacts / "workstation-runtime.metadata.json"
          workstation_recording_sha256 = artifacts / "workstation-runtime.sha256"
          required_files = (
              cases_path,
              transcript_path,
              versions_path,
              package_versions_path,
              visible_systemd,
              forking_systemd,
              palette_session,
              hyprland_session,
              guest_storage,
              seat_drm_preflight,
              seat_drm_setup,
              ui_module_linkage,
              bridge_module_linkage,
              qt_quick_rendering,
              runtime_install_integrity,
              authority_runtime_integrity,
              prepared_substrate_manifest,
              prepared_substrate_packages,
              pipewire_fixture_create,
              pipewire_fixture_props,
              pipewire_snapshot_initial,
              quick_settings_audio_fixture,
              quick_settings_observation,
              quick_settings_effect,
              quick_settings_audit,
              quick_settings_drift,
              quick_settings_service_loss,
              quick_settings_recovery,
              lifecycle_feedback_success,
              lifecycle_feedback_drift,
              workstation_panel,
              workstation_panel_monitors,
              workstation_panel_shortcuts,
              tray_keyboard_behavior,
              native_keyboard_events,
              native_keyboard_digest,
              workstation_recording,
              workstation_recording_metadata,
              workstation_recording_sha256,
          )
          for path in required_files:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"runtime evidence missing or untrusted: {path.name}")

          workstation_panel_values = {}
          verify_retained(tray_keyboard_behavior, native_keyboard_events, native_keyboard_digest)
          for line in workstation_panel.read_text(encoding="utf-8").splitlines():
              if "=" not in line:
                  raise SystemExit(f"invalid workstation panel evidence record: {line!r}")
              key, value = line.split("=", 1)
              if not key or key in workstation_panel_values:
                  raise SystemExit(f"invalid or duplicate workstation panel evidence key: {key!r}")
              workstation_panel_values[key] = value
          for key in (
              "global_shortcuts_bound",
              "keyboard_focus_entered",
              "keyboard_entry_focused",
              "status_rendered",
              "tray_inline_activated",
              "tray_inline_menu_activated",
              "tray_overflow_opened",
              "tray_cancelled",
              "tray_keyboard_focus_restored",
              "tray_overflow_reopened",
              "tray_overflow_activated",
          ):
              if workstation_panel_values.get(key) != "true":
                  raise SystemExit(
                      f"workstation panel/tray/status evidence is not positive: {key}"
                  )
          if workstation_panel_values.get("tray_overflow_closed") != "false":
              raise SystemExit("workstation tray overflow did not remain closed after activation")
          for key in ("status_time", "status_date"):
              if not workstation_panel_values.get(key):
                  raise SystemExit(f"workstation status evidence is empty: {key}")
          try:
              status_before = int(workstation_panel_values["status_timestamp_before"])
              status_after = int(workstation_panel_values["status_timestamp_after"])
              tray_item_count = int(workstation_panel_values["tray_item_count"])
              tray_overflow_count = int(workstation_panel_values["tray_overflow_count"])
              tray_primary_requests = int(workstation_panel_values["tray_primary_requests"])
              tray_menu_requests = int(workstation_panel_values["tray_menu_requests"])
          except (KeyError, ValueError) as error:
              raise SystemExit(f"invalid workstation tray/status evidence: {error}") from error
          if status_after <= status_before:
              raise SystemExit("workstation status clock evidence did not advance")
          if tray_item_count != 5 or tray_overflow_count < 1:
              raise SystemExit("workstation tray bounded-overflow evidence is invalid")
          if tray_primary_requests != 2:
              raise SystemExit("workstation tray action evidence did not record both primary activations")
          if tray_menu_requests != 1:
              raise SystemExit("workstation tray menu evidence did not record exactly one native menu display")

          recording_metadata = json.loads(
              workstation_recording_metadata.read_text(encoding="utf-8")
          )
          if recording_metadata.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("workstation recording metadata source SHA mismatch")
          if recording_metadata.get("sha256") != digest(workstation_recording):
              raise SystemExit("workstation recording metadata digest mismatch")
          digest_line = workstation_recording_sha256.read_text(encoding="utf-8").strip().split()
          if digest_line != [digest(workstation_recording), workstation_recording.name]:
              raise SystemExit("workstation recording digest file mismatch")

          observed = {}
          for line in cases_path.read_text(encoding="utf-8").splitlines():
              case_id, result = line.split("\t", 1)
              if case_id in observed:
                  raise SystemExit(f"duplicate runtime case: {case_id}")
              observed[case_id] = result
          required = contract["required_cases"]
          if set(observed) != set(required):
              raise SystemExit(
                  f"runtime case set mismatch: expected {sorted(required)}, got {sorted(observed)}"
              )
          if any(value != "passed" for value in observed.values()):
              raise SystemExit("one or more runtime cases did not pass")

          bindings = {}
          for path in sorted(required_files):
              bindings[path.name] = {
                  "sha256": digest(path),
                  "size": path.stat().st_size,
              }

          rendering_backend = None
          for line in qt_quick_rendering.read_text(encoding="utf-8").splitlines():
              if line.startswith("backend="):
                  if rendering_backend is not None:
                      raise SystemExit("duplicate Qt Quick rendering backend record")
                  rendering_backend = line.split("=", 1)[1]
          if rendering_backend != contract["qt_quick_backend"]:
              raise SystemExit(
                  f"Qt Quick rendering backend mismatch: expected {contract['qt_quick_backend']!r}, "
                  f"got {rendering_backend!r}"
              )

          package_versions = {}
          for line in package_versions_path.read_text(encoding="utf-8").splitlines():
              name, version = line.split(" ", 1)
              if name in package_versions or not name or not version:
                  raise SystemExit(f"invalid or duplicate package version record: {line!r}")
              package_versions[name] = version
          required_packages = {
              "base-devel",
              "cmake",
              "ninja",
              "pkgconf",
              "dbus",
              "systemd",
              "hyprland",
              "quickshell",
              "qt6-base",
              "qt6-declarative",
              "qt6-wayland",
              "mesa",
              "vulkan-swrast",
              "seatd",
              "pipewire",
              "pipewire-audio",
              "wireplumber",
              "networkmanager",
              "sqlite",
              "ffmpeg",
              "wf-recorder",
              "wayland",
              "wayland-protocols",
              "polkit",
              "at-spi2-core",
              "libcap",
              "libxkbcommon",
              "libx11",
              "fontconfig",
              "ttf-dejavu",
          }
          if set(package_versions) != required_packages:
              raise SystemExit(
                  f"runtime package version set mismatch: expected {sorted(required_packages)}, "
                  f"got {sorted(package_versions)}"
              )

          evidence = {
              "schema_version": contract["evidence"]["schema_version"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "result": "passed",
              "claim": contract["claim"],
              "target_profile": contract["target_profile"],
              "runtime_contract": {
                  "path": contract_path.relative_to(root).as_posix(),
                  "sha256": digest(contract_path),
              },
              "substrate_contract": {
                  "path": substrate_contract_path.relative_to(root).as_posix(),
                  "sha256": digest(substrate_contract_path),
              },
              "workstation_acceptance_contract": {
                  "path": acceptance_contract_path.relative_to(root).as_posix(),
                  "sha256": digest(acceptance_contract_path),
              },
              "base_image": {
                  "url": os.environ["BASE_IMAGE_URL"],
                  "sha256": os.environ["BASE_IMAGE_SHA256"],
              },
              "prepared_substrate": {
                  "image_sha256": os.environ["PREPARED_IMAGE_SHA256"],
                  "manifest_sha256": digest(prepared_substrate_manifest),
                  "scope": "sanitized-non-authoritative-prerequisite",
              },
              "arch_archive": {
                  "snapshot": contract["arch_archive_snapshot"],
                  "url": contract["arch_archive_url"],
              },
              "virtualization": {
                  "acceleration": os.environ["VM_ACCELERATION"],
                  "gpu": "virtio-gpu-pci",
                  "disk_size_gib": contract["vm_disk_size_gib"],
              },
              "rendering": {
                  "qt_quick_backend": rendering_backend,
                  "scope": "headless-development-runtime",
              },
              "workstation_recording": {
                  "path": workstation_recording.name,
                  "sha256": digest(workstation_recording),
                  "metadata_sha256": digest(workstation_recording_metadata),
                  "digest_file_sha256": digest(workstation_recording_sha256),
                  "scope": "captured-automated-wayland-session",
              },
              "authority_runtime": {
                  "linurad_sha256": os.environ["LINURAD_SHA256"],
                  "shell_bridge_sha256": os.environ["SHELL_BRIDGE_SHA256"],
                  "session_audio_helper_sha256": os.environ["SESSION_AUDIO_HELPER_SHA256"],
                  "scope": "real-session-authority",
              },
              "cases": observed,
              "runtime_packages": package_versions,
              "artifacts": bindings,
              "workflow": {
                  "path": contract["workflow"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "event": os.environ["GITHUB_EVENT_NAME"],
              },
              "release_support_promotion": False,
          }
          output = artifacts / "V010-SHELL-RUNTIME-EVIDENCE.json"
          output.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (artifacts / "V010-SHELL-RUNTIME-EVIDENCE.sha256").write_text(
              f"{digest(output)}  {output.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Qualify native S17 terminating transitions without effect replay
        run: |
          set -euo pipefail
          # Runtime evidence above remains bound to its ORIGINAL execution boot.
          # These distinct partial S17 reports retain their own old/new boot IDs.
          ssh_common=(-F /dev/null -i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3)
          for purpose in logout reboot power-off; do
            printf 'native-transition-stage purpose=%s phase=prepare\n' "$purpose"
            timeout --signal=TERM --kill-after=5s 180 /usr/bin/python3 -I -S qualification/v010/session-security/qualify-native-transition.py \
              --phase prepare --purpose "$purpose" --source-sha "$SOURCE_SHA" \
              --qmp-socket "$NATIVE_INPUT_SOCKET" --vm-log "$VM_LOG" --ssh-identity "$SSH_KEY" \
              > "$ARTIFACT_DIR/s17-$purpose-handoff.json" \
              2> "$ARTIFACT_DIR/s17-$purpose-prepare.stderr"
            if [[ "$purpose" == power-off ]]; then
              deadline=$((SECONDS + 60))
              while kill -0 "$VM_PID" 2>/dev/null; do
                state="$(ps -o stat= -p "$VM_PID" || true)"
                [[ "$state" == Z* ]] && break
                (( SECONDS < deadline )) || { echo 'guest power-off did not exit QEMU' >&2; exit 1; }
                sleep 1
              done
              umask 077
              native_input_dir="$(mktemp -d /tmp/linura-s17-recovery-input.XXXXXX)"
              NATIVE_INPUT_SOCKET="$native_input_dir/qmp.sock"
              printf 'NATIVE_INPUT_SOCKET=%s\n' "$NATIVE_INPUT_SOCKET" >> "$GITHUB_ENV"
              # SAME disposable disk, unchanged pinned guest topology. This is
              # a host boot, not a replay of the original managed power request.
              bash qualification/v010/shell-runtime/start-vm.sh --persistent \
                --mode automated --display none --acceleration "$VM_ACCELERATION" --image "$VM_IMAGE" --seed "$SEED_IMAGE" \
                --memory 6144 --cpus 4 --nic-mac "$QUALIFICATION_NIC_MAC" \
                --ssh-port 2223 --qmp-socket "$NATIVE_INPUT_SOCKET" \
                > "$ARTIFACT_DIR/s17-power-off-recovery-qemu.log" 2>&1 &
              VM_PID=$!
              printf 'VM_PID=%s\n' "$VM_PID" >> "$GITHUB_ENV"
            fi
            printf 'native-transition-stage purpose=%s phase=verify\n' "$purpose"
            timeout --signal=TERM --kill-after=5s 600 /usr/bin/python3 -I -S qualification/v010/session-security/qualify-native-transition.py \
              --phase verify --purpose "$purpose" --source-sha "$SOURCE_SHA" \
              --handoff "$ARTIFACT_DIR/s17-$purpose-handoff.json" --ssh-identity "$SSH_KEY" \
              > "$ARTIFACT_DIR/s17-native-$purpose.json" \
              2> "$ARTIFACT_DIR/s17-$purpose-verify.stderr"
            if [[ "$purpose" != power-off ]]; then
              printf 'native-transition-stage purpose=%s phase=bootstrap\n' "$purpose"
              # Recreate the genuine PAM/logind session, never fabricate a
              # session handle or manually start the native security owner.
              ssh "${ssh_common[@]}" -p 2223 linura@127.0.0.1 \
                'sudo -n timeout 100 /usr/bin/python3 -I -S /opt/linura-source/qualification/v010/session-security/check-native-session.py' \
                > "$ARTIFACT_DIR/s17-after-$purpose-bootstrap.json" \
                2> "$ARTIFACT_DIR/s17-after-$purpose-bootstrap.stderr"
            fi
          done
          sha256sum \
            "$ARTIFACT_DIR"/s17-native-logout.json \
            "$ARTIFACT_DIR"/s17-native-reboot.json \
            "$ARTIFACT_DIR"/s17-native-power-off.json \
            "$ARTIFACT_DIR"/s17-logout-handoff.json \
            "$ARTIFACT_DIR"/s17-reboot-handoff.json \
            "$ARTIFACT_DIR"/s17-power-off-handoff.json \
            "$ARTIFACT_DIR/s17-source-binaries.sha256" \
            qualification/v010/session-security/native-transition-fixture.py \
            qualification/v010/session-security/qualify-native-transition.py \
            qualification/v010/session-security/native-suspend-fixture.py \
            qualification/v010/session-security/qualify-native-suspend.py \
            qualification/v010/session-security/qualify-native-auth.py \
            qualification/v010/session-security/native-assistive-fixture.py \
            qualification/v010/session-security/native-assistive-probe.cpp \
            qualification/v010/session-security/native-assistive-prompt.h \
            "$ARTIFACT_DIR/s17-native-assistive-binary.sha256" \
            qualification/v010/session-security/native_input.py \
            > "$ARTIFACT_DIR/s17-native-terminating-digests.sha256"

      - name: Verify cached substrate remained immutable after native power recovery
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S qualification/v010/session-security/guard-disposable-disk.py \
            --source "$PREPARED_IMAGE" --copy "$VM_IMAGE" \
            --expected-source-sha "$PREPARED_IMAGE_SHA256" --phase after \
            > "$ARTIFACT_DIR/s17-disposable-disk-after.json"

      - name: Bind qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        with:
          lane: v010-shell-runtime
          source-sha: ${{ env.SOURCE_SHA }}
          execution-subject-file: ${{ env.ARTIFACT_DIR }}/guest-execution-identity.json


      - name: Stop disposable guest
        if: ${{ always() && steps.toolchain_data.outcome == 'success' }}
        run: |
          set +e
          if [[ -n "${VM_PID:-}" ]]; then
            kill "$VM_PID" 2>/dev/null || true
            wait "$VM_PID" 2>/dev/null || true
          fi

      - name: Collect QEMU diagnostics
        if: ${{ always() && steps.toolchain_data.outcome == 'success' }}
        run: |
          set -euo pipefail
          artifact_dir="${ARTIFACT_DIR:?dedicated evidence storage is required}"
          mkdir -p "$artifact_dir"
          if [[ -f "${VM_LOG:-}" ]]; then
            cp "$VM_LOG" "$artifact_dir/qemu.log"
          fi
          # These fixed native runner stderr files contain source-redacted
          # categories/receipts; bootstrap runs before credential configuration.
          # Recreated-session bootstrap also reads no authentication responses.
          # Keep journals, process environments and arbitrary files out of logs.
          # This executes only after a failure and cannot change its outcome.
          if [[ '${{ job.status }}' == failure ]]; then
            for diagnostic in \
              s17-native-bootstrap.stderr \
              s17-native-authentication.stderr \
              s17-native-suspend.stderr \
              s17-logout-prepare.stderr \
              s17-logout-verify.stderr \
              s17-after-logout-bootstrap.stderr \
              s17-reboot-prepare.stderr \
              s17-reboot-verify.stderr \
              s17-after-reboot-bootstrap.stderr \
              s17-power-off-prepare.stderr \
              s17-power-off-verify.stderr; do
              if [[ -s "$artifact_dir/$diagnostic" ]]; then
                printf '%s\n' "native-failure-diagnostic $diagnostic"
                /usr/bin/timeout --kill-after=1 2 /usr/bin/head -c 16384 "$artifact_dir/$diagnostic"
              fi
            done
          fi

      - name: Admit and upload sealed qualification evidence
        uses: ./.github/actions/qualification-evidence
        with:
          lane: v010-shell-runtime
          artifact-root: ${{ env.ARTIFACT_DIR }}
          artifact-name: linura-v010-shell-runtime-${{ inputs.source_sha || github.sha }}-attempt-${{ github.run_attempt }}
          compression-level: "0"
      - name: Upload unqualified v0.10 shell diagnostics
        if: ${{ failure() && steps.toolchain_data.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linura-v010-shell-runtime-${{ inputs.source_sha || github.sha }}-attempt-${{ github.run_attempt }}-unqualified-diagnostics
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
