name: Release Promotion

run-name: Release Promotion — ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main SHA with a successful Trusted Release Proof
        required: true
        type: string
      proof_run_id:
        description: Exact Trusted Release Proof run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate proven source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Verify exact proof and release identity
        id: release
        run: |
          set -euo pipefail

          # The proof's dispatch job starts Promotion before the parent workflow
          # can report its own terminal state. Wait only for that exact run.
          run=""
          for _ in $(seq 1 30); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID")"
            status="$(jq -r .status <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            case "$status" in
              queued|in_progress|pending|waiting|requested)
                sleep 2
                ;;
              *)
                echo "unexpected Trusted Release Proof status: $status" >&2
                exit 1
                ;;
            esac
          done

          test -n "$run"
          test "$(jq -r .path <<<"$run")" = ".github/workflows/trusted-release-proof.yml"
          test "$(jq -r .event <<<"$run")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_sha <<<"$run")" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$SOURCE_SHA" ]]; then
            echo "stale successful proof ignored: current main is $main_sha, proof source was $SOURCE_SHA"
            exit 0
          fi

          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          subject, output_path = sys.argv[1], sys.argv[2]
          match = re.fullmatch(
              r"release: (?P<tag>v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-intent subject: {subject!r}")
          tag = match.group("tag")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"version={tag[1:]}\n")
          PY

          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          python3 tools/release_contract.py validate \
            --tag "$tag" \
            --notes "docs/releases/${tag}.md" \
            --require-workspace-version

          if tag_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            tag_sha="$(jq -r .object.sha <<<"$tag_payload")"
            test "$tag_sha" = "$SOURCE_SHA"
          fi

  closure-readiness:
    name: prove automatic post-release closure authority
    needs: validate
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_AUTOMATION_CREDENTIAL_SOURCE: ${{ secrets.RELEASE_AUTOMATION_TOKEN != '' && 'dedicated' || 'github' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.source_sha }}

      - name: Prove exact closure credential capabilities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$SOURCE_SHA"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --credential-source "$RELEASE_AUTOMATION_CREDENTIAL_SOURCE"

  dispatch:
    name: dispatch immutable publication
    needs: [validate, closure-readiness]
    if: ${{ needs.validate.result == 'success' && needs.closure-readiness.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Dispatch Release on exact proven main
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$RELEASE_VERSION" = "${RELEASE_TAG#v}"

          release_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$SOURCE_SHA&event=workflow_dispatch&per_page=100")"
          active="$(jq -r '[.workflow_runs[] | select(.head_sha == env.SOURCE_SHA and .event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested"))] | .[0].id // empty' <<<"$release_runs")"
          if [[ -n "$active" ]]; then
            echo "active Release run already exists for $SOURCE_SHA: $active"
            exit 0
          fi

          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "main moved before Release dispatch: $current != $SOURCE_SHA; no dispatch"
            exit 0
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$RELEASE_VERSION" \
            -f source_sha="$SOURCE_SHA" \
            -f proof_run_id="$PROOF_RUN_ID"
          echo "dispatched Release for $RELEASE_TAG from exact proven source $SOURCE_SHA"
