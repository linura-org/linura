name: Temporary v0.8 post-release gate repair

on:
  push:
    branches:
      - fix/post-release-v08-milestone-status
    paths:
      - .github/workflows/tmp-post-release-v08-gate-repair.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mint repository-scoped Release App token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add v0.8 terminal evidence mappings and real-gate regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tools/post_release_close.py")
          text = source.read_text(encoding="utf-8")
          anchor = '    "independent binary reproduction succeeds": frozenset({"reproduction"}),\n'
          additions = (
              '    "trusted release proof includes v0.8 qualification and succeeds": '
              'frozenset({"proof", "qualification"}),\n'
              '    "metadata-only release authorization preserves the reviewed implementation tree": '
              'frozenset({"authorization"}),\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one release-control mapping anchor, found {text.count(anchor)}")
          source.write_text(text.replace(anchor, additions + anchor, 1), encoding="utf-8")

          tests = Path("tests/tooling/test_post_release_close.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = '    def test_terminal_provenance_uses_full_canonical_commit_url(self) -> None:\n'
          insertion = (
              '    def test_actual_v08_release_gate_maps_all_terminal_evidence_criteria(self) -> None:\n'
              '        milestone = (ROOT / "docs/milestones/v0.8.0.md").read_text(encoding="utf-8")\n'
              '        updated = post_release_close.close_release_control_criteria(milestone, "v0.8.0")\n'
              '        gate = updated.split("## Release gate", 1)[1].split("## ", 1)[0]\n'
              '\n'
              '        self.assertNotIn("- [ ]", gate)\n'
              '        self.assertIn("- [x] Trusted Release Proof includes v0.8 qualification and succeeds;", gate)\n'
              '        self.assertIn(\n'
              '            "- [x] metadata-only release authorization preserves the reviewed implementation tree;",\n'
              '            gate,\n'
              '        )\n'
              '        self.assertIn("- [x] tag-last publication succeeds;", gate)\n'
              '        self.assertIn("- [x] independent published-release verification succeeds;", gate)\n'
              '        self.assertIn("- [x] post-release closure advances machine roadmap state", gate)\n'
              '\n'
              + marker
          )
          if test_text.count(marker) != 1:
              raise SystemExit(f"expected one test insertion marker, found {test_text.count(marker)}")
          tests.write_text(test_text.replace(marker, insertion, 1), encoding="utf-8")
          PY

          python3 -m py_compile tools/post_release_close.py tests/tooling/test_post_release_close.py
          python3 -m unittest discover -s tests/tooling -p 'test_post_release_close.py'
          git diff --check

      - name: Commit tested repair and remove bootstrap workflow
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-post-release-v08-gate-repair.yml
          app_user_id="$(gh api "users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          [[ "$app_user_id" =~ ^[0-9]+$ ]]
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/tmp-post-release-v08-gate-repair.yml\ntests/tooling/test_post_release_close.py\ntools/post_release_close.py'
          git commit -m "fix(release): map v0.8 terminal closure evidence"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
