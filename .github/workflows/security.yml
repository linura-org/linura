name: Security

run-name: '${{ github.workflow }} :: ${{ inputs.dispatch_nonce || github.sha }}'

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: Optional release-control correlation nonce
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          : "${RUST_VERSION:?}"
          : "${CARGO_AUDIT_VERSION:?}"
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'CARGO_AUDIT_VERSION=%s\n' "$CARGO_AUDIT_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - run: rustup default "$RUST_VERSION"
      - name: Restore exact cargo-audit binary cache
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/codex/versions.env') }}
      - name: Install cargo-audit on cache miss
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Verify pinned audit tool identity
        run: |
          set -euo pipefail
          audit_bin="$HOME/.cargo/bin/cargo-audit"
          test -x "$audit_bin"
          actual_version="$("$audit_bin" --version | awk '{print $2}')"
          test "$actual_version" = "$CARGO_AUDIT_VERSION"
      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          "$HOME/.cargo/bin/cargo-audit" audit
