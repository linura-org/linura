name: Security

run-name: '${{ github.workflow }} :: ${{ inputs.dispatch_nonce || github.sha }}'

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: Optional release-control correlation nonce
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          : "${RUST_VERSION:?}"
          : "${CARGO_AUDIT_VERSION:?}"
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'CARGO_AUDIT_VERSION=%s\n' "$CARGO_AUDIT_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - run: rustup default "$RUST_VERSION"
      - name: Build pinned cargo-audit from locked source
        run: |
          set -euo pipefail
          audit_bin="$HOME/.cargo/bin/cargo-audit"
          rm -f "$audit_bin"
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          test -x "$audit_bin"
          test ! -L "$audit_bin"
          audit_sha256="$(sha256sum "$audit_bin" | awk '{print $1}')"
          [[ "$audit_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'CARGO_AUDIT_SHA256=%s\n' "$audit_sha256" >> "$GITHUB_ENV"
      - name: Verify pinned audit tool identity
        run: |
          set -euo pipefail
          audit_bin="$HOME/.cargo/bin/cargo-audit"
          test -x "$audit_bin"
          test ! -L "$audit_bin"
          actual_version="$("$audit_bin" --version | awk '{print $2}')"
          test "$actual_version" = "$CARGO_AUDIT_VERSION"
          test "$(sha256sum "$audit_bin" | awk '{print $1}')" = "$CARGO_AUDIT_SHA256"
      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          "$HOME/.cargo/bin/cargo-audit" audit

      - name: Capture RustSec advisory identity
        run: |
          set -euo pipefail
          advisory_db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          test -d "$advisory_db"
          test ! -L "$advisory_db"
          test -d "$advisory_db/.git"
          test ! -L "$advisory_db/.git"
          clean_git=(/usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null)
          advisory_origin="$("${clean_git[@]}" /usr/bin/git --no-replace-objects -C "$advisory_db" config --local --get remote.origin.url)"
          case "$advisory_origin" in
            https://github.com/RustSec/advisory-db|https://github.com/RustSec/advisory-db.git) ;;
            *) printf 'unexpected RustSec advisory origin: %s\n' "$advisory_origin" >&2; exit 2 ;;
          esac
          advisory_identity="$("${clean_git[@]}" /usr/bin/git --no-replace-objects -C "$advisory_db" rev-parse HEAD)"
          [[ "$advisory_identity" =~ ^[0-9a-f]{40}$ ]]
          advisory_retrieved_at="$(/usr/bin/date -u +%Y-%m-%dT%H:%M:%SZ)"
          [[ "$advisory_retrieved_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          {
            printf 'ADVISORY_DB_IDENTITY=%s\n' "$advisory_identity"
            printf 'ADVISORY_RETRIEVED_AT=%s\n' "$advisory_retrieved_at"
          } >> "$GITHUB_ENV"

      - name: Bind qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        with:
          lane: security-rustsec
          source-sha: ${{ github.sha }}
