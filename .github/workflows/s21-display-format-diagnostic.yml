name: S21-2 formatting diagnostics
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-read-only:
    if: ${{ github.event.pull_request.number == 259 }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate exact pinned clang-format suggestions without modifying source
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv "${RUNNER_TEMP}/s21-format-env"
          "${RUNNER_TEMP}/s21-format-env/bin/pip" install --require-hashes --no-deps -r tools/source-format/clang-requirements.lock
          "${RUNNER_TEMP}/s21-format-env/bin/python" - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          fmt = os.path.join(os.environ["RUNNER_TEMP"], "s21-format-env/bin/clang-format")
          paths = ${JSON.stringify(paths)}
          for path in paths:
              before = pathlib.Path(path).read_text()
              result = subprocess.run([fmt, "-style=file", path], capture_output=True, text=True, check=True)
              if before != result.stdout:
                  print("S21_FORMAT_SUGGESTION=" + json.dumps({"path": path, "content": result.stdout}, separators=(",", ":")), flush=True)
                  print("S21_FORMAT_CHANGED=" + path, flush=True)
          PY
