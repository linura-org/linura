name: PR 134 qualification shell correction

on:
  push:
    branches:
      - fix/v0.9-black-box-qualification

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'linura-org/linura'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v0.9-black-box-qualification
          fetch-depth: 0
      - name: Apply and validate shell correction
        run: |
          set -euo pipefail
          python3 tools/pr134_fix_shell.py
          bash -n scripts/qualification/v09-adversarial-guest.sh
          python3 -m unittest tests.tooling.test_v09_adversarial_transport_contract
          git diff --check
      - name: Commit shell correction only
        run: |
          set -euo pipefail
          git add scripts/qualification/v09-adversarial-guest.sh
          git diff --cached --quiet && { echo 'no shell correction produced' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v0.9): validate black-box qualification shell boundaries'
          git push origin HEAD:fix/v0.9-black-box-qualification
