name: Reusable Trusted Release Build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact protected-main source SHA to build
        required: true
        type: string
      release_tag:
        description: Canonical v-prefixed release tag
        required: true
        type: string
      release_version:
        description: Canonical SemVer without v prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: isolated trusted build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      PYTHON_WHEEL_SOURCE_DATE_EPOCH: "315532800"
      PROOF_ROOT: /tmp/linura-release-proof
      PAYLOAD_DIR: /tmp/linura-release-proof/release-payload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          : "${RUST_VERSION:?}"
          : "${PYTHON_RELEASE:?}"
          : "${PYTHON_PIP_VERSION:?}"
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "$PYTHON_RELEASE"
          repo_rust_version="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('rust-toolchain.toml').read_text(encoding='utf-8')
          match = re.search(r'^channel\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('rust-toolchain.toml does not declare a channel')
          print(match.group(1))
          PY
          )"
          test "$repo_rust_version" = "$RUST_VERSION"
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'PYTHON_RELEASE=%s\n' "$PYTHON_RELEASE"
            printf 'PYTHON_PIP_VERSION=%s\n' "$PYTHON_PIP_VERSION"
          } >> "$GITHUB_ENV"

      - name: Assert exact immutable build source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"

      - name: Install pinned Rust build toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target "$RELEASE_TARGET"
          rustup default "$RUST_VERSION"

      - name: Establish reproducible build envelope
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          {
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
            printf 'CARGO_INCREMENTAL=0\n'
            printf 'TZ=UTC\n'
            printf 'LANG=C.UTF-8\n'
            printf 'LC_ALL=C.UTF-8\n'
            printf 'RUSTFLAGS=--remap-path-prefix=%s=/workspace\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked Python build toolchain
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r bindings/python/build-requirements.lock
          python3 - <<'PY'
          import importlib.metadata
          import os
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("bindings/python/pyproject.toml").read_text(encoding="utf-8"))
          expected = {"pip": os.environ["PYTHON_PIP_VERSION"]}
          for requirement in data["build-system"]["requires"]:
              match = re.fullmatch(r"([A-Za-z0-9_.-]+)==([A-Za-z0-9_.+-]+)", requirement)
              if match is None:
                  raise SystemExit(
                      f"Python build requirement is not exactly pinned: {requirement!r}"
                  )
              expected[match.group(1)] = match.group(2)

          for name, version in expected.items():
              actual = importlib.metadata.version(name)
              if actual != version:
                  raise SystemExit(
                      f"Python build requirement mismatch: {name} expected {version}, got {actual}"
                  )
          PY

      - name: Run canonical validation
        run: cargo xtask check

      - name: Build exact-source release binaries once
        run: cargo build --workspace --release --locked --target "$RELEASE_TARGET"

      - name: Build exact-source Python wheel
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/linura-python-wheel"
          mkdir -p "$RUNNER_TEMP/linura-python-wheel"
          SOURCE_DATE_EPOCH="$PYTHON_WHEEL_SOURCE_DATE_EPOCH" python3 -m pip wheel \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/linura-python-wheel" \
            ./bindings/python
          test "$(find "$RUNNER_TEMP/linura-python-wheel" -maxdepth 1 -type f -name 'linura-*.whl' | wc -l)" -eq 1

      - name: Assemble sealed promotable payload
        run: |
          set -euo pipefail
          rm -rf "$PROOF_ROOT"
          mkdir -p "$PAYLOAD_DIR"
          binary_root="target/$RELEASE_TARGET/release"
          mapfile -t release_binaries < <(python3 tools/check_component_maturity.py --release-binaries)
          test "${#release_binaries[@]}" -gt 0
          binary_artifacts=()
          evidence_binary_args=()
          for binary in "${release_binaries[@]}"; do
            install -m 0755 "$binary_root/$binary" "$PAYLOAD_DIR/$binary"
            binary_artifacts+=("$PAYLOAD_DIR/$binary")
            evidence_binary_args+=(--artifact "$PAYLOAD_DIR/$binary")
          done
          python_wheel="$(find "$RUNNER_TEMP/linura-python-wheel" -maxdepth 1 -type f -name 'linura-*.whl' -print -quit)"
          test -n "$python_wheel"
          install -m 0644 "$python_wheel" "$PAYLOAD_DIR/$(basename "$python_wheel")"
          python_artifact="$PAYLOAD_DIR/$(basename "$python_wheel")"
          evidence_binary_args+=(--artifact "$python_artifact")
          printf '%s\n' "$SOURCE_SHA" > "$PAYLOAD_DIR/SOURCE_SHA"
          printf '%s\n' "$RELEASE_TAG" > "$PAYLOAD_DIR/RELEASE_TAG"
          cp "docs/releases/${RELEASE_TAG}.md" "$PAYLOAD_DIR/RELEASE_NOTES.md"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess
          import tomllib

          payload = pathlib.Path(os.environ["PAYLOAD_DIR"])
          os_release = {}
          for line in pathlib.Path("/etc/os-release").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  os_release[key] = value.strip('"')
          data = {
              "schema_version": 1,
              "source_sha": os.environ["SOURCE_SHA"],
              "release_tag": os.environ["RELEASE_TAG"],
              "target": os.environ["RELEASE_TARGET"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "-V"], text=True).strip(),
              "python": subprocess.check_output(
                  ["python3", "--version"], text=True, stderr=subprocess.STDOUT
              ).strip(),
              "pip": subprocess.check_output(
                  ["python3", "-m", "pip", "--version"], text=True
              ).strip(),
              "python_build_system_requires": tomllib.loads(
                  pathlib.Path("bindings/python/pyproject.toml").read_text(encoding="utf-8")
              )["build-system"]["requires"],
              "python_build_requirements_lock_sha256": hashlib.sha256(
                  pathlib.Path("bindings/python/build-requirements.lock").read_bytes()
              ).hexdigest(),
              "python_wheel_source_date_epoch": int(
                  os.environ["PYTHON_WHEEL_SOURCE_DATE_EPOCH"]
              ),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "runner_image_os": os.environ.get("ImageOS"),
              "runner_image_version": os.environ.get("ImageVersion"),
              "kernel": platform.platform(),
              "os_release": os_release,
              "cargo_incremental": os.environ.get("CARGO_INCREMENTAL"),
              "timezone": os.environ.get("TZ"),
              "locale": os.environ.get("LC_ALL"),
              "rustflags": os.environ.get("RUSTFLAGS"),
          }
          (payload / "BUILD-ENVIRONMENT.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python3 tools/generate_sbom.py \
            "$PAYLOAD_DIR/linura.spdx.json" \
            "${binary_artifacts[@]}" \
            "$python_artifact" \
            --version "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"
          python3 tools/release_contract.py evidence \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --notes "$PAYLOAD_DIR/RELEASE_NOTES.md" \
            --output "$PAYLOAD_DIR/RELEASE-EVIDENCE.json" \
            "${evidence_binary_args[@]}" \
            --artifact "$PAYLOAD_DIR/linura.spdx.json" \
            --artifact "$PAYLOAD_DIR/BUILD-ENVIRONMENT.json" \
            --artifact "$PAYLOAD_DIR/SOURCE_SHA" \
            --artifact "$PAYLOAD_DIR/RELEASE_TAG"
          python3 tools/make_checksums.py \
            "$PAYLOAD_DIR/SHA256SUMS" \
            "${binary_artifacts[@]}" \
            "$python_artifact" \
            "$PAYLOAD_DIR/linura.spdx.json" \
            "$PAYLOAD_DIR/BUILD-ENVIRONMENT.json" \
            "$PAYLOAD_DIR/SOURCE_SHA" \
            "$PAYLOAD_DIR/RELEASE_TAG" \
            "$PAYLOAD_DIR/RELEASE_NOTES.md" \
            "$PAYLOAD_DIR/RELEASE-EVIDENCE.json"
          python3 tools/release_contract.py verify \
            --directory "$PAYLOAD_DIR" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"
          python3 tools/release_verify.py "$PAYLOAD_DIR" \
            --component-contract contracts/components.toml \
            --python-package bindings/python/pyproject.toml

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["PROOF_ROOT"])
          payload = pathlib.Path(os.environ["PAYLOAD_DIR"])
          items = []
          for path in sorted(payload.iterdir()):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"proof payload must be flat regular files: {path.name}")
              items.append({
                  "name": path.name,
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
              "workflow": "Trusted Release Proof",
              "builder_workflow": f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/reusable-release-build.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifacts": items,
          }
          (root / "release-proof.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assert source remained immutable
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

      - name: Attest sealed release payload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "/tmp/linura-release-proof/release-payload/*"

      - name: Upload exact-source proof and payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-trusted-release-proof-${{ inputs.source_sha }}
          path: /tmp/linura-release-proof/
          if-no-files-found: error
          retention-days: 30

  reproduce:
    name: independent binary reproduction
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      PYTHON_WHEEL_SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Load repository toolchain contract
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          : "${RUST_VERSION:?}"
          : "${PYTHON_RELEASE:?}"
          : "${PYTHON_PIP_VERSION:?}"
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "$PYTHON_RELEASE"
          repo_rust_version="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('rust-toolchain.toml').read_text(encoding='utf-8')
          match = re.search(r'^channel\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('rust-toolchain.toml does not declare a channel')
          print(match.group(1))
          PY
          )"
          test "$repo_rust_version" = "$RUST_VERSION"
          {
            printf 'RUST_VERSION=%s\n' "$RUST_VERSION"
            printf 'PYTHON_RELEASE=%s\n' "$PYTHON_RELEASE"
            printf 'PYTHON_PIP_VERSION=%s\n' "$PYTHON_PIP_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install pinned Rust build toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RELEASE_TARGET"
          rustup default "$RUST_VERSION"

      - name: Establish identical build envelope
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          {
            printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch"
            printf 'CARGO_INCREMENTAL=0\n'
            printf 'TZ=UTC\n'
            printf 'LANG=C.UTF-8\n'
            printf 'LC_ALL=C.UTF-8\n'
            printf 'RUSTFLAGS=--remap-path-prefix=%s=/workspace\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked Python build toolchain
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r bindings/python/build-requirements.lock
          python3 - <<'PY'
          import importlib.metadata
          import os
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("bindings/python/pyproject.toml").read_text(encoding="utf-8"))
          expected = {"pip": os.environ["PYTHON_PIP_VERSION"]}
          for requirement in data["build-system"]["requires"]:
              match = re.fullmatch(r"([A-Za-z0-9_.-]+)==([A-Za-z0-9_.+-]+)", requirement)
              if match is None:
                  raise SystemExit(
                      f"Python build requirement is not exactly pinned: {requirement!r}"
                  )
              expected[match.group(1)] = match.group(2)

          for name, version in expected.items():
              actual = importlib.metadata.version(name)
              if actual != version:
                  raise SystemExit(
                      f"Python build requirement mismatch: {name} expected {version}, got {actual}"
                  )
          PY

      - name: Rebuild exact source independently
        run: cargo build --workspace --release --locked --target "$RELEASE_TARGET"

      - name: Rebuild Python wheel independently
        run: |
          set -euo pipefail
          rm -rf reproduced-python
          mkdir -p reproduced-python
          SOURCE_DATE_EPOCH="$PYTHON_WHEEL_SOURCE_DATE_EPOCH" python3 -m pip wheel \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --no-build-isolation \
            --wheel-dir reproduced-python \
            ./bindings/python
          test "$(find reproduced-python -maxdepth 1 -type f -name 'linura-*.whl' | wc -l)" -eq 1

      - name: Download sealed proof payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-trusted-release-proof-${{ inputs.source_sha }}
          path: proven

      - name: Prove distributable binaries reproduce byte-for-byte
        run: |
          set -euo pipefail
          binary_root="target/$RELEASE_TARGET/release"
          mapfile -t release_binaries < <(python3 tools/check_component_maturity.py --release-binaries)
          test "${#release_binaries[@]}" -gt 0
          for binary in "${release_binaries[@]}"; do
            cmp "$binary_root/$binary" "proven/release-payload/$binary" || {
              sha256sum "$binary_root/$binary" "proven/release-payload/$binary" >&2
              echo "reproducibility mismatch: $binary" >&2
              exit 1
            }
          done
          reproduced_wheel="$(find reproduced-python -maxdepth 1 -type f -name 'linura-*.whl' -print -quit)"
          proven_wheel="$(find proven/release-payload -maxdepth 1 -type f -name 'linura-*.whl' -print -quit)"
          test -n "$reproduced_wheel"
          test -n "$proven_wheel"
          cmp "$reproduced_wheel" "$proven_wheel" || {
            sha256sum "$reproduced_wheel" "$proven_wheel" >&2
            echo "reproducibility mismatch: Python wheel" >&2
            exit 1
          }
