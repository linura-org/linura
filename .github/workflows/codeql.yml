name: CodeQL

run-name: '${{ github.workflow }} :: ${{ inputs.dispatch_nonce || github.sha }}'

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: Optional release-control correlation nonce
        required: false
        type: string
        default: ""
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
