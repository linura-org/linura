name: CodeQL

run-name: "${{ github.workflow }} :: ${{ github.event_name == 'pull_request' && format('PR{0} :: {1}', github.event.pull_request.number, github.sha) || (inputs.dispatch_nonce || github.sha) }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_nonce:
        description: Optional release-control correlation nonce
        required: false
        type: string
        default: ""
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository toolchain data
        id: toolchain_data
        run: |
          set -euo pipefail
          python3 -I -S tools/check_toolchain_env.py tools/codex/versions.env

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust,javascript-typescript,c-cpp,python
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Bind qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        with:
          lane: codeql
          source-sha: ${{ github.sha }}
