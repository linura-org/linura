name: Post Release Closure

run-name: Post Release Closure — ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Independently verified release tag to close
        required: true
        type: string
      verification_run_id:
        description: Exact successful Release Verification run ID
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: post-release-closure-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CODEX_BOT_USER_ID: "199175422" # chatgpt-codex-connector[bot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ github.token }}

      - name: Resolve and verify terminal release evidence
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          tag="$INPUT_TAG"
          verification_run_id="$INPUT_VERIFICATION_RUN_ID"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$verification_run_id" =~ ^[0-9]+$ ]]

          source_sha="$(git rev-list -n1 "$tag")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          verification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$verification_run_id")"
          test "$(jq -r .path <<<"$verification")" = ".github/workflows/release-verification.yml"
          test "$(jq -r .status <<<"$verification")" = "completed"
          test "$(jq -r .conclusion <<<"$verification")" = "success"
          verification_event="$(jq -r .event <<<"$verification")"
          verification_head_sha="$(jq -r .head_sha <<<"$verification")"
          verification_head_branch="$(jq -r .head_branch <<<"$verification")"

          if [[ "$verification_head_branch" == "$tag" ]]; then
            test "$verification_head_sha" = "$source_sha"
            test "$verification_event" = "workflow_dispatch"
          elif [[ "$verification_head_branch" == "verify-release/$tag" ]]; then
            test "$verification_event" = "push"
            recovery_ref="$verification_head_branch"
            git fetch origin "refs/heads/$recovery_ref:refs/remotes/origin/$recovery_ref" --force
            test "$(git rev-parse "origin/$recovery_ref")" = "$verification_head_sha"
            parent_line="$(git rev-list --parents -n1 "$verification_head_sha")"
            test "$(wc -w <<<"$parent_line")" -eq 2
            recovery_base="$(awk '{print $2}' <<<"$parent_line")"
            git merge-base --is-ancestor "$recovery_base" origin/main
            marker_path=".github/release-verification-recovery/$tag"
            changed_paths="$(git diff --name-only "$recovery_base" "$verification_head_sha")"
            test "$changed_paths" = "$marker_path"
            test "$(git rev-parse "$recovery_base:.github/workflows/release-verification.yml")" = \
              "$(git rev-parse "$verification_head_sha:.github/workflows/release-verification.yml")"
          else
            echo "verification run is not bound to exact tag or approved recovery ref: $verification_head_branch" >&2
            exit 1
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .tag_name <<<"$release")" = "$tag"
          test "$(jq -r .draft <<<"$release")" = "false"
          test "$(jq -r .immutable <<<"$release")" = "true"
          test "$(jq -r .target_commitish <<<"$release")" = "$source_sha"
          release_id="$(jq -r .id <<<"$release")"
          published_at="$(jq -r .published_at <<<"$release")"

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&event=workflow_dispatch&per_page=100")"
          select_run() {
            local path="$1"
            jq -r --arg path "$path" \
              '[.workflow_runs[] | select(.path == $path and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs"
          }
          proof_run_id="$(select_run .github/workflows/trusted-release-proof.yml)"
          promotion_run_id="$(select_run .github/workflows/release-promotion.yml)"
          release_run_id="$(select_run .github/workflows/release.yml)"
          for value in "$proof_run_id" "$promotion_run_id" "$release_run_id"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse HEAD)" = "$current_main"

          {
            printf 'tag=%s\n' "$tag"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'verification_run_id=%s\n' "$verification_run_id"
            printf 'proof_run_id=%s\n' "$proof_run_id"
            printf 'promotion_run_id=%s\n' "$promotion_run_id"
            printf 'release_run_id=%s\n' "$release_run_id"
            printf 'release_id=%s\n' "$release_id"
            printf 'published_at=%s\n' "$published_at"
            printf 'base_sha=%s\n' "$current_main"
          } >> "$GITHUB_OUTPUT"

      - name: Detect already-closed release
        id: state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          contract = tomllib.loads(pathlib.Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          milestones = {item["version"]: item for item in contract["milestone"]}
          milestone = milestones.get(tag)
          if milestone is None:
              raise SystemExit(f"release is absent from roadmap: {tag}")
          if contract.get("current_release") == tag and milestone.get("status") == "released":
              print("closed")
          elif contract.get("next_release") == tag and milestone.get("status") == "planned":
              print("pending")
          else:
              raise SystemExit(
                  f"unsafe post-release state for {tag}: current={contract.get('current_release')} "
                  f"next={contract.get('next_release')} status={milestone.get('status')}"
              )
          PY
          )"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Prove closure automation capabilities
        if: steps.state.outputs.state == 'pending'
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse HEAD)" = "$current_main"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --credential-source github

      - name: Generate deterministic closure tree
        if: steps.state.outputs.state == 'pending'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PROOF_RUN_ID: ${{ steps.release.outputs.proof_run_id }}
          PROMOTION_RUN_ID: ${{ steps.release.outputs.promotion_run_id }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          frozen="docs/releases/$RELEASE_TAG.md"
          frozen_before="$(sha256sum "$frozen" | awk '{print $1}')"

          common=(
            --tag "$RELEASE_TAG"
            --source-sha "$SOURCE_SHA"
            --proof-run-id "$PROOF_RUN_ID"
            --promotion-run-id "$PROMOTION_RUN_ID"
            --release-run-id "$RELEASE_RUN_ID"
            --release-id "$RELEASE_ID"
            --verification-run-id "$VERIFICATION_RUN_ID"
            --published-at "$PUBLISHED_AT"
          )
          python3 tools/post_release_close.py "${common[@]}"
          python3 tools/post_release_terminal_sync.py "${common[@]}"
          python3 tools/check_roadmap.py .
          python3 tools/check_machine_classes.py .
          git diff --check

          test "$(sha256sum "$frozen" | awk '{print $1}')" = "$frozen_before"
          test -z "$(git diff --name-only -- "$frozen")"
          mapfile -t release_doc_changes < <(git diff --name-only -- docs/releases/)
          for path in "${release_doc_changes[@]}"; do
            case "$path" in
              docs/releases/README.md|"docs/releases/published-$RELEASE_TAG.md") ;;
              *) echo "unexpected post-release mutation under docs/releases: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit or re-prove deterministic closure commit
        if: steps.state.outputs.state == 'pending'
        id: commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          branch="automation/post-release-${RELEASE_TAG}-${VERIFICATION_RUN_ID}"
          title="chore: close $RELEASE_TAG release state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          test -n "$(git diff --cached --name-only)"
          expected_tree="$(git write-tree)"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]

          if branch_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" 2>/dev/null)"; then
            head_sha="$(jq -r .object.sha <<<"$branch_payload")"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --force
            test "$(git rev-parse "origin/$branch")" = "$head_sha"

            candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha")"
            test "$(jq '.parents | length' <<<"$candidate")" = "1"
            test "$(jq -r '.parents[0].sha' <<<"$candidate")" = "$BASE_SHA"
            test "$(jq -r .tree.sha <<<"$candidate")" = "$expected_tree"
            test "$(jq -r '.message | split("\n")[0]' <<<"$candidate")" = "$title"
            echo "reusing exact deterministic closure branch $branch at $head_sha"
          else
            git switch -c "$branch"
            git commit -m "$title"
            head_sha="$(git rev-parse HEAD)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$expected_tree"
            git push --set-upstream origin "$branch"
          fi

          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Open or re-prove protected closure PR
        if: steps.state.outputs.state == 'pending'
        id: pr
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
        run: |
          set -euo pipefail
          title="chore: close $RELEASE_TAG release state"
          existing="$(gh pr list --state open --base main --head "$BRANCH" --limit 10 --json number,title,headRefName,headRefOid,baseRefName)"
          count="$(jq 'length' <<<"$existing")"

          if [[ "$count" == "1" ]]; then
            number="$(jq -r '.[0].number' <<<"$existing")"
            test "$(jq -r '.[0].title' <<<"$existing")" = "$title"
            test "$(jq -r '.[0].headRefName' <<<"$existing")" = "$BRANCH"
            test "$(jq -r '.[0].headRefOid' <<<"$existing")" = "$HEAD_SHA"
            test "$(jq -r '.[0].baseRefName' <<<"$existing")" = "main"
            echo "reusing exact open closure PR #$number"
          elif [[ "$count" == "0" ]]; then
            {
              printf 'Automatic terminal bookkeeping for independently verified %s.\n\n' "$RELEASE_TAG"
              printf '%s\n' "- generated only after successful Release Verification run \`$VERIFICATION_RUN_ID\`;"
              printf '%s\n' "- exact closure head: \`$HEAD_SHA\`;"
              printf '%s\n' "- synchronizes roadmap, terminal qualification and current-release documentation;"
              printf '%s\n' "- leaves the frozen release contract and immutable release assets untouched;"
              printf '%s\n' "- merges only after explicit exact-head CI/Security/CodeQL, a completed clean Codex review, and zero unresolved review threads."
            } > "$RUNNER_TEMP/body.md"
            url="$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            number="${url##*/}"
          else
            echo "multiple open closure PRs unexpectedly match $BRANCH" >&2
            exit 1
          fi

          [[ "$number" =~ ^[0-9]+$ ]]
          pr="$(gh pr view "$number" --json state,title,baseRefName,headRefName,headRefOid)"
          test "$(jq -r .state <<<"$pr")" = "OPEN"
          test "$(jq -r .title <<<"$pr")" = "$title"
          test "$(jq -r .baseRefName <<<"$pr")" = "main"
          test "$(jq -r .headRefName <<<"$pr")" = "$BRANCH"
          test "$(jq -r .headRefOid <<<"$pr")" = "$HEAD_SHA"
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"

      - name: Dispatch and require exact-head closure checks
        if: steps.state.outputs.state == 'pending'
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/post-release-closure-head-runs.jsonl"
          rm -f "$evidence"
          for workflow in ci.yml security.yml codeql.yml; do
            python3 tools/release_workflow_dispatch.py dispatch \
              --repository "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --ref "$BRANCH" \
              --head-sha "$HEAD_SHA" \
              --phase "post-release-closure-head" \
              --evidence-file "$evidence"
          done
          python3 tools/release_workflow_dispatch.py wait \
            --evidence-file "$evidence" \
            --expected-count 3 \
            --timeout-seconds 1800

      - name: Request exact-head Codex review
        if: steps.state.outputs.state == 'pending'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="@codex review

          Please review exact post-release closure head \`$HEAD_SHA\` for $RELEASE_TAG. Verify terminal documentation consistency, frozen-contract immutability, review-safe release automation, and that no authority or claim boundary is widened. Report every issue before automatic merge." >/dev/null

      - name: Require explicit exact-head checks and completed clean Codex review
        if: steps.state.outputs.state == 'pending'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          review_ready=0

          count_unresolved_threads() {
            # shellcheck disable=SC2016
            gh api graphql --paginate \
              -f owner="${GITHUB_REPOSITORY%/*}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$PR_NUMBER" \
              -F endCursor=null \
              -f query='
                query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      reviewThreads(first:100, after:$endCursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' |
              awk '{ total += $1 } END { print total + 0 }'
          }

          has_exact_codex_review() {
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
              --jq '.[]' |
              jq -s -r --arg sha "$HEAD_SHA" --argjson bot_id "$CODEX_BOT_USER_ID" '
                any(.[]; .user.id == $bot_id and .commit_id == $sha)
              '
          }

          has_clean_codex_comment() {
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[]' |
              jq -s -r --arg sha "$HEAD_SHA" --argjson bot_id "$CODEX_BOT_USER_ID" '
                any(.[];
                  .user.id == $bot_id and
                  ((.body // "") | contains("Codex Review: Didn")) and
                  ((.body // "") | contains("major issues")) and
                  (
                    ((.body // "") | try capture("\\*\\*Reviewed commit:\\*\\* `(?<prefix>[0-9a-f]{10,40})`").prefix catch "") as $prefix
                    | ($prefix | length) >= 10 and ($sha | startswith($prefix))
                  )
                )
              '
          }

          for _ in $(seq 1 360); do
            test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "${{ steps.release.outputs.base_sha }}"

            python3 tools/release_workflow_dispatch.py verify \
              --evidence-file "$RUNNER_TEMP/post-release-closure-head-runs.jsonl" \
              --expected-count 3

            unresolved="$(count_unresolved_threads)"
            exact_codex_review="$(has_exact_codex_review)"
            codex_clean_comment="$(has_clean_codex_comment)"

            if [[ "$unresolved" == "0" && ( "$exact_codex_review" == "true" || "$codex_clean_comment" == "true" ) ]]; then
              review_ready=1
            else
              review_ready=0
            fi

            if [[ "$review_ready" -eq 1 ]]; then
              exit 0
            fi
            sleep 10
          done

          echo "closure checks/review did not reach a clean terminal state" >&2
          exit 1

      - name: Re-prove and squash merge exact reviewed closure
        if: steps.state.outputs.state == 'pending'
        id: merge
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/release_workflow_dispatch.py verify --evidence-file "$RUNNER_TEMP/post-release-closure-head-runs.jsonl" --expected-count 3

          count_unresolved_threads() {
            # shellcheck disable=SC2016
            gh api graphql --paginate \
              -f owner="${GITHUB_REPOSITORY%/*}" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$PR_NUMBER" \
              -F endCursor=null \
              -f query='
                query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      reviewThreads(first:100, after:$endCursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' |
              awk '{ total += $1 } END { print total + 0 }'
          }

          has_exact_codex_review() {
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
              --jq '.[]' |
              jq -s -r --arg sha "$HEAD_SHA" --argjson bot_id "$CODEX_BOT_USER_ID" '
                any(.[]; .user.id == $bot_id and .commit_id == $sha)
              '
          }

          has_clean_codex_comment() {
            gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[]' |
              jq -s -r --arg sha "$HEAD_SHA" --argjson bot_id "$CODEX_BOT_USER_ID" '
                any(.[];
                  .user.id == $bot_id and
                  ((.body // "") | contains("Codex Review: Didn")) and
                  ((.body // "") | contains("major issues")) and
                  (
                    ((.body // "") | try capture("\\*\\*Reviewed commit:\\*\\* `(?<prefix>[0-9a-f]{10,40})`").prefix catch "") as $prefix
                    | ($prefix | length) >= 10 and ($sha | startswith($prefix))
                  )
                )
              '
          }

          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          pr="$(gh pr view "$PR_NUMBER" --json state,baseRefName,headRefName,headRefOid)"
          test "$(jq -r .state <<<"$pr")" = "OPEN"
          test "$(jq -r .baseRefName <<<"$pr")" = "main"
          test "$(jq -r .headRefName <<<"$pr")" = "$BRANCH"
          test "$(jq -r .headRefOid <<<"$pr")" = "$HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD_SHA"

          # Discussion/review state can change without moving the head. Re-prove it
          # immediately before the merge API call instead of trusting the earlier poll.
          unresolved="$(count_unresolved_threads)"
          test "$unresolved" = "0"

          exact_codex_review="$(has_exact_codex_review)"
          codex_clean_comment="$(has_clean_codex_comment)"
          if [[ "$exact_codex_review" != "true" && "$codex_clean_comment" != "true" ]]; then
            echo "exact-head Codex review is no longer proven immediately before merge" >&2
            exit 1
          fi

          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="chore: close $RELEASE_TAG release state" \
            -f commit_message="Terminal bookkeeping for independently verified $RELEASE_TAG after exact-head checks and Codex review.")"
          test "$(jq -r .merged <<<"$result")" = "true"
          main_sha="$(jq -r .sha <<<"$result")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$main_sha"
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve post-closure protected-main SHA
        id: final_main
        env:
          STATE: ${{ steps.state.outputs.state }}
          MERGED_MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$STATE" == "pending" ]]; then
            test "$main_sha" = "$MERGED_MAIN_SHA"
          fi
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch and require explicit fresh-main CI, Security and CodeQL
        env:
          MAIN_SHA: ${{ steps.final_main.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA"
          set -euo pipefail
          evidence="$RUNNER_TEMP/post-release-closure-main-runs.jsonl"
          rm -f "$evidence"
          for workflow in ci.yml security.yml codeql.yml; do
            python3 tools/release_workflow_dispatch.py dispatch \
              --repository "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --ref "main" \
              --head-sha "$MAIN_SHA" \
              --phase "post-release-closure-main" \
              --evidence-file "$evidence"
          done
          python3 tools/release_workflow_dispatch.py wait \
            --evidence-file "$evidence" \
            --expected-count 3 \
            --timeout-seconds 1800
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA"

      - name: Delete obsolete release-scoped branches
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/branches.txt"
          python3 - "$RELEASE_TAG" "$RUNNER_TEMP/branches.txt" "$RUNNER_TEMP/candidates.txt" <<'PY'
          import pathlib
          import re
          import sys

          tag, branches_path, output = sys.argv[1:]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if match is None:
              raise SystemExit("invalid release tag")
          release_owned = (
              re.compile(rf"automation/release-prep-{re.escape(tag)}-[0-9a-f]{{12}}"),
              re.compile(rf"automation/release-authorization-{re.escape(tag)}-[0-9a-f]{{12}}"),
              re.compile(rf"automation/post-release-{re.escape(tag)}-[0-9]+"),
              re.compile(rf"verify-release/{re.escape(tag)}"),
          )
          selected = []
          for raw in pathlib.Path(branches_path).read_text(encoding="utf-8").splitlines():
              branch = raw.strip()
              if branch == "tmp/zero-diff-authorization-probe" or any(pattern.fullmatch(branch) for pattern in release_owned):
                  selected.append(branch)
          pathlib.Path(output).write_text("".join(f"{branch}\n" for branch in sorted(set(selected))), encoding="utf-8")
          PY

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue

            open_pr_count="$(
              gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                -f state=open \
                -f head="${GITHUB_REPOSITORY%/*}:$branch" \
                -f per_page=100 \
                --jq 'length' |
                awk '{ total += $1 } END { print total + 0 }'
            )"
            if [[ "$open_pr_count" -gt 0 ]]; then
              echo "preserving branch used by an open PR: $branch"
              continue
            fi

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "deleted obsolete release branch: $branch"
            fi
          done < "$RUNNER_TEMP/candidates.txt"
