name: Post Release Closure

run-name: Post Release Closure — ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Independently verified release tag to close
        required: true
        type: string
      verification_run_id:
        description: Exact successful Release Verification run ID
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: post-release-closure-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require dedicated release automation credential
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required so post-release PR creation, review checks and protected merge emit native GitHub events" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Resolve and verify terminal release evidence
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          tag="$INPUT_TAG"
          verification_run_id="$INPUT_VERIFICATION_RUN_ID"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$verification_run_id" =~ ^[0-9]+$ ]]

          source_sha="$(git rev-list -n1 "$tag")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          verification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$verification_run_id")"
          test "$(jq -r .path <<<"$verification")" = ".github/workflows/release-verification.yml"
          test "$(jq -r .status <<<"$verification")" = "completed"
          test "$(jq -r .conclusion <<<"$verification")" = "success"
          verification_event="$(jq -r .event <<<"$verification")"
          verification_head_sha="$(jq -r .head_sha <<<"$verification")"
          verification_head_branch="$(jq -r .head_branch <<<"$verification")"

          if [[ "$verification_head_branch" == "$tag" ]]; then
            test "$verification_head_sha" = "$source_sha"
            test "$verification_event" = "workflow_dispatch"
          elif [[ "$verification_head_branch" == "verify-release/$tag" ]]; then
            test "$verification_event" = "push"
            recovery_ref="$verification_head_branch"
            git fetch origin "refs/heads/$recovery_ref:refs/remotes/origin/$recovery_ref" --force
            test "$(git rev-parse "origin/$recovery_ref")" = "$verification_head_sha"
            parent_line="$(git rev-list --parents -n1 "$verification_head_sha")"
            test "$(wc -w <<<"$parent_line")" -eq 2
            recovery_base="$(awk '{print $2}' <<<"$parent_line")"
            git merge-base --is-ancestor "$recovery_base" origin/main
            marker_path=".github/release-verification-recovery/$tag"
            changed_paths="$(git diff --name-only "$recovery_base" "$verification_head_sha")"
            test "$changed_paths" = "$marker_path"
            test "$(git rev-parse "$recovery_base:.github/workflows/release-verification.yml")" = \
              "$(git rev-parse "$verification_head_sha:.github/workflows/release-verification.yml")"
          else
            echo "verification run is not bound to exact tag or approved recovery ref: $verification_head_branch" >&2
            exit 1
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .tag_name <<<"$release")" = "$tag"
          test "$(jq -r .draft <<<"$release")" = "false"
          test "$(jq -r .immutable <<<"$release")" = "true"
          test "$(jq -r .target_commitish <<<"$release")" = "$source_sha"
          release_id="$(jq -r .id <<<"$release")"
          published_at="$(jq -r .published_at <<<"$release")"

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&event=workflow_dispatch&per_page=100")"
          select_run() {
            local path="$1"
            jq -r --arg path "$path" \
              '[.workflow_runs[] | select(.path == $path and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs"
          }
          proof_run_id="$(select_run .github/workflows/trusted-release-proof.yml)"
          promotion_run_id="$(select_run .github/workflows/release-promotion.yml)"
          release_run_id="$(select_run .github/workflows/release.yml)"
          for value in "$proof_run_id" "$promotion_run_id" "$release_run_id"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse HEAD)" = "$current_main"

          {
            printf 'tag=%s\n' "$tag"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'verification_run_id=%s\n' "$verification_run_id"
            printf 'proof_run_id=%s\n' "$proof_run_id"
            printf 'promotion_run_id=%s\n' "$promotion_run_id"
            printf 'release_run_id=%s\n' "$release_run_id"
            printf 'release_id=%s\n' "$release_id"
            printf 'published_at=%s\n' "$published_at"
            printf 'base_sha=%s\n' "$current_main"
          } >> "$GITHUB_OUTPUT"

      - name: Detect already-closed release
        id: state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          contract = tomllib.loads(pathlib.Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          milestones = {item["version"]: item for item in contract["milestone"]}
          milestone = milestones.get(tag)
          if milestone is None:
              raise SystemExit(f"release is absent from roadmap: {tag}")
          if contract.get("current_release") == tag and milestone.get("status") == "released":
              print("closed")
          elif contract.get("next_release") == tag and milestone.get("status") == "planned":
              print("pending")
          else:
              raise SystemExit(
                  f"unsafe post-release state for {tag}: current={contract.get('current_release')} "
                  f"next={contract.get('next_release')} status={milestone.get('status')}"
              )
          PY
          )"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Prove closure automation capabilities
        if: steps.state.outputs.state == 'pending'
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse HEAD)" = "$current_main"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --credential-source dedicated

      - name: Generate deterministic closure tree
        if: steps.state.outputs.state == 'pending'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PROOF_RUN_ID: ${{ steps.release.outputs.proof_run_id }}
          PROMOTION_RUN_ID: ${{ steps.release.outputs.promotion_run_id }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          frozen="docs/releases/$RELEASE_TAG.md"
          frozen_before="$(sha256sum "$frozen" | awk '{print $1}')"

          common=(
            --tag "$RELEASE_TAG"
            --source-sha "$SOURCE_SHA"
            --proof-run-id "$PROOF_RUN_ID"
            --promotion-run-id "$PROMOTION_RUN_ID"
            --release-run-id "$RELEASE_RUN_ID"
            --release-id "$RELEASE_ID"
            --verification-run-id "$VERIFICATION_RUN_ID"
            --published-at "$PUBLISHED_AT"
          )
          python3 tools/post_release_close.py "${common[@]}"
          python3 tools/post_release_terminal_sync.py "${common[@]}"
          python3 tools/check_roadmap.py .
          python3 tools/check_machine_classes.py .
          git diff --check

          test "$(sha256sum "$frozen" | awk '{print $1}')" = "$frozen_before"
          test -z "$(git diff --name-only -- "$frozen")"
          mapfile -t release_doc_changes < <(git diff --name-only -- docs/releases/)
          for path in "${release_doc_changes[@]}"; do
            case "$path" in
              docs/releases/README.md|"docs/releases/published-$RELEASE_TAG.md") ;;
              *) echo "unexpected post-release mutation under docs/releases: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit and push one closure commit
        if: steps.state.outputs.state == 'pending'
        id: commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          branch="automation/post-release-${RELEASE_TAG}-${VERIFICATION_RUN_ID}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "closure branch already exists: $branch" >&2
            exit 1
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore: close $RELEASE_TAG release state"
          head_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "$branch"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Open protected closure PR
        if: steps.state.outputs.state == 'pending'
        id: pr
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Automatic terminal bookkeeping for independently verified $RELEASE_TAG.

          - generated only after successful Release Verification run \`$VERIFICATION_RUN_ID\`;
          - exact closure head: \`$HEAD_SHA\`;
          - synchronizes roadmap, terminal qualification and current-release documentation;
          - leaves the frozen release contract and immutable release assets untouched;
          - merges only after native exact-head CI/Security/CodeQL, a completed clean Codex review, and zero unresolved review threads.
          EOF
          url="$(gh pr create --base main --head "$BRANCH" --title "chore: close $RELEASE_TAG release state" --body-file "$RUNNER_TEMP/body.md")"
          number="${url##*/}"
          [[ "$number" =~ ^[0-9]+$ ]]
          test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"

      - name: Request exact-head Codex review
        if: steps.state.outputs.state == 'pending'
        id: review_request
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="@codex review

          Please review exact post-release closure head \`$HEAD_SHA\` for $RELEASE_TAG. Verify terminal documentation consistency, frozen-contract immutability, review-safe release automation, and that no authority or claim boundary is widened. Report every issue before automatic merge.")"
          comment_id="$(jq -r .id <<<"$payload")"
          [[ "$comment_id" =~ ^[0-9]+$ ]]
          printf 'comment_id=%s\n' "$comment_id" >> "$GITHUB_OUTPUT"

      - name: Require native exact-head checks and completed clean Codex review
        if: steps.state.outputs.state == 'pending'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          REVIEW_COMMENT_ID: ${{ steps.review_request.outputs.comment_id }}
        run: |
          set -euo pipefail
          checks_ready=0
          review_ready=0

          for _ in $(seq 1 360); do
            test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "${{ steps.release.outputs.base_sha }}"

            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
            checks_ready=1
            for workflow in CI Security CodeQL; do
              state="$(jq -r --arg workflow "$workflow" --arg sha "$HEAD_SHA" '
                [.workflow_runs[] | select(.name == $workflow and .head_sha == $sha and .event == "pull_request")]
                | if any(.[]; .status == "completed" and .conclusion == "success") then "success"
                  elif any(.[]; .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure" or .conclusion == "stale")) then "failed"
                  elif length == 0 then "missing"
                  else "active" end
              ' <<<"$runs")"
              case "$state" in
                success) ;;
                failed) echo "$workflow failed for native exact closure head $HEAD_SHA" >&2; exit 1 ;;
                *) checks_ready=0 ;;
              esac
            done

            # shellcheck disable=SC2016
            unresolved="$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" -f query='
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100) { nodes { isResolved } }
                  }
                }
              }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"

            reviews="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")"
            exact_codex_review="$(jq -r --arg sha "$HEAD_SHA" '
              any(.[]; (.user.login | startswith("chatgpt-codex-connector")) and .commit_id == $sha)
            ' <<<"$reviews")"
            reactions="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/issues/comments/$REVIEW_COMMENT_ID/reactions")"
            codex_clean_reaction="$(jq -r '
              any(.[]; (.user.login | startswith("chatgpt-codex-connector")) and .content == "+1")
            ' <<<"$reactions")"

            if [[ "$unresolved" == "0" && ( "$exact_codex_review" == "true" || "$codex_clean_reaction" == "true" ) ]]; then
              review_ready=1
            else
              review_ready=0
            fi

            if [[ "$checks_ready" -eq 1 && "$review_ready" -eq 1 ]]; then
              exit 0
            fi
            sleep 10
          done

          echo "native closure checks/review did not reach a clean terminal state" >&2
          exit 1

      - name: Re-prove and squash merge exact reviewed closure
        if: steps.state.outputs.state == 'pending'
        id: merge
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD_SHA"

          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="chore: close $RELEASE_TAG release state" \
            -f commit_message="Terminal bookkeeping for independently verified $RELEASE_TAG after exact-head checks and Codex review.")"
          test "$(jq -r .merged <<<"$result")" = "true"
          main_sha="$(jq -r .sha <<<"$result")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$main_sha"
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Require native fresh-main CI, Security and CodeQL
        if: steps.state.outputs.state == 'pending'
        env:
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&event=push&per_page=100")"
            ready=0
            for workflow in CI Security CodeQL; do
              state="$(jq -r --arg workflow "$workflow" --arg sha "$MAIN_SHA" '
                [.workflow_runs[] | select(.name == $workflow and .head_sha == $sha and .event == "push")]
                | if any(.[]; .status == "completed" and .conclusion == "success") then "success"
                  elif any(.[]; .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure" or .conclusion == "stale")) then "failed"
                  elif length == 0 then "missing"
                  else "active" end
              ' <<<"$runs")"
              case "$state" in
                success) ready=$((ready + 1)) ;;
                failed) echo "$workflow failed for fresh main $MAIN_SHA" >&2; exit 1 ;;
                *) ;;
              esac
            done
            if [[ "$ready" -eq 3 ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "fresh-main closure gates did not complete for $MAIN_SHA" >&2
          exit 1

      - name: Delete obsolete release-scoped branches
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          open_heads="$(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/branches.txt"
          python3 - "$RELEASE_TAG" "$RUNNER_TEMP/branches.txt" "$RUNNER_TEMP/candidates.txt" <<'PY'
          import pathlib
          import re
          import sys

          tag, branches_path, output = sys.argv[1:]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if match is None:
              raise SystemExit("invalid release tag")
          major, minor, _patch = match.groups()
          tokens = (f"v{major}.{minor}", f"v{major}-{minor}", f"v{major}_{minor}", f"v{major}{minor}")
          prefixes = ("tmp/", "work/", "chore/", "automation/", "verify-release/")
          selected = []
          for raw in pathlib.Path(branches_path).read_text(encoding="utf-8").splitlines():
              branch = raw.strip()
              if not branch.startswith(prefixes):
                  continue
              lower = branch.lower()
              if any(re.search(rf"(?<![a-z0-9]){re.escape(token)}(?![0-9])", lower) for token in tokens):
                  selected.append(branch)
          pathlib.Path(output).write_text("".join(f"{branch}\n" for branch in sorted(set(selected))), encoding="utf-8")
          PY

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            if grep -Fxq "$branch" <<<"$open_heads"; then
              echo "preserving branch used by an open PR: $branch"
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "deleted obsolete release branch: $branch"
            fi
          done < "$RUNNER_TEMP/candidates.txt"
