name: Post Release Closure

run-name: Post Release Closure — ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Independently verified release tag to close
        required: true
        type: string
      verification_run_id:
        description: Exact successful Release Verification run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: post-release-closure-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      state: ${{ steps.state.outputs.state }}
      main_sha: ${{ steps.merge.outputs.main_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Resolve and verify terminal release evidence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          tag="$INPUT_TAG"
          verification_run_id="$INPUT_VERIFICATION_RUN_ID"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$verification_run_id" =~ ^[0-9]+$ ]]

          source_sha="$(git rev-list -n1 "$tag")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          verification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$verification_run_id")"
          test "$(jq -r .path <<<"$verification")" = ".github/workflows/release-verification.yml"
          test "$(jq -r .status <<<"$verification")" = "completed"
          test "$(jq -r .conclusion <<<"$verification")" = "success"
          verification_event="$(jq -r .event <<<"$verification")"
          verification_head_sha="$(jq -r .head_sha <<<"$verification")"
          verification_head_branch="$(jq -r .head_branch <<<"$verification")"

          if [[ "$verification_head_branch" == "$tag" ]]; then
            test "$verification_head_sha" = "$source_sha"
            test "$verification_event" = "workflow_dispatch"
          elif [[ "$verification_head_branch" == "verify-release/$tag" ]]; then
            test "$verification_event" = "push"
            recovery_ref="$verification_head_branch"
            git fetch origin "refs/heads/$recovery_ref:refs/remotes/origin/$recovery_ref" --force
            test "$(git rev-parse "origin/$recovery_ref")" = "$verification_head_sha"
            parent_line="$(git rev-list --parents -n1 "$verification_head_sha")"
            test "$(wc -w <<<"$parent_line")" -eq 2
            recovery_base="$(awk '{print $2}' <<<"$parent_line")"
            git merge-base --is-ancestor "$recovery_base" origin/main
            marker_path=".github/release-verification-recovery/$tag"
            changed_paths="$(git diff --name-only "$recovery_base" "$verification_head_sha")"
            test "$changed_paths" = "$marker_path"
            test "$(git rev-parse "$recovery_base:.github/workflows/release-verification.yml")" = \
              "$(git rev-parse "$verification_head_sha:.github/workflows/release-verification.yml")"
          else
            echo "verification run is not bound to exact tag or approved recovery ref: $verification_head_branch" >&2
            exit 1
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .tag_name <<<"$release")" = "$tag"
          test "$(jq -r .draft <<<"$release")" = "false"
          test "$(jq -r .immutable <<<"$release")" = "true"
          test "$(jq -r .target_commitish <<<"$release")" = "$source_sha"
          release_id="$(jq -r .id <<<"$release")"
          published_at="$(jq -r .published_at <<<"$release")"

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&event=workflow_dispatch&per_page=100")"
          select_run() {
            local path="$1"
            jq -r --arg path "$path" \
              '[.workflow_runs[] | select(.path == $path and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs"
          }
          proof_run_id="$(select_run .github/workflows/trusted-release-proof.yml)"
          promotion_run_id="$(select_run .github/workflows/release-promotion.yml)"
          release_run_id="$(select_run .github/workflows/release.yml)"
          for value in "$proof_run_id" "$promotion_run_id" "$release_run_id"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$(git rev-parse HEAD)" = "$current_main"

          {
            printf 'tag=%s\n' "$tag"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'verification_run_id=%s\n' "$verification_run_id"
            printf 'proof_run_id=%s\n' "$proof_run_id"
            printf 'promotion_run_id=%s\n' "$promotion_run_id"
            printf 'release_run_id=%s\n' "$release_run_id"
            printf 'release_id=%s\n' "$release_id"
            printf 'published_at=%s\n' "$published_at"
            printf 'base_sha=%s\n' "$current_main"
          } >> "$GITHUB_OUTPUT"

      - name: Detect already-closed release
        id: state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          contract = tomllib.loads(pathlib.Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          milestones = {item["version"]: item for item in contract["milestone"]}
          milestone = milestones.get(tag)
          if milestone is None:
              raise SystemExit(f"release is absent from roadmap: {tag}")
          if contract.get("current_release") == tag and milestone.get("status") == "released":
              print("closed")
          elif contract.get("next_release") == tag and milestone.get("status") == "planned":
              print("pending")
          else:
              raise SystemExit(
                  f"unsafe post-release state for {tag}: current={contract.get('current_release')} "
                  f"next={contract.get('next_release')} status={milestone.get('status')}"
              )
          PY
          )"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic closure tree
        if: steps.state.outputs.state == 'pending'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PROOF_RUN_ID: ${{ steps.release.outputs.proof_run_id }}
          PROMOTION_RUN_ID: ${{ steps.release.outputs.promotion_run_id }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          frozen="docs/releases/$RELEASE_TAG.md"
          frozen_before="$(sha256sum "$frozen" | awk '{print $1}')"
          common=(
            --tag "$RELEASE_TAG"
            --source-sha "$SOURCE_SHA"
            --proof-run-id "$PROOF_RUN_ID"
            --promotion-run-id "$PROMOTION_RUN_ID"
            --release-run-id "$RELEASE_RUN_ID"
            --release-id "$RELEASE_ID"
            --verification-run-id "$VERIFICATION_RUN_ID"
            --published-at "$PUBLISHED_AT"
          )
          python3 tools/post_release_close.py "${common[@]}"
          python3 tools/post_release_terminal_sync.py "${common[@]}"
          python3 tools/check_roadmap.py .
          python3 tools/check_machine_classes.py .
          git diff --check
          test "$(sha256sum "$frozen" | awk '{print $1}')" = "$frozen_before"
          test -z "$(git diff --name-only -- "$frozen")"
          mapfile -t release_doc_changes < <(git diff --name-only -- docs/releases/)
          for path in "${release_doc_changes[@]}"; do
            case "$path" in
              docs/releases/README.md|"docs/releases/published-$RELEASE_TAG.md") ;;
              *) echo "unexpected post-release mutation under docs/releases: $path" >&2; exit 1 ;;
            esac
          done

      - name: Require dedicated Release App configuration
        if: steps.state.outputs.state == 'pending'
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APP_CLIENT_ID" || { echo "missing repository variable LINURA_RELEASE_APP_CLIENT_ID" >&2; exit 2; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo "missing repository secret LINURA_RELEASE_APP_PRIVATE_KEY" >&2; exit 2; }

      - name: Mint repository-scoped Release App token
        if: steps.state.outputs.state == 'pending'
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Prove Release App closure authority
        if: steps.state.outputs.state == 'pending'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --base main \
            --head main \
            --credential-source github-app

      - name: Commit or re-prove deterministic closure commit
        if: steps.state.outputs.state == 'pending'
        id: commit
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          branch="automation/post-release-${RELEASE_TAG}-${VERIFICATION_RUN_ID}"
          title="chore: close $RELEASE_TAG release state"
          git add --all
          test -n "$(git diff --cached --name-only)"
          expected_tree="$(git write-tree)"
          [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]

          if branch_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" 2>/dev/null)"; then
            head_sha="$(jq -r .object.sha <<<"$branch_payload")"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --force
            test "$(git rev-parse "origin/$branch")" = "$head_sha"
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha")"
            test "$(jq '.parents | length' <<<"$candidate")" = "1"
            test "$(jq -r '.parents[0].sha' <<<"$candidate")" = "$BASE_SHA"
            test "$(jq -r .tree.sha <<<"$candidate")" = "$expected_tree"
            test "$(jq -r '.message | split("\n")[0]' <<<"$candidate")" = "$title"
          else
            git switch -c "$branch"
            app_user_id="$(gh api "users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
            [[ "$app_user_id" =~ ^[0-9]+$ ]]
            git config user.name "${RELEASE_APP_SLUG}[bot]"
            git config user.email "${app_user_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
            git commit -m "$title"
            head_sha="$(git rev-parse HEAD)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$expected_tree"
            gh auth setup-git
            git push --set-upstream origin "$branch"
          fi

          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Open or re-prove protected closure PR
        if: steps.state.outputs.state == 'pending'
        id: pr
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          VERIFICATION_RUN_ID: ${{ steps.release.outputs.verification_run_id }}
        run: |
          set -euo pipefail
          title="chore: close $RELEASE_TAG release state"
          existing="$(gh pr list --state open --base main --head "$BRANCH" --limit 10 --json number,title,headRefName,headRefOid,baseRefName)"
          count="$(jq 'length' <<<"$existing")"
          if [[ "$count" == "1" ]]; then
            number="$(jq -r '.[0].number' <<<"$existing")"
            test "$(jq -r '.[0].title' <<<"$existing")" = "$title"
            test "$(jq -r '.[0].headRefName' <<<"$existing")" = "$BRANCH"
            test "$(jq -r '.[0].headRefOid' <<<"$existing")" = "$HEAD_SHA"
            test "$(jq -r '.[0].baseRefName' <<<"$existing")" = "main"
          elif [[ "$count" == "0" ]]; then
            {
              printf 'Automatic terminal bookkeeping for independently verified %s.\n\n' "$RELEASE_TAG"
              printf '%s\n' "- generated only after successful Release Verification run \`$VERIFICATION_RUN_ID\`;"
              printf '%s\n' "- exact closure head: \`$HEAD_SHA\`;"
              printf '%s\n' "- leaves the frozen release contract and immutable release assets untouched;"
              printf '%s\n' "- native PR CI/Security/CodeQL are the ruleset-authoritative gates;"
              printf '%s\n' "- terminal branch cleanup is a separate event-driven transaction after native main push gates."
            } > "$RUNNER_TEMP/body.md"
            url="$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            number="${url##*/}"
          else
            echo "multiple open closure PRs unexpectedly match $BRANCH" >&2
            exit 1
          fi
          [[ "$number" =~ ^[0-9]+$ ]]
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"

      - name: Require GitHub-native closure PR gates and clean ruleset state
        if: steps.state.outputs.state == 'pending'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 1800 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --expected-changed-files "$(gh pr view "$PR_NUMBER" --json changedFiles --jq .changedFiles)"

      - name: Re-prove and squash merge exact deterministic closure
        if: steps.state.outputs.state == 'pending'
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          changed_files="$(gh pr view "$PR_NUMBER" --json changedFiles --jq .changedFiles)"
          [[ "$changed_files" =~ ^[1-9][0-9]*$ ]]
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 0 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --expected-changed-files "$changed_files"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD_SHA"

          candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA")"
          test "$(jq '.parents | length' <<<"$candidate")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$candidate")" = "$BASE_SHA"
          test "$(jq -r '.message | split("\n")[0]' <<<"$candidate")" = "chore: close $RELEASE_TAG release state"
          candidate_tree="$(jq -r .tree.sha <<<"$candidate")"

          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="chore: close $RELEASE_TAG release state" \
            -f commit_message="Terminal bookkeeping for independently verified $RELEASE_TAG after native protected PR gates and deterministic closure proof.")"
          test "$(jq -r .merged <<<"$result")" = "true"
          main_sha="$(jq -r .sha <<<"$result")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$main_sha"
          merged="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$main_sha")"
          test "$(jq '.parents | length' <<<"$merged")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$merged")" = "$BASE_SHA"
          test "$(jq -r .tree.sha <<<"$merged")" = "$candidate_tree"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Confirm event-driven terminal cleanup handoff
        if: steps.state.outputs.state == 'pending'
        run: |
          set -euo pipefail
          test -f .github/workflows/post-release-cleanup.yml
          echo "closure merged at ${{ steps.merge.outputs.main_sha }}; native main push gates now own terminal leased cleanup"

      - name: Confirm idempotent already-closed state
        if: steps.state.outputs.state == 'closed'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/check_roadmap.py .
          echo "$RELEASE_TAG is already closed; no duplicate closure mutation required"
