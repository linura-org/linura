name: v0.9 qualification-environment qualification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to qualify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to qualify; defaults to selected ref
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/v09-qualification.yml"
      - ".github/actions/qualification-envelope/**"
      - "contracts/qualification-execution-envelopes.toml"
      - "tools/qualification_envelope.py"
      - "tools/qualification_guest_identity.py"
      - "tests/tooling/test_qualification_envelope.py"
      - ".github/workflows/v09-adversarial-security.yml"
      - ".github/workflows/vm-acceptance.yml"
      - ".github/workflows/trusted-release-proof.yml"
      - "apps/linura-firstboot/**"
      - "apps/linura-authorityd/**"
      - "apps/linurad/**"
      - "apps/linuractl/**"
      - "crates/linura-sdk/**"
      - "crates/linura-bootstrap/**"
      - "crates/linura-capability-sdk/**"
      - "crates/linura-control/**"
      - "crates/linura-agent-runtime/**"
      - "crates/linura-dbus/**"
      - "crates/linura-library/**"
      - "crates/linura-lifecycle/**"
      - "crates/linura-provider-sdk/**"
      - "crates/linura-policy/**"
      - "crates/linura-transaction/**"
      - "crates/linura-persistence-sqlite/**"
      - "crates/linura-graph/**"
      - "crates/linura-intent/**"
      - "crates/linura-provenance/**"
      - "crates/linura-core/**"
      - "crates/linura-hardware/**"
      - "crates/linura-linux-observation/**"
      - "crates/linura-migrations/**"
      - "crates/linura-observation/**"
      - "crates/linura-observation-control/**"
      - "crates/linura-planner/**"
      - "crates/linura-protocol/**"
      - "crates/linura-update/**"
      - "interfaces/dbus/**"
      - "executors/**"
      - "verifiers/**"
      - "contracts/stability.toml"
      - "tools/v09_qualification_scope.py"
      - "tests/tooling/test_v09_qualification_scope.py"
      - "tools/vm.py"
      - "tools/acceptance.py"
      - "scripts/qualification/v09-adversarial-guest.sh"
      - "contracts/components.toml"
      - "contracts/operation-semantics.toml"
      - "contracts/roadmap.toml"
      - "contracts/v09-qualification-routing.toml"
      - "hardware/support-matrix.json"
      - "docs/adr/0029-v09-first-boot-reference-and-provisioning-boundary.md"
      - "docs/first-boot.md"
      - "docs/hardware-validation.md"
      - "docs/machine-profiles.md"
      - "docs/operation-semantics.md"
      - "docs/platform-profiles.md"
      - "docs/milestones/v0.9.0.md"
      - "docs/qualification/v0.9.0.md"
      - "docs/threat-model-v0.9-recovery.md"
      - "docs/threat-model-v0.9-update-migration.md"
      - "docs/threat-model-v0.9-bootstrap-provisioning.md"
      - "tests/acceptance/**"
      - "tests/tooling/test_component_maturity.py"
      - "tests/tooling/test_operation_semantics.py"
      - "tests/tooling/test_roadmap.py"
      - "tests/tooling/test_v09_recovery_qualification.py"
      - "tests/tooling/test_v09_bootstrap_provisioning_contract.py"
      - "tests/tooling/test_v09_adversarial_fast_forward_contract.py"
      - "tests/tooling/test_v09_adversarial_transport_contract.py"
      - "tests/tooling/test_v09_adversarial_sharding_contract.py"
      - "tools/check_machine_classes.py"
      - "tools/check_operation_semantics.py"
      - "tools/image.py"
      - "tools/check_validation_gates.py"
      - "tests/tooling/test_validation_gates.py"
      - "tools/codex/versions.env"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config"
      - ".cargo/config.toml"
      - "packaging/wireplumber/linura-session-audio.lua"

permissions:
  actions: read
  contents: read

concurrency:
  group: v09-qualification-environment-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  BASE_IMAGE_SHA256: d1940f7d69d343355e183dff1e08a59852d32e7309baa7a4bad8365b11b005ac
  QUALIFICATION_ENVIRONMENT_ID: qualification/ubuntu-24.04-lts/amd64/qemu-tcg-headless

jobs:
  scope:
    name: v0.9 qualification scope
    runs-on: ubuntu-24.04
    outputs:
      full_qualification: ${{ steps.route.outputs.full_qualification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact-source qualification lane
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf 'full_qualification=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          merge_base="$(git merge-base "$BASE_SHA" "$SOURCE_SHA")"
          [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$merge_base" "$BASE_SHA"
          git merge-base --is-ancestor "$merge_base" "$SOURCE_SHA"
          changed="$RUNNER_TEMP/v09-changed-paths.bin"
          # Disable rename detection so both the source and destination paths are
          # classified. A protected v0.9 path cannot be moved out of scope and
          # silently inherit the fast regression lane.
          git diff --no-renames --name-only -z "$merge_base" "$SOURCE_SHA" > "$changed"
          python3 - "$changed" "$GITHUB_OUTPUT" <<'PY'
          import os
          import pathlib
          import sys
          import tomllib
          from tools.v09_qualification_scope import requires_full_qualification

          changed_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          contract = tomllib.loads(
              pathlib.Path("contracts/v09-qualification-routing.toml").read_text(encoding="utf-8")
          )
          changed = sorted(
              {
                  os.fsdecode(path)
                  for path in changed_path.read_bytes().split(b"\0")
                  if path
              }
          )
          full = requires_full_qualification(changed, contract)
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"full_qualification={'true' if full else 'false'}\n")
          print("v0.9 lane:", "full-qualification" if full else "exact-source-regression")
          for path in changed:
              print(path)
          PY

  contract:
    needs: scope
    name: v0.9 exact-source contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source and load toolchain contract
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # shellcheck disable=SC1091
          source tools/codex/versions.env
          : "${RUST_VERSION:?}"
          printf 'RUST_VERSION=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Verify candidate component, roadmap and support-scope contracts
        run: |
          set -euo pipefail
          python3 tools/check_component_maturity.py
          python3 tools/check_roadmap.py
          python3 tools/check_machine_classes.py
          python3 tools/check_operation_semantics.py
          python3 -m unittest \
            tests.tooling.test_roadmap \
            tests.tooling.test_operation_semantics \
            tests.tooling.test_v09_qualification_scope \
            tests.tooling.test_v09_recovery_qualification \
            tests.tooling.test_v09_bootstrap_provisioning_contract \
            tests.tooling.test_v09_adversarial_fast_forward_contract \
            tests.tooling.test_v09_adversarial_transport_contract \
            tests.tooling.test_v09_adversarial_sharding_contract

      - name: Test exact-source v0.9 regression contracts
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked \
            -p linura-firstboot \
            -p linura-bootstrap \
            -p linura-migrations \
            -p linura-update \
            -p linura-hardware
          cargo build --locked --release -p linura-firstboot --bin linura-firstboot
          ./target/release/linura-firstboot --self-check
          ./target/release/linura-firstboot --qualification-environment | grep -Fx 'id=qualification/ubuntu-24.04-lts/amd64/qemu-tcg-headless'
          ./target/release/linura-firstboot --qualification-environment | grep -Fx 'kind=qualification-environment'
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          expected_environment_status=candidate-not-yet-release-supported
          if [[ "$workspace_version" == 0.9.0 ]]; then
            expected_environment_status=release-qualified-experimental
          fi
          ./target/release/linura-firstboot --qualification-environment | grep -Fx "status=$expected_environment_status"

      - name: Build exact-source adversarial qualification binaries
        if: needs.scope.outputs.full_qualification == 'true'
        run: |
          set -euo pipefail
          cargo build --locked --release -p linura-bootstrap \
            --features qualification-harness --bin linura-bootstrap-qualification
          cargo build --locked --release -p linura-bootstrap \
            --features qualification-harness --bin linura-bootstrap-transition-qualification
          cargo build --locked --release -p linura-authorityd \
            --features v09-migration-qualification --bin linura-migrations-qualification
          cargo build --locked --release -p linura-update \
            --features qualification-harness --bin linura-update-qualification
          cargo build --locked --release -p linura-update \
            --features qualification-harness --bin linura-update-evidence-verifier-qualification

      - name: Upload exact-source adversarial qualification binaries
        if: needs.scope.outputs.full_qualification == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-v09-adversarial-binaries-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/linura-firstboot
            target/release/linura-bootstrap-qualification
            target/release/linura-bootstrap-transition-qualification
            target/release/linura-migrations-qualification
            target/release/linura-update-qualification
            target/release/linura-update-evidence-verifier-qualification
          if-no-files-found: error
          retention-days: 7

      - name: Bind v0.9 contract execution envelope
        uses: ./.github/actions/qualification-envelope
        env:
          ARTIFACT_DIR: /tmp/linura-v09-contract-envelope
        with:
          lane: v09-qualification-contract
          source-sha: ${{ env.SOURCE_SHA }}
          artifact-suffix: contract

      - name: Upload stable v0.9 contract envelope hand-off
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-v09-contract-envelope-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-contract-envelope/
          if-no-files-found: error
          retention-days: 30

  offline-reference:
    name: v0.9 offline QualificationEnvironment VM
    needs: [scope, contract]
    if: needs.scope.outputs.full_qualification == 'true'
    uses: ./.github/workflows/vm-acceptance.yml
    permissions:
      contents: read
    with:
      scenario: firstboot-offline
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

  adversarial-security:
    name: v0.9 adversarial bootstrap and Q11
    needs: [scope, contract]
    if: needs.scope.outputs.full_qualification == 'true'
    uses: ./.github/workflows/v09-adversarial-security.yml
    permissions:
      actions: read
      contents: read
    with:
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

  regression-proof:
    name: v0.9 exact-source regression proof
    needs: [scope, contract]
    if: needs.scope.outputs.full_qualification != 'true'
    runs-on: ubuntu-24.04
    env:
      CONTRACT_ENVELOPE_ROOT: /tmp/linura-v09-contract-envelope
      REGRESSION_ROOT: /tmp/linura-v09-regression
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Confirm bounded regression lane
        run: |
          set -euo pipefail
          test "${{ needs.scope.result }}" = success
          test "${{ needs.contract.result }}" = success
          test "${{ needs.scope.outputs.full_qualification }}" = false
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download exact-source contract execution envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v09-contract-envelope-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-contract-envelope

      - name: Bind bounded regression execution set
        run: |
          set -euo pipefail
          mkdir -p "$REGRESSION_ROOT"
          /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          source_sha = os.environ["SOURCE_SHA"]
          qualification_id = os.environ["QUALIFICATION_ENVIRONMENT_ID"]
          root = Path(os.environ["CONTRACT_ENVELOPE_ROOT"])
          envelope_path = root / "qualification-execution-envelope.json"
          checksum_path = root / "qualification-execution-envelope.json.sha256"
          if not envelope_path.is_file() or envelope_path.is_symlink() or not checksum_path.is_file() or checksum_path.is_symlink():
              raise SystemExit("v0.9 contract execution envelope is missing or unsafe")
          verified = subprocess.run(
              ["/usr/bin/python3", "-I", "tools/qualification_envelope.py", "verify",
               "--envelope", str(envelope_path), "--source-sha", source_sha],
              check=False, capture_output=True, text=True,
          )
          if verified.returncode:
              raise SystemExit("v0.9 contract envelope verification failed: " +
                               (verified.stderr.strip() or verified.stdout.strip()))
          envelope = json.loads(envelope_path.read_text(encoding="utf-8"))
          if envelope.get("lane", {}).get("id") != "v09-qualification-contract":
              raise SystemExit("v0.9 contract envelope lane mismatch")
          if envelope.get("execution_subject", {}).get("kind") != "runner":
              raise SystemExit("v0.9 contract envelope execution subject mismatch")
          if envelope.get("observations", {}).get("qualification_environment_id") != qualification_id:
              raise SystemExit("v0.9 contract envelope qualification environment mismatch")
          components = sorted(
              [{
                  "role": "contract",
                  "lane": "v09-qualification-contract",
                  "sha256": envelope["envelope_sha256"],
                  "subject_kind": "runner",
              }],
              key=lambda item: (
                  item["role"], item["lane"], item["sha256"], item["subject_kind"]
              ),
          )
          component_sha = hashlib.sha256(
              json.dumps(components, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"COMPONENT_ENVELOPE_SET_SHA256={component_sha}\n")
          manifest = {
              "schema_version": 1,
              "kind": "qualification-execution-component-set",
              "lane": "v09-qualification",
              "route": "exact-source-regression",
              "source_sha": source_sha,
              "qualification_environment_id": qualification_id,
              "component_envelope_set_sha256": component_sha,
              "components": components,
          }
          manifest_path = Path(os.environ["REGRESSION_ROOT"]) / "qualification-execution-components.json"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          manifest_path.with_name(manifest_path.name + ".sha256").write_text(
              f"{manifest_sha}  {manifest_path.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Bind regression qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        env:
          ARTIFACT_DIR: ${{ env.REGRESSION_ROOT }}
        with:
          lane: v09-qualification
          source-sha: ${{ env.SOURCE_SHA }}
          artifact-suffix: regression

      - name: Upload exact-source regression execution context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-v09-regression-execution-context-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-regression/
          if-no-files-found: error
          retention-days: 30

  qualification-proof:
    name: bind v0.9 qualification evidence
    needs: [scope, contract, offline-reference, adversarial-security]
    if: needs.scope.outputs.full_qualification == 'true'
    runs-on: ubuntu-24.04
    env:
      CONTRACT_ENVELOPE_ROOT: /tmp/linura-v09-contract-envelope
      EVIDENCE_ROOT: /tmp/linura-v09-vm
      ADVERSARIAL_ROOT: /tmp/linura-v09-adversarial
      QUALIFICATION_ROOT: /tmp/linura-v09-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Download exact-source contract execution envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v09-contract-envelope-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-contract-envelope

      - name: Download exact-source VM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-vm-acceptance-firstboot-offline-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-vm

      - name: Download exact-source adversarial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linura-v09-adversarial-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-adversarial

      - name: Validate and bind qualification evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tomllib

          source_sha = os.environ["SOURCE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          qualification_id = "qualification/ubuntu-24.04-lts/amd64/qemu-tcg-headless"
          base_image_sha = "d1940f7d69d343355e183dff1e08a59852d32e7309baa7a4bad8365b11b005ac"
          contract_root = pathlib.Path(os.environ["CONTRACT_ENVELOPE_ROOT"])
          evidence_root = pathlib.Path(os.environ["EVIDENCE_ROOT"])
          adversarial_root = pathlib.Path(os.environ["ADVERSARIAL_ROOT"])
          qualification_root = pathlib.Path(os.environ["QUALIFICATION_ROOT"])
          qualification_root.mkdir(parents=True, exist_ok=True)

          def digest(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def verified_envelope(directory: pathlib.Path, role: str, lane_id: str, subject_kind: str) -> dict:
              path = directory / "qualification-execution-envelope.json"
              checksum = directory / "qualification-execution-envelope.json.sha256"
              if not path.is_file() or path.is_symlink() or not checksum.is_file() or checksum.is_symlink():
                  raise SystemExit(f"{role} execution envelope is missing or unsafe")
              result = subprocess.run(
                  [
                      "/usr/bin/python3", "-I", "tools/qualification_envelope.py",
                      "verify", "--envelope", str(path), "--source-sha", source_sha,
                  ],
                  check=False, capture_output=True, text=True,
              )
              if result.returncode:
                  raise SystemExit(
                      f"{role} execution envelope verification failed: "
                      + (result.stderr.strip() or result.stdout.strip())
                  )
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("lane", {}).get("id") != lane_id:
                  raise SystemExit(f"{role} execution envelope lane mismatch")
              if payload.get("execution_subject", {}).get("kind") != subject_kind:
                  raise SystemExit(f"{role} execution subject mismatch")
              return {
                  "role": role,
                  "lane": lane_id,
                  "sha256": payload["envelope_sha256"],
                  "subject_kind": subject_kind,
                  "payload": payload,
              }

          contract_envelope = verified_envelope(
              contract_root, "contract", "v09-qualification-contract", "runner"
          )
          if contract_envelope["payload"].get("observations", {}).get("qualification_environment_id") != qualification_id:
              raise SystemExit("v0.9 contract envelope qualification environment mismatch")

          evidence_path = evidence_root / "VM-ACCEPTANCE-EVIDENCE.json"
          checksum_path = evidence_root / "VM-ACCEPTANCE-EVIDENCE.sha256"
          if not evidence_path.is_file() or not checksum_path.is_file():
              raise SystemExit("v0.9 VM evidence or checksum is missing")
          evidence_sha = digest(evidence_path)
          if checksum_path.read_text(encoding="utf-8").strip() != f"{evidence_sha}  {evidence_path.name}":
              raise SystemExit("v0.9 VM evidence checksum mismatch")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          if evidence.get("schema_version") != 2:
              raise SystemExit("unexpected v0.9 VM evidence schema")
          if evidence.get("repository") != repository or evidence.get("source_sha") != source_sha:
              raise SystemExit("v0.9 VM evidence source/repository mismatch")
          if evidence.get("result") != "passed":
              raise SystemExit("v0.9 VM qualification did not pass")
          if evidence.get("scenario", {}).get("id") != "firstboot-offline":
              raise SystemExit("v0.9 VM evidence scenario mismatch")
          production = evidence.get("binaries", {}).get("linura-authorityd")
          if not isinstance(production, dict) or production.get("identity_match") is not True:
              raise SystemExit("v0.9 production authority identity evidence is missing")
          host = production.get("host_build")
          guest = production.get("guest_installed")
          if (not isinstance(host, dict) or not isinstance(guest, dict) or
                  not isinstance(host.get("sha256"), str) or
                  len(host["sha256"]) != 64 or
                  any(char not in "0123456789abcdef" for char in host["sha256"]) or
                  not isinstance(host.get("size"), int) or host["size"] <= 0 or
                  guest != host):
              raise SystemExit("v0.9 production authority executable identity mismatch")
          qualification_environment = evidence.get("qualification_environment", {})
          if qualification_environment.get("id") != qualification_id:
              raise SystemExit("v0.9 QualificationEnvironment identity mismatch")
          if evidence.get("virtualization", {}).get("requested_acceleration") != "tcg":
              raise SystemExit("v0.9 virtualization mode mismatch")
          if evidence.get("base_image", {}).get("sha256") != base_image_sha:
              raise SystemExit("v0.9 base image digest mismatch")

          adversarial_path = adversarial_root / "V09-ADVERSARIAL-EVIDENCE.json"
          adversarial_checksum = adversarial_root / "V09-ADVERSARIAL-EVIDENCE.sha256"
          if not adversarial_path.is_file() or not adversarial_checksum.is_file():
              raise SystemExit("v0.9 adversarial evidence or checksum is missing")
          adversarial_sha = digest(adversarial_path)
          if adversarial_checksum.read_text(encoding="utf-8").strip() != f"{adversarial_sha}  {adversarial_path.name}":
              raise SystemExit("v0.9 adversarial evidence checksum mismatch")
          adversarial = json.loads(adversarial_path.read_text(encoding="utf-8"))
          if adversarial.get("schema_version") != 1:
              raise SystemExit("unexpected v0.9 adversarial evidence schema")
          if adversarial.get("repository") != repository or adversarial.get("source_sha") != source_sha:
              raise SystemExit("v0.9 adversarial evidence source/repository mismatch")
          if adversarial.get("result") != "passed":
              raise SystemExit("v0.9 adversarial qualification did not pass")
          if adversarial.get("qualification_environment", {}).get("id") != qualification_id:
              raise SystemExit("v0.9 adversarial environment identity mismatch")
          if adversarial.get("base_image", {}).get("sha256") != base_image_sha:
              raise SystemExit("v0.9 adversarial base-image mismatch")
          vm_envelope = verified_envelope(
              evidence_root, "offline-reference", "vm-acceptance", "virtual-machine"
          )
          adversarial_envelope = verified_envelope(
              adversarial_root, "adversarial-security", "v09-adversarial-security", "aggregate"
          )
          if vm_envelope["payload"].get("execution_subject", {}).get("image_digests", {}).get("base_image_sha256") != base_image_sha:
              raise SystemExit("v0.9 offline execution envelope base-image mismatch")
          component_manifest_path = adversarial_root / "qualification-execution-components.json"
          component_manifest_checksum = adversarial_root / "qualification-execution-components.json.sha256"
          if (
              not component_manifest_path.is_file()
              or component_manifest_path.is_symlink()
              or not component_manifest_checksum.is_file()
              or component_manifest_checksum.is_symlink()
          ):
              raise SystemExit("v0.9 adversarial execution-component manifest is missing or unsafe")
          component_manifest_file_sha = digest(component_manifest_path)
          if component_manifest_checksum.read_text(encoding="utf-8").strip() != (
              f"{component_manifest_file_sha}  {component_manifest_path.name}"
          ):
              raise SystemExit("v0.9 adversarial execution-component manifest checksum mismatch")
          component_manifest = json.loads(
              component_manifest_path.read_text(encoding="utf-8")
          )
          if (
              not isinstance(component_manifest, dict)
              or set(component_manifest)
              != {
                  "schema_version",
                  "kind",
                  "lane",
                  "source_sha",
                  "qualification_environment_id",
                  "component_envelope_set_sha256",
                  "components",
              }
              or component_manifest.get("schema_version") != 1
              or component_manifest.get("kind") != "qualification-execution-component-set"
              or component_manifest.get("lane") != "v09-adversarial-security"
              or component_manifest.get("source_sha") != source_sha
              or component_manifest.get("qualification_environment_id") != qualification_id
          ):
              raise SystemExit("v0.9 adversarial execution-component manifest identity mismatch")
          adversarial_components = component_manifest.get("components")
          if not isinstance(adversarial_components, list):
              raise SystemExit("v0.9 adversarial component-envelope set is missing")
          execution_contract = tomllib.loads(
              (pathlib.Path.cwd() / "contracts/qualification-execution-envelopes.toml").read_text(
                  encoding="utf-8"
              )
          )
          expected_shard_ids = sorted(
              item["id"] for item in execution_contract["v09_adversarial_shard"]
          )
          normalized_adversarial_components = []
          seen_shard_ids = set()
          for item in adversarial_components:
              if (
                  not isinstance(item, dict)
                  or set(item) != {"id", "sha256"}
                  or not isinstance(item.get("id"), str)
                  or item["id"] in seen_shard_ids
                  or not isinstance(item.get("sha256"), str)
                  or len(item["sha256"]) != 64
                  or any(char not in "0123456789abcdef" for char in item["sha256"])
              ):
                  raise SystemExit("v0.9 adversarial component-envelope entry is invalid")
              seen_shard_ids.add(item["id"])
              normalized_adversarial_components.append(
                  {"id": item["id"], "sha256": item["sha256"]}
              )
          normalized_adversarial_components.sort(key=lambda item: item["id"])
          if [item["id"] for item in normalized_adversarial_components] != expected_shard_ids:
              raise SystemExit("v0.9 adversarial component-envelope inventory mismatch")
          canonical_adversarial_component_digest = hashlib.sha256(
              json.dumps(
                  normalized_adversarial_components,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()
          if (
              component_manifest.get("component_envelope_set_sha256")
              != canonical_adversarial_component_digest
          ):
              raise SystemExit("v0.9 adversarial component-envelope digest mismatch")
          if (
              adversarial_envelope["payload"].get("execution_subject", {}).get("component_envelope_set_sha256")
              != canonical_adversarial_component_digest
          ):
              raise SystemExit("v0.9 adversarial aggregate envelope binding mismatch")
          if (
              adversarial_envelope["payload"].get("observations", {}).get("qualification_environment_id")
              != qualification_id
          ):
              raise SystemExit("v0.9 adversarial aggregate environment mismatch")
          execution_components = sorted(
              (
                  {key: item[key] for key in ("role", "lane", "sha256", "subject_kind")}
                  for item in (contract_envelope, vm_envelope, adversarial_envelope)
              ),
              key=lambda item: (
                  item["role"], item["lane"], item["sha256"], item["subject_kind"]
              ),
          )
          component_envelope_set_sha256 = hashlib.sha256(
              json.dumps(execution_components, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"COMPONENT_ENVELOPE_SET_SHA256={component_envelope_set_sha256}\n")
          qualification_context = {
              "schema_version": 1,
              "kind": "qualification-execution-component-set",
              "lane": "v09-qualification",
              "route": "full",
              "source_sha": source_sha,
              "qualification_environment_id": qualification_id,
              "component_envelope_set_sha256": component_envelope_set_sha256,
              "components": execution_components,
          }
          qualification_context_path = (
              qualification_root / "qualification-execution-components.json"
          )
          qualification_context_path.write_text(
              json.dumps(qualification_context, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          qualification_context_sha = digest(qualification_context_path)
          qualification_context_path.with_name(
              qualification_context_path.name + ".sha256"
          ).write_text(
              f"{qualification_context_sha}  {qualification_context_path.name}\n",
              encoding="utf-8",
          )

          transcript_binding = adversarial.get("transcript")
          if not isinstance(transcript_binding, dict):
              raise SystemExit("v0.9 adversarial transcript binding is missing")
          transcript_name = transcript_binding.get("path")
          if (
              not isinstance(transcript_name, str)
              or not transcript_name
              or pathlib.Path(transcript_name).name != transcript_name
          ):
              raise SystemExit("v0.9 adversarial transcript path is invalid")
          adversarial_transcript = adversarial_root / transcript_name
          if not adversarial_transcript.is_file() or adversarial_transcript.is_symlink():
              raise SystemExit("v0.9 adversarial transcript is missing or untrusted")
          if transcript_binding.get("size") != adversarial_transcript.stat().st_size:
              raise SystemExit("v0.9 adversarial transcript size mismatch")
          if transcript_binding.get("sha256") != digest(adversarial_transcript):
              raise SystemExit("v0.9 adversarial transcript digest mismatch")

          shutil.copy2(evidence_path, qualification_root / evidence_path.name)
          shutil.copy2(checksum_path, qualification_root / checksum_path.name)
          shutil.copy2(adversarial_path, qualification_root / adversarial_path.name)
          shutil.copy2(adversarial_checksum, qualification_root / adversarial_checksum.name)
          shutil.copy2(adversarial_transcript, qualification_root / transcript_name)

          receipt = {
              "schema_version": 2,
              "repository": repository,
              "source_sha": source_sha,
              "result": "passed",
              "qualification_environment": qualification_environment,
              "source_contracts": [
                  "firstboot-exact-environment-and-non-authority",
                  "bootstrap-recovery-evidence-binding",
                  "bootstrap-durable-ledger-generation-and-no-blind-replay",
                  "provisioning-manifest-v1-bounded-integrity-bound",
                  "owner-enrollment-pending-fresh-authority-generation",
                  "migration-durable-ledger-and-independent-backup",
                  "update-durable-prepare-dispatch-verify-and-no-blind-replay",
                  "q11-disposable-migration-restore-update-native-recovery",
                  "v09-adversarial-bootstrap-provisioning-security",
                  "production-firstboot-persistent-power-cycle-recovery",
                  "update-real-dpkg-transaction-authoritative-reobservation",
                  "adversarial-transcript-integrity-and-retention",
              ],
              "vm_evidence": {
                  "path": evidence_path.name,
                  "sha256": evidence_sha,
                  "size": evidence_path.stat().st_size,
                  "workflow_run_id": evidence.get("workflow", {}).get("run_id"),
                  "workflow_run_attempt": evidence.get("workflow", {}).get("run_attempt"),
              },
              "adversarial_evidence": {
                  "path": adversarial_path.name,
                  "sha256": adversarial_sha,
                  "size": adversarial_path.stat().st_size,
                  "workflow_run_id": adversarial.get("workflow", {}).get("run_id"),
                  "workflow_run_attempt": adversarial.get("workflow", {}).get("run_attempt"),
              },
          }
          (qualification_root / "qualification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Bind qualification execution envelope
        uses: ./.github/actions/qualification-envelope
        env:
          ARTIFACT_DIR: /tmp/linura-v09-qualification
        with:
          lane: v09-qualification
          source-sha: ${{ env.SOURCE_SHA }}

      - name: Upload exact-source v0.9 qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linura-v09-qualification-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: /tmp/linura-v09-qualification/
          if-no-files-found: error
