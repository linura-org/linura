name: PR134 fail-closed review fix

on:
  push:
    branches:
      - fix/v0.9-black-box-qualification
    paths:
      - .github/workflows/pr134-review-fix.yml
      - scripts/qualification/v09-adversarial-guest.sh
      - tests/tooling/test_v09_adversarial_sharding_contract.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0.9-black-box-qualification
          fetch-depth: 0
      - name: Apply fail-closed qualification fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/qualification/v09-adversarial-guest.sh')
          script = script_path.read_text(encoding='utf-8')
          old = '''  remote "sudo -n rm -rf '$PUBLIC_BOOTSTRAP_ROOT'; sudo -n install -d -o root -g root -m 0700 '$PUBLIC_BOOTSTRAP_ROOT'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/.linura-bootstrap-session'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/bootstrap.state'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/authority/control-receipt-auth.key'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/authority/preparer-revocation.receipt'"'''
          new = '''  remote "set -euo pipefail; sudo -n rm -rf '$PUBLIC_BOOTSTRAP_ROOT'; sudo -n install -d -o root -g root -m 0700 '$PUBLIC_BOOTSTRAP_ROOT'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/.linura-bootstrap-session'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/bootstrap.state'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/authority/control-receipt-auth.key'; sudo -n test ! -e '$PUBLIC_BOOTSTRAP_ROOT/authority/preparer-revocation.receipt'"'''
          if script.count(old) != 1:
              raise SystemExit(f'expected exactly one fresh-root preparation command, found {script.count(old)}')
          script_path.write_text(script.replace(old, new), encoding='utf-8')

          test_path = Path('tests/tooling/test_v09_adversarial_sharding_contract.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '        self.assertIn("--accel tcg", source)\n'
          assertion = '''        self.assertIn(
            "remote \\\"set -euo pipefail; sudo -n rm -rf '$PUBLIC_BOOTSTRAP_ROOT';",
            source,
        )
'''
          if test.count(anchor) != 1:
              raise SystemExit(f'expected one regression anchor, found {test.count(anchor)}')
          if assertion not in test:
              test = test.replace(anchor, assertion + anchor)
          test_path.write_text(test, encoding='utf-8')
          PY
          bash -n scripts/qualification/v09-adversarial-guest.sh
          python3 -m unittest tests.tooling.test_v09_adversarial_sharding_contract
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/qualification/v09-adversarial-guest.sh tests/tooling/test_v09_adversarial_sharding_contract.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(v0.9): fail closed preparing public bootstrap root'
          git push origin HEAD:fix/v0.9-black-box-qualification
