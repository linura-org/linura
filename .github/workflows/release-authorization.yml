name: Release Authorization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-authorization-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify reviewed release preparation
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: prepare v') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.qualify.outputs.source_sha }}
      tree_sha: ${{ steps.qualify.outputs.tree_sha }}
      tag: ${{ steps.qualify.outputs.tag }}
      theme: ${{ steps.qualify.outputs.theme }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact reviewed release-preparation source
        id: qualify
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"

          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import os
          import re
          import sys

          subject, output_path = sys.argv[1:]
          match = re.fullmatch(
              r"release: prepare (?P<tag>v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-preparation subject: {subject!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"source_sha={os.environ['SOURCE_SHA']}\n")
              handle.write(f"tag={match.group('tag')}\n")
              handle.write(f"theme={match.group('theme')}\n")
          PY

          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          theme="$(sed -n 's/^theme=//p' "$GITHUB_OUTPUT" | tail -1)"
          python3 - "$tag" "$theme" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag, theme = sys.argv[1:]
          roadmap = tomllib.loads(pathlib.Path("contracts/roadmap.toml").read_text(encoding="utf-8"))
          if roadmap.get("next_release") != tag:
              raise SystemExit(f"release preparation is not roadmap next_release: {tag} != {roadmap.get('next_release')}")
          milestones = {item["version"]: item for item in roadmap["milestone"]}
          milestone = milestones.get(tag)
          if milestone is None or milestone.get("status") != "planned":
              raise SystemExit(f"release-preparation milestone is not planned: {tag}")
          if milestone.get("title") != theme:
              raise SystemExit(
                  f"release-preparation theme does not equal roadmap title: {theme!r} != {milestone.get('title')!r}"
              )
          PY

          python3 tools/check_release_publication_stability.py
          python3 tools/check_roadmap.py .
          python3 tools/release_contract.py validate \
            --tag "$tag" \
            --notes "docs/releases/${tag}.md" \
            --require-workspace-version

          prs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls")"
          # shellcheck disable=SC2016
          pr_number="$(jq -r --arg sha "$SOURCE_SHA" --arg tag "$tag" '
            [.[] | select(
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha and
              (.title | startswith("release: prepare " + $tag + " "))
            )]
            | if length == 1 then .[0].number else empty end
          ' <<<"$prs")"
          [[ "$pr_number" =~ ^[0-9]+$ ]]

          # GraphQL variables are intentionally literal inside the single-quoted query.
          # shellcheck disable=SC2016
          unresolved="$(gh api graphql --paginate \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="$pr_number" \
            -F endCursor=null \
            -f query='
              query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100, after:$endCursor) {
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' |
            awk '{ total += $1 } END { print total + 0 }')"
          test "$unresolved" = "0"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing a new release authorization" >&2
            exit 1
          fi

          tree_sha="$(git rev-parse "$SOURCE_SHA^{tree}")"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'tree_sha=%s\n' "$tree_sha" >> "$GITHUB_OUTPUT"

  authorize:
    name: create and merge protected metadata-only authorization
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ needs.qualify.outputs.source_sha }}
      TREE_SHA: ${{ needs.qualify.outputs.tree_sha }}
      RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
      RELEASE_THEME: ${{ needs.qualify.outputs.theme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.qualify.outputs.source_sha }}

      - name: Require dedicated Release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APP_CLIENT_ID" || { echo "missing repository variable LINURA_RELEASE_APP_CLIENT_ID" >&2; exit 2; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo "missing repository secret LINURA_RELEASE_APP_PRIVATE_KEY" >&2; exit 2; }

      - name: Mint repository-scoped Release App token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LINURA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINURA_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Prove Release App automation authority
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          python3 tools/probe_release_automation_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --base main \
            --head main \
            --credential-source github-app

      - name: Require native protected-main gates on prepared source
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$SOURCE_SHA" \
            --head-branch main \
            --timeout-seconds 1800 \
            commit --event push
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Create or re-prove exact zero-diff authorization PR
        id: candidate
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          source="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA")"
          test "$(jq -r .tree.sha <<<"$source")" = "$TREE_SHA"

          title="release: authorize $RELEASE_TAG"
          authorization_subject="release: $RELEASE_TAG — $RELEASE_THEME"
          message="$(cat <<EOF
          $authorization_subject

          Authorize publication of the frozen $RELEASE_TAG release through Linura's protected proof-first, tag-last lifecycle. The reviewed release-preparation tree is unchanged.

          Reviewed-Source: $SOURCE_SHA
          Reviewed-Tree: $TREE_SHA
          EOF
          )"

          verify_candidate() {
            local pr_number="$1"
            local candidate_sha="$2"
            local candidate_branch="$3"
            [[ "$pr_number" =~ ^[0-9]+$ ]]
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$candidate_branch" = "automation/release-authorization-${RELEASE_TAG}-${candidate_sha}"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$candidate_branch" --jq .object.sha)" = "$candidate_sha"
            pr_payload="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            test "$(jq -r .base.sha <<<"$pr_payload")" = "$SOURCE_SHA"
            test "$(jq -r .head.sha <<<"$pr_payload")" = "$candidate_sha"
            test "$(jq -r .head.ref <<<"$pr_payload")" = "$candidate_branch"
            test "$(jq -r .title <<<"$pr_payload")" = "$title"
            test "$(jq -r .changed_files <<<"$pr_payload")" = "0"
            candidate_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$candidate_sha")"
            test "$(jq -r .tree.sha <<<"$candidate_payload")" = "$TREE_SHA"
            test "$(jq '.parents | length' <<<"$candidate_payload")" = "1"
            test "$(jq -r '.parents[0].sha' <<<"$candidate_payload")" = "$SOURCE_SHA"
            test "$(jq -r .message <<<"$candidate_payload")" = "$message"
          }

          existing_json="$(gh pr list --state open --base main --json number,title,headRefName,headRefOid)"
          # shellcheck disable=SC2016
          existing="$(jq -c --arg title "$title" '[.[] | select(.title == $title)] | first // empty' <<<"$existing_json")"
          if [[ -n "$existing" ]]; then
            pr_number="$(jq -r .number <<<"$existing")"
            head_sha="$(jq -r .headRefOid <<<"$existing")"
            branch="$(jq -r .headRefName <<<"$existing")"
            verify_candidate "$pr_number" "$head_sha" "$branch"
          else
            commit_payload="$(jq -n \
              --arg message "$message" \
              --arg tree "$TREE_SHA" \
              --arg parent "$SOURCE_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}')"
            authorization="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - <<<"$commit_payload")"
            head_sha="$(jq -r .sha <<<"$authorization")"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$(jq -r .tree.sha <<<"$authorization")" = "$TREE_SHA"
            test "$(jq '.parents | length' <<<"$authorization")" = "1"
            test "$(jq -r .parents[0].sha <<<"$authorization")" = "$SOURCE_SHA"
            test "$(jq -r .message <<<"$authorization")" = "$message"
            branch="automation/release-authorization-${RELEASE_TAG}-${head_sha}"

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" = "$head_sha"
            else
              ref_payload="$(jq -n --arg ref "refs/heads/$branch" --arg sha "$head_sha" '{ref:$ref, sha:$sha}')"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input - <<<"$ref_payload" >/dev/null
            fi

            cat > "$RUNNER_TEMP/body.md" <<EOF
          Protected zero-diff authorization for the exact reviewed release-preparation source \`$SOURCE_SHA\`.

          - authorization head: \`$head_sha\`;
          - reviewed tree: \`$TREE_SHA\`;
          - exactly one parent: the reviewed preparation source;
          - zero changed files by construction;
          - native PR CI/Security/CodeQL are the ruleset-authoritative merge gates;
          - zero unresolved review threads are required;
          - no conversational reviewer is required for this structurally proven machine-only handoff;
          - workflow_dispatch checks are not used as substitutes for native PR checks.
          EOF
            url="$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
            pr_number="${url##*/}"
            verify_candidate "$pr_number" "$head_sha" "$branch"
          fi

          {
            printf 'branch=%s\n' "$branch"
            printf 'pr_number=%s\n' "$pr_number"
            printf 'head_sha=%s\n' "$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Require GitHub-native PR gates and clean ruleset state
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 1800 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$SOURCE_SHA" \
            --expected-changed-files 0

      - name: Re-prove and squash merge exact authorization through protected main
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "automation/release-authorization-${RELEASE_TAG}-${HEAD_SHA}"
          python3 tools/release_native_gates.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$BRANCH" \
            --timeout-seconds 0 \
            pr \
            --pr-number "$PR_NUMBER" \
            --base-sha "$SOURCE_SHA" \
            --expected-changed-files 0
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD_SHA"

          candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA")"
          test "$(jq -r .tree.sha <<<"$candidate")" = "$TREE_SHA"
          test "$(jq '.parents | length' <<<"$candidate")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$candidate")" = "$SOURCE_SHA"

          commit_title="release: $RELEASE_TAG — $RELEASE_THEME"
          commit_message="$(cat <<EOF
          Authorize publication of the frozen $RELEASE_TAG release through Linura's protected proof-first, tag-last lifecycle. The reviewed release-preparation tree is unchanged.

          Reviewed-Source: $SOURCE_SHA
          Reviewed-Tree: $TREE_SHA
          EOF
          )"
          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title="$commit_title" \
            -f commit_message="$commit_message")"
          test "$(jq -r .merged <<<"$result")" = "true"
          authorization_sha="$(jq -r .sha <<<"$result")"
          [[ "$authorization_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$authorization_sha"

          merged="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$authorization_sha")"
          test "$(jq -r .tree.sha <<<"$merged")" = "$TREE_SHA"
          test "$(jq '.parents | length' <<<"$merged")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"$merged")" = "$SOURCE_SHA"
          merged_message="$(jq -r .message <<<"$merged")"
          test "$(head -n1 <<<"$merged_message")" = "$commit_title"
          grep -Fx "Reviewed-Source: $SOURCE_SHA" <<<"$merged_message"
          grep -Fx "Reviewed-Tree: $TREE_SHA" <<<"$merged_message"
          printf 'authorization_sha=%s\n' "$authorization_sha" >> "$GITHUB_OUTPUT"

      - name: Confirm event-driven proof handoff is installed
        run: |
          set -euo pipefail
          test -f .github/workflows/release-proof-dispatch.yml
          echo "authorization merged at ${{ steps.merge.outputs.authorization_sha }}; native main push gates and Release Proof Dispatch own the next transition"
