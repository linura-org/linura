name: S20 WIP validation (non-release)

on:
  push:
    branches: ['wip/v010-s20-audio-media']

permissions:
  contents: read

concurrency:
  group: s20-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wip-rust-review:
    name: s20-wip-rustfmt-clippy-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustc +1.98.0 --version
      - name: Review exact S20 dependency lock delta
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --format-version 1 > /dev/null
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.lock
      - name: Rustfmt exact-head review
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
      - name: Clippy all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Inert S20 authority and extraction contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tests/tooling/test_v010_s20_design.py
          python3 -I -S tests/tooling/test_v010_s20_pr_extraction.py
      - name: Audio graph and MPRIS unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked -p linura-linux-observation
