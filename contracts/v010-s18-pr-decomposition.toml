classification = "Trusted operation registry and canonical ReconciliationPlan"
effect_semantics = "ManagedExternalEffect until separately reviewed"
authn = "Transport-authenticated principal/Polkit subject and exact NM unique owner"
verification = "Fresh independent native postcondition with IP/DNS/route impact"
recovery = "Durable indeterminate state, offline local fallback, no blind replay"
privacy = "No plaintext credentials in plans, logs, model or retained evidence"
scan_semantics = "Passive AP read is query; RequestScan is external effect"
connection_safety = "Never disrupt the last recoverable link without proven local recovery"
qualification = "Exact-source A/B and maintained physical network hardware C/Q11"
unsupported = "Deny unknown VPN, hotspot, mobile and arbitrary settings extensions"

