acceptance = ["Extend the canonical NetworkManagerObserver and ObservationEnvelope; preserve tested manager/device query aliases, daemon/CLI/First Boot integration, and existing PlatformProfile provider-discovery behavior without creating a second authority.", "Pin actual NetworkManager system-bus unique owner and boot epoch across bounded manager, device, saved-profile, active-connection, AP and IP reads; detect daemon replacement, alias/path reuse and inconsistent multi-object snapshots rather than claiming an atomic GetAll.", "Provide typed observed wired/Wi-Fi inventory, passive AP results, saved/active connection identities and revisions, IPv4/IPv6 assignment, gateways, DNS, default routes and radio/rfkill with explicit stale/unknown/unsupported states; distinguish NM connectivity category from independent Internet reachability.", "Enforce native transport byte/variant/depth, list count, string and time ceilings before unsafe allocation/retention; reject duplicates and oversized/malformed data, not truncation or first-match identity selection.", "Keep all observations read-only; reading scan results is permitted, but RequestScan, secret retrieval, profile mutation and connection activation cannot be reached from the observer; add source-pinned negative/real-native tests."]
