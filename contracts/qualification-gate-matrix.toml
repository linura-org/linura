schema_version = 1
id = "qualification/applicable-gates"
repository = "linura-org/linura"
required_event = "pull_request"
summary_workflow = ".github/workflows/applicable-qualification.yml"
summary_job = "reconcile"
branch_required_check = "applicable-qualification" # diagnostic Actions status; not the App-owned required Check Run
mandatory_gate_ids = ["canonical-ci", "security-rustsec", "codeql"]

routing_authority_paths = [
  ".github/workflows/applicable-qualification.yml",
  "contracts/qualification-gate-matrix.toml",
  "tools/applicable_qualification.py",
  "tests/tooling/test_applicable_qualification.py",
  "services/qualification-publisher/publisher.mjs",
  "services/qualification-publisher/server.mjs",
  "services/qualification-publisher/test/publisher.test.mjs",
]

native_only_components = [
  "linura",
  "linura-python",
  "linura-config",
  "linura-testkit",
  "xtask",
  "linura-agent-ui",
  "linura-control-center",
]

native_only_contracts = [
  "contracts/community.toml",
  "contracts/qualification-gate-matrix.toml",
  "contracts/namespaces.toml",
  "contracts/release-branch-cleanup.toml",
  "contracts/repository-topology.toml",
]

release_workflows = [
  ".github/workflows/crates-io-publish.yml",
  ".github/workflows/post-release-cleanup.yml",
  ".github/workflows/post-release-closure.yml",
  ".github/workflows/release-authorization.yml",
  ".github/workflows/release-closure-handoff.yml",
  ".github/workflows/release-preparation.yml",
  ".github/workflows/release-promotion.yml",
  ".github/workflows/release-proof-dispatch.yml",
  ".github/workflows/release-verification.yml",
  ".github/workflows/release.yml",
  ".github/workflows/reusable-release-build.yml",
  ".github/workflows/trusted-release-proof.yml",
]

[[gate]]
id = "canonical-ci"
workflow = ".github/workflows/ci.yml"
workflow_name = "CI"
mandatory = true
execution_lanes = ["canonical-ci"]
required_jobs = ["canonical-check"]
paths = []

[[gate]]
id = "security-rustsec"
workflow = ".github/workflows/security.yml"
workflow_name = "Security"
mandatory = true
execution_lanes = ["security-rustsec"]
required_jobs = ["dependency-audit"]
paths = []

[[gate]]
id = "codeql"
workflow = ".github/workflows/codeql.yml"
workflow_name = "CodeQL"
mandatory = true
execution_lanes = ["codeql"]
required_jobs = ["analyze"]
paths = []

[[gate]]
id = "codex-environment"
workflow = ".github/workflows/codex-environment.yml"
workflow_name = "Codex environment"
mandatory = false
execution_lanes = ["codex-environment"]
required_jobs = [
  "fresh-environment",
]
paths = [
  "AGENTS.md",
  "**/AGENTS.md",
  "CONTRIBUTING.md",
