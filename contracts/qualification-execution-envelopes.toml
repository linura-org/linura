schema_version = 2
id = "qualification/execution-envelopes"
digest_algorithm = "sha256"
canonicalization = "json-sort-keys-compact-utf8-v1"
source_identity = "git-commit-and-tree-v1"
runner_identity = "explicit-runner-image-and-architecture-v1"
toolchain_identity = "repository-file-digests-v1"
cache_identity = "content-digest-after-independent-verification-v1"
freshness_identity = "separate-observation-not-deterministic-input-v1"
execution_identity = "orchestrator-and-execution-subject-v1"

implementation_files = [
  "tools/qualification_envelope.py",
  ".github/actions/qualification-envelope/action.yml",
  "tools/qualification_guest_identity.py",
]

toolchain_files = [
  "Cargo.lock",
  "rust-toolchain.toml",
  "tools/codex/versions.env",
]

[authority_boundary]
role = "execution-context-only"
accepts_qualification_evidence = false
writes_pass_receipts = false
binds_verifier_results = false
binds_accepted_artifacts = false

[cache_policy]
cache_hit_is_qualification = false
content_digest_required = true
independent_verification_required = true
source_pass_reuse_allowed = false
qualification_evidence_cache_allowed = false
build_output_cache_allowed = false

[runner.github_hosted]
required_environment = ["RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"]
package_manager = "dpkg"
require_kernel_release = true
require_os_release_digest = true
require_package_manifest = true

[runner.physical]
required_environment = []
package_manager = "pacman"
require_kernel_release = true
require_os_release_digest = true
require_package_manifest = true
require_no_virtualization = true

[guest_profile.ubuntu_24_04_qemu]
architecture = "x86_64"
virtualization = "qemu"
acceleration = "tcg"
distribution_id = "ubuntu"
distribution_version = "24.04"
package_manager = "dpkg"

[guest_profile.arch_rolling_qemu]
architecture = "x86_64"
virtualization = "qemu"
acceleration = "tcg"
distribution_id = "arch"
distribution_version = "rolling"
package_manager = "pacman"

[[v09_adversarial_shard]]
id = "primary"
boundary_start = 1
boundary_end = 2
primary = true
final = false

[[v09_adversarial_shard]]
id = "persistence"
boundary_start = 3
boundary_end = 3
primary = false
final = false

[[v09_adversarial_shard]]
id = "security"
boundary_start = 4
boundary_end = 4
primary = false
final = false

[[v09_adversarial_shard]]
id = "connectivity"
boundary_start = 5
boundary_end = 6
primary = false
final = false

[[v09_adversarial_shard]]
id = "discovery-source"
boundary_start = 7
boundary_end = 8
primary = false
final = false

[[v09_adversarial_shard]]
id = "observation-plan"
boundary_start = 9
boundary_end = 10
primary = false
final = false

[[v09_adversarial_shard]]
id = "checkpoint"
boundary_start = 11
boundary_end = 11
primary = false
final = false

[[v09_adversarial_shard]]
id = "owner-final"
boundary_start = 12
boundary_end = 13
primary = false
final = true

