schema_version = 1
milestone = "v0.10.0"
slice = "S20"
profile = "arch-hyprland-v1"
dependency = "S16"
status = "proposed"
activation = "none"
register_runtime_operations = false
implements_new_effects = false
runtime_support_promotion = false
interactive_evidence_ready = false
indeterminate_replay = false
existing_operation_must_remain_unchanged = true
no_generic_provider_relay = true
no_shell_or_wpctl_executor = true
no_qml_owned_mutation = true
no_cross_uid_session_access = true
untrusted_media_metadata_is_authority = false
