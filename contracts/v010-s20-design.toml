identity_binding = "boot-user-session-bus-pipewire-core-node-serial-name-graph-generation"
verification = "independent-native-post-effect-observation"

[existing_registered_operation]
id = "operation:audio.output.set-session-volume"
provider = "pipewire"
observation = "audio.session.observe"
class = "transient-external-effect"
risk_floor = "user-state"
resource_prefix = "audio:session:output:"
change_keys = ["volume_percent"]
min_volume_percent = 0
max_volume_percent = 100
reused_not_duplicated = true
retain_exact_native_helper = true
retain_same_uid_session1 = true
retain_durable_audit_reservation = true
retain_strictly_newer_verification = true
do_not_claim_physical_q11 = true

[proposed_observation]
outputs = "audio.session.observe"
inputs = "audio.input.observe"
streams = "audio.stream.observe"
devices = "audio.device.observe"
media_players = "mpris.player.observe"
require_boot_session_and_real_bus_owner = true
require_pipewire_core_generation = true
require_node_id_serial_name_and_class = true
require_default_alias_read_only = true
require_exact_stream_links_for_route = true
distinguish_output_input_stream_and_profile = true
distinguish_hardware_mute_software_mute_and_capture = true
bound_and_sanitize_mpris_metadata = true
require_exact_mpris_owner_and_track = true
control_owns_observation_and_aggregation = true

