requires = ["purpose-bound-capture-consent", "compositor-protected-content-exclusion", "no-implicit-file-or-upload", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:utility.screenshot.save"
provider = "desktop-artifact"
observation = "utility.capture.observe"
class = "managed-external-effect"
risk_floor = "security-sensitive"
resource = "exact-owner-content-digest-destination-descriptor"
requested_keys = ["destination"]
requires = ["safe-user-file-descriptor", "atomic-publication", "no-symlink-hardlink-traversal", "independent-reobserve"]
enabled = false

[[candidate_operation]]
