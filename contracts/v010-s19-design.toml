[unsupported_extensions]
arbitrary_device_profiles = false
raw_gatt_read_write = false
arbitrary_sdp_control = false
global_default_agent_takeover = false
unmatched_incoming_pairing = false
generic_blueZ_method_relay = false
passkey_history = false
privileged_bluetoothctl_proxy = false

[qualification]
development_level = "level-a-arch-hyprland-exact-source"
interactive_vm_level = "level-b-arch-hyprland-exact-source"
physical_release_level = "level-c-maintained-hardware-q11"
virtual_hci_is_physical = false
video_is_correctness_oracle = false
require_adversarial = true
require_native_bond_and_agent_confirmation = true
require_physical_radio_for_hardware_claim = true
require_credential_redaction = true
require_indeterminate_no_replay = true
require_keyboard_pointer_accessibility = true
