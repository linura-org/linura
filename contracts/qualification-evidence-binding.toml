schema_version = 3
id = "qualification/evidence-binding"
repository = "linura-org/linura"
digest_algorithm = "sha256"
canonicalization = "json-sort-keys-compact-utf8-v1"
execution_envelope_contract = "contracts/qualification-execution-envelopes.toml"
execution_envelope_schema_version = 2
publication_policy = "contracts/evidence-publication.toml"
binding_model = "semantic-adapter-plus-envelope-plus-sealed-artifact-set-v3"

non_evidence_lanes = [
  "canonical-ci",
  "security-rustsec",
  "codeql",
  "codex-environment",
  "evidence-publication",
  "v09-qualification-contract",
  "v09-adversarial-security",
  "v09-adversarial-security-shard",
  "v010-workstation-contract",
  "trusted-release-proof",
  "v010-maintained-hardware",
]

[authority_boundary]
role = "evidence-acceptance-only"
consumes_execution_envelopes = true
mutates_execution_envelopes = false
grants_publication_authority = false
grants_release_authority = false

[acceptance]
self_declared_pass_allowed = false
stale_source_allowed = false
cross_envelope_substitution_allowed = false
cross_lane_substitution_allowed = false
missing_artifact_allowed = false
extra_artifact_claims_allowed = false
symlink_artifact_allowed = false
artifact_sha256_required = true
artifact_set_sha256_required = true
verifier_result_sha256_required = true
verifier_implementation_identity_required = true
semantic_verification_required = true
sealed_upload_required = true

[artifact_policy]
inventory = "recursive-bind-all-retained-files-v1"
control_files = [
  "qualification-execution-envelope.json",
  "qualification-execution-envelope.json.sha256",
  "verifier-result.json",
  "verifier-result.json.sha256",
  "evidence-binding.json",
  "evidence-binding.json.sha256",
]
required_artifacts_are_contract_owned = true
auxiliary_files_are_bound_not_claims = true
admission_must_immediately_precede_upload = true
reserved_control_basenames_forbidden_in_auxiliary = true
stable_no_follow_hashing_required = true
single_link_regular_files_required = true
accepted_upload_uses_sealed_copy = true
workflow_direct_accepted_upload_forbidden = true
post_upload_readback_required = true

[privacy]
physical_recording_publication = "explicit-approval-and-redaction-required"
private_evidence_default = true

[[profile]]
id = "vm-acceptance"
lane_id = "vm-acceptance"
verifier_adapter = "vm-acceptance-semantic-v1"
test_ids = ["qualification/vm-acceptance/result-v1"]
contract_ids = ["qualification/vm-acceptance/v1"]
verification_class = "deterministic-machine"
verifier_id = "vm-acceptance-verifier"
primary_artifact = "result"
accepted_results = ["passed"]
accepted_schema_versions = [2]
required_json_values = []
require_observation_identity = false
publication_default = "private"
[[profile.artifact]]
role = "result"
filename = "VM-ACCEPTANCE-EVIDENCE.json"
kind = "json-result"
[[profile.artifact]]
role = "runner_result"
filename = "acceptance-result.json"
kind = "file"

