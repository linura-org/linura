risk_floor = "user-state"
resource = "exact-authenticated-owner-density-schema-revision"
requested_keys = ["density"]
requires = ["authenticated-owner", "bounded-control-sizes", "keyboard-focus-safety", "revision-checked", "atomic-local-commit"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.motion.configure"
provider = "linura-local-personalization"
observation = "linura.personalization.preference.observe"
class = "linura-owned-state"
risk_floor = "user-state"
resource = "exact-authenticated-owner-motion-schema-revision"
requested_keys = ["reduced_motion"]
requires = ["authenticated-owner", "accessibility-user-override", "revision-checked", "atomic-local-commit"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.icons.configure"
provider = "linura-local-personalization"
observation = "linura.personalization.preference.observe"
class = "linura-owned-state"
risk_floor = "user-state"
resource = "exact-authenticated-owner-icon-family-schema-revision"
requested_keys = ["icon_family"]
requires = ["authenticated-owner", "installed-allowlisted-icon-family", "safe-resource-fallback", "revision-checked", "atomic-local-commit"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.wallpaper.configure"
provider = "linura-local-personalization"
observation = "linura.personalization.preference.observe"
class = "linura-owned-state"
risk_floor = "user-state"
resource = "exact-authenticated-owner-wallpaper-source-revision"
requested_keys = ["asset_digest", "fit_mode", "output_preferences"]
requires = ["authenticated-owner", "safe-content-hash-asset", "s21-output-topology-binding", "revision-checked", "atomic-local-commit", "no-native-provider-effect"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.profile.reset"
provider = "linura-local-personalization"
observation = "linura.personalization.preference.observe"
class = "linura-owned-state"
risk_floor = "user-state"
resource = "exact-authenticated-owner-preferences-root-revision"
requested_keys = ["reset_keys"]
requires = ["authenticated-owner", "explicit-reset-scope", "preserve-security-semantics", "revision-checked", "atomic-local-commit"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.wallpaper.apply"
provider = "desktop-wallpaper"
observation = "desktop.personalization.applied.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-session-compositor-output-generation-asset-digest"
requested_keys = ["asset_digest", "output_targets"]
requires = ["current-session-and-compositor", "s21-output-topology-binding", "safe-content-hash-asset", "narrow-adapter-no-shell", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.wallpaper.clear"
provider = "desktop-wallpaper"
observation = "desktop.personalization.applied.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-session-compositor-output-generation"
requested_keys = ["output_targets", "clear"]
requires = ["current-session-and-compositor", "s21-output-topology-binding", "narrow-adapter-no-shell", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:personalization.desktop.color-scheme.set"
provider = "desktop-appearance"
observation = "desktop.personalization.applied.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-session-appearance-provider-generation"
requested_keys = ["color_scheme"]
requires = ["real-native-provider-and-owner", "no-security-owner-mutation", "narrow-adapter-no-shell", "independent-reobserve"]
