unqualified_multidistribution_theme_engine = false
unbounded_svg_script_or_external_reference = false
theme_import_approval_or_authority_token = false
silent_cross_user_theme_sync = false

[qualification]
development_level = "level-a-exact-source-arch-hyprland"
interactive_vm_level = "level-b-exact-source-arch-hyprland"
physical_release_level = "level-c-maintained-hardware-q11"
mock_token_comparison_is_visual_proof = false
snapshot_png_is_full_accessibility_proof = false
