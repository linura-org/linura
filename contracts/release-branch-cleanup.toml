# Exact reviewed exceptions for release refs created before SHA-addressed automation
# became the normal contract. Pattern selection is reserved for new automation/*
# branches whose full expected commit SHA is embedded in the branch name. Any
# older or exceptional ref is eligible only when both its exact name and current
# SHA match this reviewed ledger. A moved ref is preserved.

