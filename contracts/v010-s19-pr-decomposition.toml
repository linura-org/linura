acceptance = ["Caller-owned StartDiscovery/StopDiscovery session, non-global filters, bounded lease, lifetime and cleanup without stopping a second client", "Separate reviewed adapter Powered/Discoverable/Pairable consequences with rfkill, privacy, inbound pairing exposure and authenticated subject checks", "Trusted operation registry fixes managed class and risk floors; durable prepare, independent reobserve and safe indeterminate state precede any activation", "Exact adapter/owner/lease generation; no scan-as-query shortcut or raw BlueZ method forwarding"]
