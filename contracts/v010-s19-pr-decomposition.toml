unsupported = "Fail closed; never claim Q11 from mock or virtual HCI"

[[pull_request]]
id = "S19-1"
slug = "bluez-observation"
title = "feat(bluetooth): establish bounded native BlueZ observation"
depends_on = []
external_effects = false
candidate_operations = []
capabilities = ["bluez.adapter.observe", "bluez.device.observe", "bluez.bond.observe"]
owned_paths = ["crates/linura-provider-bluez/", "apps/linurad/src/"]
requirements = ["R19-OBS-01", "R19-OBS-02", "R19-OBS-03"]
negative_cases = ["B19-01", "B19-02", "B19-03", "B19-04", "B19-05", "B19-06", "B19-07", "B19-16", "B19-19"]
acceptance = ["Real ObjectManager native read without BlueZ autostart or mutation; pinned and bounded owner-scoped response", "Unique owner and boot epoch bound across pre/post inventory reads; reconnect, owner swap, adapter reset and path reuse invalidate evidence", "Typed Adapter1 and Device1 inventory with parent relationship, address plus address type, explicit unknown bonding and profile readiness, provider-owned observations in canonical envelopes", "Bounded raw payload, object counts, variant nesting, UUIDs, strings and deadline; ambiguous, duplicate or oversized inventory rejected, not truncated", "Daemon registered to Control observer; no duplicate graph, policy engine, mutator or live effect registration"]
qualification = ["unit-malformed-fixtures", "level-a-real-bluez-objectmanager", "provider-regression", "observation-control-regression"]
blocked_until = ["Exact-source Rust unit/adversarial checks", "Native owner/hotplug proof for supported inventory", "Read-only capability and provider health remain separate from adapter hardware support"]

