[[markers]]
path = "docs/terminology.md"
contains = "**Principal:** authenticated authority identity used to namespace policy/review/approval state."

[[markers]]
path = "docs/terminology.md"
contains = "**Actor:** request-provenance identity and classification attached to a request/plan"

[[markers]]
path = "docs/provider-model.md"
contains = "Providers expose bounded mechanisms; Linura owns orchestration."

[[markers]]
path = "docs/state-model.md"
contains = "Retrieval context is not observed state."

[[markers]]
path = "docs/system-graph.md"
contains = "The System Graph is a materialized causal/evidence projection, not current-state authority."

[[markers]]
path = "docs/action-lifecycle.md"
contains = "The lifecycle does not require distributed two-phase commit across Linux subsystems."

[[markers]]
path = "agents/skills/providers.md"
contains = "Providers expose bounded mechanisms; Linura owns orchestration."

[[markers]]
path = "crates/linura-provider-sdk/src/lib.rs"
