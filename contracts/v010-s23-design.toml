schema_version = 1
milestone = "v0.10.0"
slice = "S23"
profile = "arch-hyprland-v1"
dependency = "S16"
downstream_slice = "S24"
status = "proposed"
activation = "none"
register_runtime_operations = false
implements_effects = false
runtime_support_promotion = false
interactive_evidence_ready = false
partial_upgrades_allowed = false
new_system_upgrade_authority = false
untrusted_package_sources_allowed = false
break_glass_is_control_permission = false
generic_root_pacman_shell = false
unknown_package_effect_is_success = false
assume_scriptlets_harmless = false
native_exit_code_is_verification = false
replay_indeterminate_transaction = false
implicit_package_rollback_claim = false
mime_edit_installs_package = false
desktop_entry_alias_grants_authority = false
preserve_existing_launcher = true
preserve_update_guard = true
signed_frozen_repository_required = true
complete_dependency_closure_required = true
protect_system_components = true
require_native_polkit_subject = true
require_immutable_alpm_transaction_plan = true
require_s24_lock_and_recovery_compatibility = true
require_independent_package_and_xdg_postconditions = true
offline_no_model_path_required = true
unsupported_behavior = "fail-closed"
existing_semantics = "contracts/operation-semantics.toml"
architecture = "docs/adr/0052-s23-application-package-and-default-handler-authority.md"
source_audit = "docs/workstreams/v010-s23-applications-phase1.md"
qualification_document = "docs/qualification/v0.10.0-s23.md"
security_qualification = "docs/qualification/v0.10.0-s23-security.md"

[existing_launcher]
file = "apps/linura-shell/integrations/xdg/ApplicationLauncherController.qml"
catalog = "DesktopEntries.applications"
fixed_user_broker = "/usr/bin/systemd-run"
app_slice = "app.slice"
exit_type = "cgroup"
filter_nodisplay = true
reject_terminal_required = true
reresolve_exact_desktop_id = true
not_package_install_authority = true

[existing_update_guard]
file = "apps/linura-update-guard/src/main.rs"
coordinator_context = "LINURA_UPDATE_CONTEXT"
native_break_glass = "LINURA_ALLOW_DIRECT_PACMAN"
break_glass_not_linura_permission = true
s24_owns_update_and_snapshots = true
no_s23_guard_override = true

[proposed_observation]
application = "desktop.application.observe"
installed = "alpm.package.installed.observe"
repository = "alpm.repository.catalog.observe"
preflight = "alpm.transaction.preflight.observe"
mime = "xdg.mime.association.observe"
require_desktop_file_source_revision = true
require_alpm_db_lock_and_boot_epoch = true
require_signed_snapshot_keyring_digest = true
require_complete_dependency_conflict_and_replaces_closure = true
require_xdg_handler_precedence = true
require_exact_visible_desktop_id_and_mime = true
control_owns_cross_provider_aggregation = true

[package_authority]
reject_partial_upgrade_and_unsynced_repos = true
reject_alpm_force_and_arbitrary_flags = true
reject_untrusted_aur_local_archives = true
deny_protected_system_dependency_removal = true
deny_when_s24_coordinator_lock_active = true
deny_if_recovery_precondition_unproven = true
require_full_dependency_and_scriptlet_impact_review = true
require_native_signature_and_pacman_lock = true
require_current_authenticated_polkit = true
require_durable_prepared_effect = true
require_independent_installed_version_and_file_verification = true
require_observe_only_indeterminate_recovery = true

[xdg_authority]
file = "mimeapps.list"
default_group = "Default Applications"
added_group = "Added Associations"
removed_group = "Removed Associations"
require_exact_user_owned_safe_file = true
require_original_file_content_revision = true
require_valid_mime_and_associated_desktop_id = true
require_user_config_precedence = true
require_atomic_non_symlink_write = true
require_effective_default_reobservation = true
preserve_unrelated_mime_groups = true
no_systemwide_write_or_install = true

[[candidate_operation]]
id = "operation:package.install"
provider = "alpm"
observation = "alpm.transaction.preflight.observe"
class = "managed-external-effect"
risk_floor = "security-sensitive"
resource = "exact-package-universe-source-db-lock-epoch"
requested_keys = ["install_targets"]
requires = ["frozen-signed-source", "complete-dependency-plan", "no-partial-upgrade", "s24-recovery-compatibility", "durable-prepare", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:package.remove"
provider = "alpm"
observation = "alpm.transaction.preflight.observe"
class = "managed-external-effect"
risk_floor = "destructive"
resource = "exact-installed-package-version-owners-dependency-closure"
requested_keys = ["remove_targets"]
requires = ["reverse-dependency-review", "protected-package-denial", "shared-owner-review", "s24-recovery-compatibility", "durable-prepare", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:package.reinstall"
provider = "alpm"
observation = "alpm.transaction.preflight.observe"
class = "managed-external-effect"
risk_floor = "security-sensitive"
resource = "exact-package-universe-name-version-db-epoch"
requested_keys = ["reinstall_targets"]
requires = ["same-version-exact-source", "no-partial-upgrade", "scriptlet-impact-review", "durable-prepare", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:package.orphans.remove"
provider = "alpm"
observation = "alpm.transaction.preflight.observe"
class = "managed-external-effect"
risk_floor = "destructive"
resource = "exact-local-db-unused-packages-and-owners-revision"
requested_keys = ["remove_targets"]
requires = ["explicit-exact-targets", "reverse-dependency-review", "protected-package-denial", "shared-owner-review", "durable-prepare", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:application.default.set"
provider = "xdg-mimeapps"
observation = "xdg.mime.association.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-xdg-config-mime-handler-revision"
requested_keys = ["mime_type", "desktop_id"]
requires = ["exact-associated-desktop-entry", "safe-atomic-user-config", "effective-precedence", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:application.default.reset"
provider = "xdg-mimeapps"
observation = "xdg.mime.association.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-xdg-config-mime-handler-revision"
requested_keys = ["mime_type", "reset"]
requires = ["safe-atomic-user-config", "no-false-empty-default", "effective-precedence", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:application.association.add"
provider = "xdg-mimeapps"
observation = "xdg.mime.association.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-xdg-config-added-association-revision"
requested_keys = ["mime_type", "desktop_id"]
requires = ["exact-associated-desktop-entry", "safe-atomic-user-config", "added-not-default", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:application.association.remove"
provider = "xdg-mimeapps"
observation = "xdg.mime.association.observe"
class = "managed-external-effect"
risk_floor = "user-state"
resource = "exact-user-xdg-config-removed-association-revision"
requested_keys = ["mime_type", "desktop_id"]
requires = ["current-associated-desktop-entry", "safe-atomic-user-config", "removal-impact-review", "independent-reobserve"]
enabled = false

[[candidate_operation]]
id = "operation:application.favorite.configure"
provider = "linura-local-application-preferences"
observation = "linura.application.preferences.observe"
class = "linura-owned-state"
risk_floor = "user-state"
resource = "exact-current-user-application-preferences-revision"
requested_keys = ["desktop_id", "favorite"]
requires = ["authenticated-owner", "exact-current-visible-desktop-entry", "revision-check", "atomic-local-commit", "no-launch-grant"]
enabled = false

[unsupported_extensions]
aur_pkgbuild_install = false
arbitrary_package_archive_install = false
untrusted_or_new_repository_mutation = false
generic_flatpak_snap_backend = false
partial_system_upgrade = false
raw_pacman_options_and_shell = false
automatic_s24_snapshot_claim = false
systemwide_mime_association_write = false
untrusted_desktop_exec_as_package_command = false

[qualification]
level_a = "exact-source-arch-pacman-xdg-native-vm"
level_b = "exact-source-interactive-hyprland-vm"
level_c = "maintained-nonvirtual-workstation-q11"
synthetic_alpm_db_is_native_effect_proof = false
vm_install_is_physical_recovery_proof = false
video_is_correctness_oracle = false
require_s12_s14_launcher_regression = true
require_real_alpm_lock_and_package_transactions = true
require_native_trust_signature_failures = true
require_partial_upgrade_denial = true
require_s24_update_lock_separation = true
require_xdg_mime_precedence_and_safe_write = true
require_adversarial = true
require_interruption_no_replay = true
require_accessibility_and_no_model = true

# Candidate implementation PR boundaries. Design planning ONLY; no registered effects.
[pr_decomposition]
status = "proposed"
adaptive = true
planned_pr_count = 6
branch = "wip/v010-s23-applications"
implementation_base = "main"
merge_wip_directly = false
register_effects_from_design = false
allow_document_only_slice_completion = false
require_independent_pr_verification = true
require_exact_head_applicable_gates = true
require_physical_q11_for_release = true
s24_keeps_coordinated_upgrade_ownership = true
unqualified_package_operations_remain_disabled = true

[[implementation_pr]]
id = "S23-1"
title = "Application discovery and identity"
depends_on = []
phase = "read-only-observation"
owner = "xdg-application-catalog"
source_areas = ["apps/linura-shell/integrations/xdg/","crates/linura-linux-observation/","crates/linura-observation/"]
requirements = ["R23-APP-01","R23-OBS-01"]
capabilities = ["typed visible XDG application inventory","desktop entry identity and ordered source precedence","current UID/session and file revision binding","re-resolution at use; preserve fixed user-systemd app.slice broker"]
acceptance = ["catalog matches currently eligible XDG entries without exposing Exec argv","shadowed/changed desktop entries cannot retarget launch","S12/S14 launcher and command palette regressions unchanged"]
adversarial_cases = ["P23-01","P23-02","P23-03","P23-18","P23-28"]
native_levels = ["A","B"]
activation = "observation-only"
candidate_effect_enabled = false

[[implementation_pr]]
id = "S23-2"
title = "Native ALPM installed and repository observation"
depends_on = []
phase = "read-only-observation"
owner = "arch-package-observation"
source_areas = ["crates/linura-linux-observation/","crates/linura-observation/","crates/linura-observation-control/"]
requirements = ["R23-OBS-01","R23-PKG-01"]
capabilities = ["read-only local ALPM installed name epoch version release arch reason ownership","signed and frozen repository catalog provenance with keyring/sync database digest","bounded freshness, local DB lock and coherent PackageUniverseEpoch","unknown/offline/incomplete data is explicitly unavailable"]
acceptance = ["real Arch local package observations preserve exact installed and available distinctions","source/keyring/database drift invalidates frozen catalog","no pacman package effects or update coordinator bypass"]
adversarial_cases = ["P23-05","P23-06","P23-16","P23-29"]
native_levels = ["A"]
activation = "observation-only"
candidate_effect_enabled = false

[[implementation_pr]]
id = "S23-3"
title = "Dependency closure and protected transaction preflight"
depends_on = ["S23-2"]
phase = "planning-only"
owner = "package-plan-and-impact"
source_areas = ["crates/linura-planner/","crates/linura-control/","crates/linura-provider-sdk/"]
requirements = ["R23-PKG-01","R23-PKG-02","R23-AUTH-01"]
capabilities = ["deterministic complete install/remove/reinstall dependency and reverse dependency closure","immutable exact source/database/lock and reviewed desired state","protected Linura/PAM/Polkit/kernel/seat/session/shared ownership impact","scriptlet/hooks/unknown disk and recovery consequences surfaced, not asserted harmless","no-partial-upgrade and S24 update handoff guard"]
acceptance = ["preflight is reproducible against unchanged frozen repository and installed graph","mismatch, stale lock, untrusted flags and unqualified recovery deny","planner emits canonical non-executable plan, never pacman command authority"]
adversarial_cases = ["P23-04","P23-07","P23-08","P23-10","P23-11","P23-12","P23-16","P23-24"]
native_levels = ["A"]
activation = "disabled-effect"
candidate_effect_enabled = false

[[implementation_pr]]
id = "S23-4"
title = "Authenticated managed ALPM operations and recovery"
depends_on = ["S23-3"]
phase = "managed-effect"
owner = "package-effect-and-verification"
source_areas = ["crates/linura-control/","crates/linura-lifecycle/","executors/","crates/linura-linux-observation/"]
requirements = ["R23-PKG-01","R23-PKG-02","R23-PKG-03","R23-AUTH-01"]
capabilities = ["trusted registered managed operation and unforgeable current Polkit principal","durable authorized prepare with exact package universe and S24 lock interlock","narrow native ALPM dispatch without raw flags, shell or direct-update bypass","independent installed package/file/owner postcondition verification","indeterminate interruption yields observe-only reconcile without blind replay"]
acceptance = ["real pinned signed Arch package install/remove/reinstall/selected orphan transactions in disposable VM","lost reply, crash and scriptlet faults cannot report verified success","exact-head security review and safe recovery requirement satisfied before operation activation"]
adversarial_cases = ["P23-03","P23-04","P23-05","P23-06","P23-07","P23-08","P23-09","P23-10","P23-11","P23-12","P23-13","P23-14","P23-15","P23-24","P23-25","P23-26","P23-30"]
native_levels = ["A","B"]
activation = "disabled-until-qualified"
candidate_effect_enabled = false

[[implementation_pr]]
id = "S23-5"
title = "User-level MIME defaults, associations and favorites"
depends_on = ["S23-1"]
phase = "managed-user-effect"
owner = "xdg-handler-and-local-preferences"
source_areas = ["crates/linura-linux-observation/","crates/linura-control/","apps/linura-shell/plugins/default-apps/","apps/linura-shell/plugins/applications/"]
requirements = ["R23-XDG-01","R23-XDG-02","R23-AUTH-01"]
capabilities = ["effective XDG MIME and scheme precedence with eligible desktop source","revision-bound set/reset default and add/remove association typed separately","safe user-owned descriptor and atomic replacement; preserve unrelated groups","fresh independently effective handler verification and fallback after reset","optional revisioned Linura-owned favorites with no launch or installation grant"]
acceptance = ["native XDG precedence including higher-priority shadow configuration proven","symlink, hardlink, race and foreign UID fail closed","fallback after reset and added/removed associations are accurate"]
adversarial_cases = ["P23-17","P23-18","P23-19","P23-20","P23-21","P23-22","P23-23","P23-25","P23-26","P23-30"]
native_levels = ["A","B"]
activation = "disabled-until-qualified"
candidate_effect_enabled = false

[[implementation_pr]]
id = "S23-6"
title = "Application and package experience plus qualification"
depends_on = ["S23-1","S23-2","S23-3","S23-4","S23-5"]
phase = "experience-and-qualification"
owner = "first-party-ui-and-native-acceptance"
source_areas = ["apps/linura-shell/plugins/applications/","apps/linura-shell/plugins/packages/","apps/linura-shell/plugins/default-apps/","apps/linuractl/","crates/linura-sdk/","qualification/v010/"]
requirements = ["R23-UX-01","R23-QUAL-01","R23-APP-01"]
capabilities = ["one Control-backed typed state and operation surface shared across UI CLI SDK","accessibility, focus/keyboard, HiDPI, progress, no-model and offline truthfulness","package provenance and full impact review before any managed effect","actual disposable Arch A, interactive Hyprland B, separate physical Q11 C evidence","regression inheritance for S12/S14, update guard, S17/S21, S24 handoff"]
acceptance = ["all 30 S23 adversarial cases traced with exact-head unit/native/security evidence","no UI-approved optimistic outcome without independently verified state","missing physical Q11 and unsupported recovery remain explicit blockers"]
