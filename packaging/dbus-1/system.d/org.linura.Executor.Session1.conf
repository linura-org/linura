<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.linura.Executor.Session1" send_interface="org.linura.Executor.Session1"/>
    <allow send_destination="org.linura.Executor.Session1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.linura.Executor.Session1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.linura.Executor.Session1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy user="linura-authority">
    <allow send_destination="org.linura.Executor.Session1"/>
  </policy>
  <policy user="root">
    <allow own="org.linura.Executor.Session1"/>
    <deny send_destination="org.linura.Executor.Session1" send_interface="org.linura.Executor.Session1"/>
  </policy>
</busconfig>
