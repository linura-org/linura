<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="linura-authority">
    <allow own="org.linura.Authority1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.linura.Authority1"/>
    <deny send_destination="org.linura.Authority1" send_interface="org.linura.SleepGate1"/>
    <deny send_destination="org.linura.Authority1" send_path="/org/linura/SleepGate1"/>
  </policy>
  <policy user="root">
    <!-- Admission only. Control still attests the exact received helper PID,
         invocation, immutable program and pre-kernel phase; root is not policy. -->
    <allow send_destination="org.linura.Authority1" send_path="/org/linura/SleepGate1" send_interface="org.linura.SleepGate1"/>
  </policy>
</busconfig>
