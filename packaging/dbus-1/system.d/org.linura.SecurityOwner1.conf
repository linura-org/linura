<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The owner never owns a well-known name. The default rule denies all
       calls to this private object. Only separately attested supervised
       callers may invoke its methods; bus admission is not authorization. -->
  <policy context="default">
    <deny send_type="method_call" send_path="/org/linura/SecurityOwner1"/>
  </policy>
  <policy user="linura-authority">
    <allow send_type="method_call" send_path="/org/linura/SecurityOwner1"
           send_interface="org.linura.SecurityOwner1"/>
    <!-- NativeSessionChannel::discover needs only this read-only method.
         Do not permit arbitrary Introspectable or Properties calls. -->
    <allow send_type="method_call" send_path="/org/linura/SecurityOwner1"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>
  <policy user="root">
    <allow send_type="method_call" send_path="/org/linura/SecurityOwner1"
           send_interface="org.linura.SecurityOwner1"/>
    <allow send_type="method_call" send_path="/org/linura/SecurityOwner1"
           send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>
</busconfig>
