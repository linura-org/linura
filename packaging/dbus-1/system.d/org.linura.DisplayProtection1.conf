<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.linura.DisplayProtection1"/>
    <!-- Runtime authenticates the exact root-supervised owner. Other methods
         remain denied; a startup lease grants no privileged effect authority. -->
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="NativeStartup"/>
  </policy>
  <policy user="linura-authority">
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadOrdinaryOriginal"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReserveFinalRetirement"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="CompleteReleasedCurrent"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadFinalRetirement"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReserveCurrentCommit"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="RetireRootPower"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadRootPower"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadOriginal"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadFinalization"/>
    <!-- These bounded continuations still require the exact runtime-attested
         Control process and durable plan-bound preparation. No wildcard. -->
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadCompletion"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReservePowerRetirement"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReadPowerRetirement"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="PrepareRetirement"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="RetireHeld"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReserveNativeRelease"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReserveNativeReleaseGrant"/>
    <allow send_destination="org.linura.DisplayProtection1"
           send_interface="org.linura.DisplayProtection1" send_member="ReserveCompletionGrant"/>
  </policy>
  <policy user="root">
    <allow own="org.linura.DisplayProtection1"/>
    <allow send_destination="org.linura.DisplayProtection1"/>
  </policy>
</busconfig>
