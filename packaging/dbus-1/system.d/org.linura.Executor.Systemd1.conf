<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The privileged executor process is root-owned, but root is not a product
       caller. Mutation methods on the executor interface are authority-only.
       Standard read-only D-Bus metadata interfaces remain visible so contract
       introspection can prove the live surface without granting mutation. -->
  <policy context="default">
    <deny send_destination="org.linura.Executor.Systemd1"
          send_interface="org.linura.Executor.Systemd1"/>
    <allow send_destination="org.linura.Executor.Systemd1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.linura.Executor.Systemd1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.linura.Executor.Systemd1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy user="linura-authority">
    <allow send_destination="org.linura.Executor.Systemd1"/>
  </policy>
  <policy user="root">
    <allow own="org.linura.Executor.Systemd1"/>
    <deny send_destination="org.linura.Executor.Systemd1"
          send_interface="org.linura.Executor.Systemd1"/>
  </policy>
</busconfig>
